// مساعدات بناء ملف DOCX حقيقي (ZIP Store + OOXML) يفتح على أي جوال
function xmlEscape(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function rgbToHex(color) {
  if (!color) return null;
  const trimmed = color.trim().toLowerCase();
  if (trimmed === 'transparent' || trimmed === 'none' || trimmed === 'inherit' || trimmed === 'initial') return null;
  if (trimmed.startsWith('#')) {
    let h = trimmed.slice(1);
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return /^[0-9a-f]{6}$/i.test(h) ? h.toUpperCase() : null;
  }
  const rgbaMatch = trimmed.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/i);
  if (!rgbaMatch) return null;
  if (rgbaMatch[4] !== undefined && parseFloat(rgbaMatch[4]) === 0) return null;
  return [rgbaMatch[1], rgbaMatch[2], rgbaMatch[3]]
    .map(n => Math.max(0, Math.min(255, Number(n))).toString(16).padStart(2, '0'))
    .join('')
    .toUpperCase();
}

function cssSizeToHalfPoints(sizeStr) {
  if (!sizeStr) return null;
  const m = String(sizeStr).trim().match(/^([\d.]+)\s*(px|pt)$/i);
  if (!m) return null;
  const val = parseFloat(m[1]);
  if (!(val > 0)) return null;
  const pt = m[2].toLowerCase() === 'px' ? (val * 0.75) : val;
  return Math.max(12, Math.round(pt * 2));
}

function buildZipStore(entries) {
  const enc = new TextEncoder();
  const crcTable = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[i] = c >>> 0;
  }
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  const localParts = [];
  const centralParts = [];
  let offset = 0;

  entries.forEach(entry => {
    const nameBytes = enc.encode(entry.name);
    const data = entry.data instanceof Uint8Array ? entry.data : enc.encode(entry.data);
    const crc = crc32(data);
    const size = data.length;

    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034B50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    localParts.push(lh, data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014B50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);

    centralParts.push(ch);
    offset += lh.length + size;
  });

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054B50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], {
    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
}

// 3. تصدير Word حقيقي (.docx) بمقاس A4 واتجاه عربي يفتح على أي جوال
async function convertWebpForDocx(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = function() {
      try {
        const w = img.naturalWidth || 400;
        const h = img.naturalHeight || 300;
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        if (!ctx) { resolve(dataUrl); return; }
        ctx.drawImage(img, 0, 0, w, h);
        let hasAlpha = false;
        try {
          const px = ctx.getImageData(0, 0, w, h).data;
          for (let i = 3; i < px.length; i += 4) {
            if (px[i] < 250) { hasAlpha = true; break; }
          }
        } catch (e) {}
        if (!hasAlpha) {
          ctx.globalCompositeOperation = 'destination-over';
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, w, h);
          ctx.globalCompositeOperation = 'source-over';
        }
        resolve(hasAlpha ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.88));
      } catch (e) {
        resolve(dataUrl);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function exportWord(fileName) {
  const liveImgs = Array.from(editor.querySelectorAll('img'));
  const editorWidthPx = editor.clientWidth || (isLandscape ? 1000 : 700);
  liveImgs.forEach(img => {
    if (img.naturalWidth > 0) img.setAttribute('data-nw', String(img.naturalWidth));
    if (img.naturalHeight > 0) img.setAttribute('data-nh', String(img.naturalHeight));
    const cell = img.closest('td, th');
    img.setAttribute('data-cw', String((cell && cell.clientWidth) || editorWidthPx));
  });
  const clone = editor.cloneNode(true);
  liveImgs.forEach(img => {
    img.removeAttribute('data-nw');
    img.removeAttribute('data-nh');
    img.removeAttribute('data-cw');
  });

  const cloneImgs = Array.from(clone.querySelectorAll('img'));
  for (const img of cloneImgs) {
    img.classList.remove('img-selected');
    img.style.outline = 'none';
    const src = img.getAttribute('src') || '';
    if (/^data:image\/webp;base64,/i.test(src)) {
      const converted = await convertWebpForDocx(src);
      img.setAttribute('src', converted);
    }
  }

  const mediaFiles = [];
  const fontSizeMap = { '1': 20, '2': 24, '3': 28, '4': 36, '5': 48, '6': 64, '7': 96 };
  const headingSizeMap = { H1: 44, H2: 36, H3: 32, H4: 28, H5: 26, H6: 24 };

  function getImageAlignment(imgEl) {
    const cs = imgEl.style || {};
    const ml = (cs.marginLeft || '').trim();
    const mr = (cs.marginRight || '').trim();
    if (ml === 'auto' && mr === 'auto') return 'center';
    if (ml === 'auto' && (mr === '0' || mr === '0px')) return 'right';
    if ((ml === '0' || ml === '0px') && mr === 'auto') return 'left';
    return null;
  }

  function getImageWidthRatio(imgEl) {
    const cs = imgEl.style || {};
    const cellWidth = parseFloat(imgEl.getAttribute('data-cw')) || editorWidthPx;
    const cellRatio = Math.min(1, cellWidth / editorWidthPx);
    const wStr = (cs.width || '').trim();
    let ratio = 0;
    if (wStr.endsWith('%')) {
      const pct = parseFloat(wStr);
      if (pct > 0) ratio = (pct / 100) * (cellWidth / editorWidthPx);
    } else if (wStr.endsWith('px')) {
      const px = parseFloat(wStr);
      if (px > 0) ratio = px / editorWidthPx;
    } else if (imgEl.getAttribute('width')) {
      const attrW = parseFloat(imgEl.getAttribute('width'));
      if (attrW > 0) ratio = attrW / editorWidthPx;
    }
    if (!ratio) {
      const nw = parseFloat(imgEl.getAttribute('data-nw')) || imgEl.naturalWidth || 400;
      ratio = nw / editorWidthPx;
    }
    return Math.max(0.01, Math.min(ratio, cellRatio, 1));
  }

  function buildRunProps(st) {
    let rPr = st.ltr ? '' : '<w:rtl/>';
    if (st.bold) rPr += '<w:b/><w:bCs/>';
    if (st.italic) rPr += '<w:i/><w:iCs/>';
    if (st.underline) rPr += '<w:u w:val="single"/>';
    if (st.strike) rPr += '<w:strike/>';
    if (st.color) rPr += `<w:color w:val="${st.color}"/>`;
    if (st.bgColor) rPr += `<w:shd w:val="clear" w:color="auto" w:fill="${st.bgColor}"/>`;
    const sz = st.size || 28;
    rPr += `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`;
    const font = st.font || 'Cairo';
    rPr += `<w:rFonts w:ascii="${xmlEscape(font)}" w:hAnsi="${xmlEscape(font)}" w:cs="${xmlEscape(font)}"/>`;
    rPr += '<w:lang w:val="en-US" w:bidi="ar-SA"/>';
    return `<w:rPr>${rPr}</w:rPr>`;
  }

  function extractRuns(node, st, runs, meta) {
    if (node.nodeType === Node.TEXT_NODE) {
      const txt = node.nodeValue;
      if (txt) {
        runs.push(`<w:r>${buildRunProps(st)}<w:t xml:space="preserve">${xmlEscape(txt)}</w:t></w:r>`);
      }
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;

    const tag = node.tagName.toUpperCase();
    if (tag === 'BR') {
      runs.push('<w:r><w:br/></w:r>');
      return;
    }
    if (tag === 'IMG') {
      const src = node.getAttribute('src') || '';
      const m = src.match(/^data:image\/(png|jpeg|jpg|gif|webp);base64,(.+)$/i);
      if (m) {
        const ext = m[1].toLowerCase() === 'jpg' ? 'jpeg' : m[1].toLowerCase();
        const bin = atob(m[2]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const idx = mediaFiles.length + 1;
        const rId = 'rIdImg' + idx;
        mediaFiles.push({ name: `word/media/image${idx}.${ext}`, ext, rId, data: bytes });
        const maxCx = isLandscape ? 8500000 : 5400000;
        const ratio = getImageWidthRatio(node);
        const w = parseFloat(node.getAttribute('data-nw')) || node.naturalWidth || 400;
        const h = parseFloat(node.getAttribute('data-nh')) || node.naturalHeight || 300;
        const cx = Math.max(180000, Math.round(maxCx * ratio));
        const cy = Math.max(180000, Math.round(cx * (h / Math.max(1, w))));
        const imgAlign = getImageAlignment(node);
        if (meta && imgAlign && !meta.imgAlign) {
          meta.imgAlign = imgAlign;
        }
        runs.push(`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${idx}" name="Picture ${idx}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${idx}" name="Picture ${idx}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`);
      }
      return;
    }

    const next = Object.assign({}, st);
    if (tag === 'B' || tag === 'STRONG' || tag === 'TH') next.bold = true;
    if (tag === 'I' || tag === 'EM') next.italic = true;
    if (tag === 'U') next.underline = true;
    if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') next.strike = true;
    if (tag === 'MARK') next.bgColor = next.bgColor || 'FFFF00';
    if (node.getAttribute && node.getAttribute('dir') === 'ltr') next.ltr = true;
    if (node.getAttribute && node.getAttribute('dir') === 'rtl') next.ltr = false;
    if (tag === 'FONT') {
      if (node.getAttribute('face')) next.font = node.getAttribute('face');
      if (node.getAttribute('color')) next.color = rgbToHex(node.getAttribute('color')) || next.color;
      if (node.getAttribute('size') && fontSizeMap[node.getAttribute('size')]) next.size = fontSizeMap[node.getAttribute('size')];
    }
    const cs = node.style;
    if (cs) {
      if (cs.direction === 'ltr') next.ltr = true;
      if (cs.direction === 'rtl') next.ltr = false;
      if (cs.fontWeight === 'bold' || Number(cs.fontWeight) >= 600) next.bold = true;
      if (cs.fontStyle === 'italic') next.italic = true;
      if (cs.textDecoration && cs.textDecoration.includes('underline')) next.underline = true;
      if (cs.textDecoration && cs.textDecoration.includes('line-through')) next.strike = true;
      if (cs.color) next.color = rgbToHex(cs.color) || next.color;
      if (cs.backgroundColor) next.bgColor = rgbToHex(cs.backgroundColor) || next.bgColor;
      if (cs.fontSize) {
        const hp = cssSizeToHalfPoints(cs.fontSize);
        if (hp) next.size = hp;
      }
      if (cs.fontFamily) next.font = cs.fontFamily.replace(/['"]/g, '').split(',')[0].trim();
    }

    for (const child of node.childNodes) {
      extractRuns(child, next, runs, meta);
    }
  }

  function getDir(el) {
    let curr = el;
    while (curr && curr.nodeType === 1) {
      const d = (curr.style && curr.style.direction) || (curr.getAttribute && curr.getAttribute('dir'));
      if (d === 'ltr' || d === 'rtl') return d;
      curr = curr.parentNode;
    }
    return 'rtl';
  }

  function getAlign(el, defaultAlign) {
    let curr = el;
    while (curr && curr.nodeType === 1) {
      const a = (curr.style && curr.style.textAlign) || (curr.getAttribute && curr.getAttribute('align')) || '';
      if (a === 'center') return 'center';
      if (a === 'left') return 'left';
      if (a === 'right') return 'right';
      if (a === 'justify') return 'both';
      curr = curr.parentNode;
    }
    return defaultAlign || 'both';
  }

  function makeParagraphXml(runs, align, dir, extraPPr = '') {
    const jc = align || 'both';
    const bidiTag = dir === 'ltr' ? '' : '<w:bidi w:val="1"/>';
    return `<w:p><w:pPr>${bidiTag}<w:jc w:val="${jc}"/>${extraPPr}</w:pPr>${runs.join('')}</w:p>`;
  }

  const bodyBlocks = [];
  function pushParagraph(runs, align, dir, extraPPr = '') {
    bodyBlocks.push(makeParagraphXml(runs, align, dir || 'rtl', extraPPr));
  }

  function buildTableXml(tblEl) {
    const tblDir = getDir(tblEl);
    const bidiVisual = tblDir === 'ltr' ? '' : '<w:bidiVisual/>';
    const rows = Array.from(tblEl.querySelectorAll(':scope > tr, :scope > thead > tr, :scope > tbody > tr, :scope > tfoot > tr'));
    if (!rows.length) return '';

    const columnCount = Math.max(1, ...rows.map(row => Array.from(row.children).reduce((sum, cell) => {
      const tag = cell.tagName ? cell.tagName.toUpperCase() : '';
      return sum + ((tag === 'TD' || tag === 'TH') ? Math.max(1, parseInt(cell.getAttribute('colspan') || '1', 10)) : 0);
    }, 0)));
    const gridColWidth = Math.floor(9600 / columnCount);
    const tblGridXml = `<w:tblGrid>${Array.from({length: columnCount}, () => `<w:gridCol w:w="${gridColWidth}"/>`).join('')}</w:tblGrid>`;
    const occupied = {};
    let trXml = '';

    rows.forEach((tr, rIdx) => {
      let tcXml = '';
      let cIdx = 0;

      function emitMergedPlaceholders() {
        while (occupied[rIdx + '_' + cIdx]) {
          const spanInfo = occupied[rIdx + '_' + cIdx];
          const gs = spanInfo.colspan > 1 ? `<w:gridSpan w:val="${spanInfo.colspan}"/>` : '';
          const shd = spanInfo.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${spanInfo.fill}"/>` : '';
          tcXml += `<w:tc><w:tcPr>${gs}<w:vMerge/>${shd}</w:tcPr><w:p><w:pPr><w:bidi w:val="1"/><w:jc w:val="both"/></w:pPr></w:p></w:tc>`;
          cIdx += spanInfo.colspan;
        }
      }

      emitMergedPlaceholders();

      for (const cell of tr.children) {
        const cTag = cell.tagName ? cell.tagName.toUpperCase() : '';
        if (cTag !== 'TD' && cTag !== 'TH') continue;

        emitMergedPlaceholders();

        const colspan = Math.max(1, parseInt(cell.getAttribute('colspan') || '1', 10));
        const rowspan = Math.max(1, parseInt(cell.getAttribute('rowspan') || '1', 10));
        const cs = cell.style || {};
        let fill = rgbToHex(cs.backgroundColor);
        if (!fill && cTag === 'TH') fill = 'F1F5F9';

        if (rowspan > 1) {
          for (let rr = 1; rr < rowspan; rr++) {
            occupied[(rIdx + rr) + '_' + cIdx] = { colspan, fill };
          }
        }

        let tcPr = '';
        if (cs.width && cs.width.endsWith('%')) {
          const pct = Math.round(parseFloat(cs.width) * 50);
          if (pct > 0) tcPr += `<w:tcW w:w="${pct}" w:type="pct"/>`;
        } else {
          tcPr += '<w:tcW w:w="0" w:type="auto"/>';
        }
        if (colspan > 1) tcPr += `<w:gridSpan w:val="${colspan}"/>`;
        if (rowspan > 1) tcPr += '<w:vMerge w:val="restart"/>';
        if (fill) tcPr += `<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`;
        if (cs.verticalAlign === 'middle') tcPr += '<w:vAlign w:val="center"/>';
        else if (cs.verticalAlign === 'bottom') tcPr += '<w:vAlign w:val="bottom"/>';
        else tcPr += '<w:vAlign w:val="top"/>';

        const cellBlocks = [];
        const baseStyle = cTag === 'TH' ? { bold: true } : {};
        const cellDir = getDir(cell);
        const cellAlign = getAlign(cell, 'both');

        let cellInline = [];
        let cellInlineMeta = {};
        function flushCellInline() {
          if (cellInline.length) {
            cellBlocks.push(makeParagraphXml(cellInline, cellInlineMeta.imgAlign || cellAlign, cellDir));
            cellInline = [];
            cellInlineMeta = {};
          }
        }

        for (const ch of cell.childNodes) {
          if (ch.nodeType === Node.TEXT_NODE) {
            if (ch.nodeValue.trim() || ch.nodeValue.includes(' ')) {
              extractRuns(ch, baseStyle, cellInline, cellInlineMeta);
            }
          } else if (ch.nodeType === Node.ELEMENT_NODE) {
            const chTag = ch.tagName.toUpperCase();
            if (chTag === 'P' || chTag === 'DIV' || /^H[1-6]$/.test(chTag)) {
              flushCellInline();
              const runs = [];
              const pMeta = {};
              extractRuns(ch, baseStyle, runs, pMeta);
              cellBlocks.push(makeParagraphXml(runs, pMeta.imgAlign || getAlign(ch, cellAlign), getDir(ch)));
            } else if (chTag === 'TABLE') {
              flushCellInline();
              cellBlocks.push(buildTableXml(ch));
            } else {
              extractRuns(ch, baseStyle, cellInline, cellInlineMeta);
            }
          }
        }
        flushCellInline();
        if (!cellBlocks.length) {
          cellBlocks.push(makeParagraphXml([], cellAlign, cellDir));
        }

        tcXml += `<w:tc><w:tcPr>${tcPr}</w:tcPr>${cellBlocks.join('')}</w:tc>`;
        cIdx += colspan;
      }

      emitMergedPlaceholders();
      trXml += `<w:tr>${tcXml}</w:tr>`;
    });

    return `<w:tbl>
      <w:tblPr>
        ${bidiVisual}
        <w:tblW w:w="5000" w:type="pct"/>
        <w:tblBorders>
          <w:top w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:left w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:bottom w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:right w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:insideH w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:insideV w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
        </w:tblBorders>
        <w:tblCellMar>
          <w:top w:w="80" w:type="dxa"/>
          <w:left w:w="100" w:type="dxa"/>
          <w:bottom w:w="80" w:type="dxa"/>
          <w:right w:w="100" w:type="dxa"/>
        </w:tblCellMar>
      </w:tblPr>
      ${tblGridXml}
      ${trXml}
    </w:tbl>`;
  }

  let inlineBuffer = [];
  let inlineMeta = {};
  function flushInline(dir, align) {
    if (inlineBuffer.length) {
      pushParagraph(inlineBuffer, inlineMeta.imgAlign || align || 'both', dir || 'rtl');
      inlineBuffer = [];
      inlineMeta = {};
    }
  }

  function hasBlockChild(el) {
    for (const ch of el.childNodes) {
      if (ch.nodeType === 1) {
        const t = ch.tagName.toUpperCase();
        if (['P', 'DIV', 'TABLE', 'UL', 'OL', 'BLOCKQUOTE', 'PRE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(t)) {
          return true;
        }
      }
    }
    return false;
  }

  function walkBlocks(container) {
    for (const node of container.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (node.nodeValue.trim() || node.nodeValue.includes(' ')) {
          extractRuns(node, {}, inlineBuffer, inlineMeta);
        }
        continue;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) continue;
      const tag = node.tagName.toUpperCase();

      if (tag === 'TABLE') {
        flushInline(getDir(container), getAlign(container));
        const tblXml = buildTableXml(node);
        if (tblXml) bodyBlocks.push(tblXml);
      } else if (tag === 'UL' || tag === 'OL') {
        flushInline(getDir(container), getAlign(container));
        let idx = 1;
        for (const li of node.children) {
          if (li.tagName && li.tagName.toUpperCase() === 'LI') {
            const prefix = tag === 'OL' ? `${idx++}. ` : '• ';
            const runs = [`<w:r><w:rPr><w:rtl/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr><w:t xml:space="preserve">${xmlEscape(prefix)}</w:t></w:r>`];
            const liMeta = {};
            extractRuns(li, {}, runs, liMeta);
            pushParagraph(runs, liMeta.imgAlign || getAlign(li), getDir(li));
          }
        }
      } else if (tag === 'DIV' && hasBlockChild(node)) {
        flushInline(getDir(container), getAlign(container));
        walkBlocks(node);
      } else if (tag === 'P' || tag === 'DIV' || tag === 'BLOCKQUOTE' || tag === 'PRE' || /^H[1-6]$/.test(tag)) {
        flushInline(getDir(container), getAlign(container));
        const runs = [];
        const pMeta = {};
        let base = {};
        let extraPPr = '';
        if (/^H[1-6]$/.test(tag)) {
          base = { bold: true, size: headingSizeMap[tag] || 28 };
          extraPPr = `<w:pStyle w:val="Heading${tag.slice(1)}"/>`;
        } else if (tag === 'BLOCKQUOTE') {
          base = { color: '475569' };
          extraPPr = '<w:pBdr><w:right w:val="single" w:sz="18" w:space="8" w:color="2563EB"/></w:pBdr><w:shd w:val="clear" w:color="auto" w:fill="F8FAFC"/><w:ind w:right="360"/>';
        } else if (tag === 'PRE') {
          base = { ltr: true, font: 'Courier New', size: 22 };
        }
        extractRuns(node, base, runs, pMeta);
        pushParagraph(runs, pMeta.imgAlign || getAlign(node), getDir(node), extraPPr);
      } else {
        extractRuns(node, {}, inlineBuffer, inlineMeta);
      }
    }
    flushInline(getDir(container), getAlign(container));
  }

  walkBlocks(clone);
  if (!bodyBlocks.length) bodyBlocks.push('<w:p><w:pPr><w:bidi w:val="1"/><w:jc w:val="both"/></w:pPr></w:p>');

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
  <w:body>
    ${bodyBlocks.join('')}
    <w:sectPr>
      ${isLandscape ? '<w:pgSz w:w="16838" w:h="11906" w:orient="landscape"/>' : '<w:pgSz w:w="11906" w:h="16838"/>'}
      <w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="708" w:footer="708" w:gutter="0"/>
      <w:bidi/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Cairo" w:hAnsi="Cairo" w:cs="Cairo"/>
        <w:rtl/>
        <w:sz w:val="28"/>
        <w:szCs w:val="28"/>
        <w:lang w:val="en-US" w:bidi="ar-SA"/>
      </w:rPr>
    </w:rPrDefault>
    <w:pPrDefault>
      <w:pPr>
        <w:bidi w:val="1"/>
        <w:jc w:val="both"/>
      </w:pPr>
    </w:pPrDefault>
  </w:docDefaults>
  <w:style w:type="paragraph" w:default="1" w:styleId="Normal">
    <w:name w:val="Normal"/>
    <w:pPr>
      <w:bidi w:val="1"/>
      <w:jc w:val="both"/>
    </w:pPr>
    <w:rPr>
      <w:rtl/>
    </w:rPr>
  </w:style>
</w:styles>`;

  const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  ${mediaFiles.map(m => `<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name.split('/').pop()}"/>`).join('')}
</Relationships>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Default Extension="jpeg" ContentType="image/jpeg"/>
  <Default Extension="gif" ContentType="image/gif"/>
  <Default Extension="webp" ContentType="image/webp"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const entries = [
    { name: '[Content_Types].xml', data: contentTypesXml },
    { name: '_rels/.rels', data: rootRelsXml },
    { name: 'word/_rels/document.xml.rels', data: docRelsXml },
    { name: 'word/styles.xml', data: stylesXml },
    { name: 'word/document.xml', data: documentXml },
    ...mediaFiles.map(m => ({ name: m.name, data: m.data }))
  ];

  const blob = buildZipStore(entries);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const finalName = (fileName && String(fileName).trim()) ? String(fileName).trim() : 'مستند_Mini_Word';
  a.download = finalName + '.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  showToast('📥 تم تنزيل ملف Word (.docx)', 'success');
}

// 4. الطباعة المباشرة / حفظ بصيغة PDF عبر المتصفح
function printDocument() {
  showToast('اختر (حفظ بتنسيق PDF) من قائمة الطابعات', '');

  document.title = '';

/* ═══════════════════════════════════════════
   معاينة المستند — A4
   ═══════════════════════════════════════════ */
function updatePreviewGuides() {
  const previewBody = document.getElementById('previewBody');
  const guides = document.getElementById('previewGuides');
  if (!previewBody || !guides) return;

  const w = previewBody.clientWidth || (isLandscape ? 1123 : 794);
  const ratio = isLandscape ? (210 / 297) : (297 / 210);
  const pageHeight = Math.max(260, Math.round(w * ratio));

  previewBody.style.minHeight = '0px';
  const contentHeight = previewBody.scrollHeight;
  const totalPages = Math.max(1, Math.ceil(contentHeight / (pageHeight + PAGE_GAP)));
  previewBody.style.minHeight = (totalPages * pageHeight + (totalPages - 1) * PAGE_GAP) + 'px';

  const orientText = isLandscape ? ' عرضي' : '';
  let html = '';
  for (let i = 0; i < totalPages; i++) {
    const topY = i * (pageHeight + PAGE_GAP);
    html += `<div class="page-sheet" style="top:${topY}px;height:${pageHeight}px;">
      <div class="page-badge">صفحة ${i + 1} / ${totalPages} (A4${orientText})</div>
    </div>`;
    if (i > 0) {
      html += `<div class="page-gap-label" style="top:${topY - PAGE_GAP / 2}px;">صفحة ${i + 1}</div>`;
    }
  }
  guides.innerHTML = html;
}

function openPreview() {
  const previewContent = editor.innerHTML || '<p style="color:#94a3b8;">المستند فارغ</p>';
  const previewBody = document.getElementById('previewBody');
  const previewTitle = document.getElementById('previewTitle');
  if (previewTitle) {
    previewTitle.textContent = `📄 معاينة الطباعة (A4${isLandscape ? ' عرضي' : ''})`;
  }
  previewBody.innerHTML = previewContent;
  previewBody.querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.cursor = 'default';
    img.style.outline = 'none';
  });
  document.getElementById('previewOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(updatePreviewGuides);
}

function closePreview() {
  document.getElementById('previewOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('previewOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePreview();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {

  }
});

/* ═══════════════════════════════════════════
   أدوات التنسيق
   ═══════════════════════════════════════════ */
function clearFormatting() {
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  restoreSelectionState();
  const selection = window.getSelection();
  const savedRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
  document.execCommand('removeFormat', false, null);
  const styleProps = ['font-family', 'font-size', 'color', 'background-color'];
  if (savedRange && !savedRange.collapsed) {
    const root = savedRange.commonAncestorContainer.nodeType === 1 ? savedRange.commonAncestorContainer : savedRange.commonAncestorContainer.parentElement;
    const targets = [];
    if (root && root !== editor && isNodeInsideEditor(root) && root.matches && root.matches('[style]')) targets.push(root);
    if (root && root.querySelectorAll) {
      root.querySelectorAll('[style]').forEach(el => {
        try { if (savedRange.intersectsNode(el)) targets.push(el); } catch (e) {}
      });
    }
    targets.forEach(el => {
      styleProps.forEach(prop => el.style.removeProperty(prop));
      if (!el.getAttribute('style') || !el.getAttribute('style').trim()) el.removeAttribute('style');
    });
  } else if (savedRange && savedRange.collapsed) {
    let curr = savedRange.startContainer.nodeType === 1 ? savedRange.startContainer : savedRange.startContainer.parentElement;
    while (curr && curr !== editor && isNodeInsideEditor(curr)) {
      if (curr.style) {
        styleProps.forEach(prop => curr.style.removeProperty(prop));
        if (!curr.getAttribute('style') || !curr.getAttribute('style').trim()) curr.removeAttribute('style');
      }
      curr = curr.parentElement;
    }
  }
  editor.focus();
  if (savedRange) {
    try {
      selection.removeAllRanges();
      selection.addRange(savedRange);
    } catch (e) {}
  }
  isDirty = true;
  setSaveStatus(false);
  saveSelectionState();
  syncToolbarState();
  updatePageGuides();
}

function fmt(command, value) {
  clearTimeout(historyTimer);
  pushUndoSnapshot();

  restoreSelectionState();
  document.execCommand(command, false, value || null);
  editor.focus();
  isDirty = true;
  setSaveStatus(false);
  saveSelectionState();
  syncToolbarState();
  updatePageGuides();
}

function applyFontFamily(font) {
  clearTimeout(historyTimer);
  pushUndoSnapshot();

  restoreSelectionState();
  document.execCommand('fontName', false, font);
  editor.focus();
  isDirty = true;
  setSaveStatus(false);
  saveSelectionState();
  syncToolbarState();
  updatePageGuides();
}

function applyFontSize(size) {
  clearTimeout(historyTimer);
  pushUndoSnapshot();

  restoreSelectionState();
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && isNodeInsideEditor(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    const targetTags = new Set(['SPAN', 'P', 'DIV', 'TD', 'TH']);
    if (!range.collapsed) {
      const common = range.commonAncestorContainer;
      const rootEl = common.nodeType === 1 ? common : common.parentElement;
      if (rootEl && isNodeInsideEditor(rootEl)) {
        if (targetTags.has(rootEl.tagName) && rootEl !== editor && rootEl.style && rootEl.style.fontSize) {
          rootEl.style.fontSize = '';
        }
        rootEl.querySelectorAll('span, p, div, td, th').forEach(el => {
          try {
            if (range.intersectsNode(el) && el.style && el.style.fontSize) {
              el.style.fontSize = '';
            }
          } catch (e) {}
        });
      }
    } else {
      let curr = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
      while (curr && curr !== editor && isNodeInsideEditor(curr)) {
        if (targetTags.has(curr.tagName) && curr.style && curr.style.fontSize) {
          curr.style.fontSize = '';
        }
        curr = curr.parentElement;
      }
    }
  }
  document.execCommand('fontSize', false, size);
  editor.focus();
  isDirty = true;
  setSaveStatus(false);
  saveSelectionState();
  syncToolbarState();
  updatePageGuides();
}

function changeFontSizeStep(step) {
  const sel = document.getElementById('fontSize');
  let idx = sel.selectedIndex + step;
  if (idx < 0) idx = 0;
  if (idx >= sel.options.length) idx = sel.options.length - 1;
  sel.selectedIndex = idx;
  applyFontSize(sel.value);
}

function applyColor(command, color) {
  clearTimeout(historyTimer);
  pushUndoSnapshot();

  restoreSelectionState();
  if (command === 'hiliteColor') {
    try { document.execCommand('styleWithCSS', false, true); } catch (e) {}
    let ok = false;
    try { ok = document.execCommand('hiliteColor', false, color); } catch (e) {}
    if (!ok) {
      try { document.execCommand('backColor', false, color); } catch (e) {}
    }
    try { document.execCommand('styleWithCSS', false, false); } catch (e) {}
  } else {
    document.execCommand('foreColor', false, color);
  }
  editor.focus();
  isDirty = true;
  setSaveStatus(false);
  saveSelectionState();
  syncToolbarState();
}

/* ═══════════════════════════════════════════
   أدوات الجداول (إدراج + شريط عائم)
   ═══════════════════════════════════════════ */
function openTableModal() {
  saveSelectionState();
  document.getElementById('tableRowsInput').value = '3';
  document.getElementById('tableColsInput').value = '3';
  document.getElementById('tableInsertModal').classList.add('show');
}

function closeTableModal() {
  document.getElementById('tableInsertModal').classList.remove('show');
}

document.getElementById('tableInsertModal').addEventListener('click', function(e) {
  if (e.target === this) closeTableModal();
});

function confirmInsertTable() {
  const rows = Math.max(1, Math.min(50, parseInt(document.getElementById('tableRowsInput').value, 10) || 3));
  const cols = Math.max(1, Math.min(20, parseInt(document.getElementById('tableColsInput').value, 10) || 3));
  closeTableModal();

  clearTimeout(historyTimer);
  pushUndoSnapshot();
  restoreSelectionState();
  editor.focus();

  const table = document.createElement('table');
  const tbody = document.createElement('tbody');
  for (let r = 0; r < rows; r++) {
    const tr = document.createElement('tr');
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement(r === 0 ? 'th' : 'td');
      cell.innerHTML = r === 0 ? `عنوان ${c + 1}` : '<br>';
      tr.appendChild(cell);
    }
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);

  const afterP = document.createElement('p');
  afterP.innerHTML = '<br>';

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && isNodeInsideEditor(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(afterP);
    range.insertNode(table);
  } else {
    editor.appendChild(table);
    editor.appendChild(afterP);
  }

  const firstCell = table.querySelector('th, td');
  if (firstCell) {
    const r = document.createRange();
    r.selectNodeContents(firstCell);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    showTableToolbar(firstCell);
  }

  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
  showToast(`📊 تم إدراج جدول (${rows} × ${cols})`, 'success');
}

function showTableToolbar(cell) {
  activeTableCell = cell;
  const toolbar = document.getElementById('tableToolbar');
  const table = cell.closest('table');
  if (!table) {
    hideTableToolbar();
    return;
  }
  const rect = cell.getBoundingClientRect();
  const vv = window.visualViewport;
  const vvTop = vv ? vv.offsetTop : 0;
  const vvLeft = vv ? vv.offsetLeft : 0;
  const vvWidth = vv ? vv.width : window.innerWidth;
  const vvHeight = vv ? vv.height : window.innerHeight;
  const toolbarWrapEl = document.getElementById('toolbarWrap');
  const minTop = Math.max(vvTop + 8, (toolbarWrapEl ? toolbarWrapEl.getBoundingClientRect().bottom : 0) + 8);
  let top = rect.top - 44;
  let left = rect.left + (rect.width / 2) - 160;
  if (top < minTop) top = rect.bottom + 8;
  const maxTop = vvTop + vvHeight - 50;
  if (top > maxTop) top = Math.max(minTop, maxTop);
  if (left < vvLeft + 6) left = vvLeft + 6;
  if (left + 330 > vvLeft + vvWidth) left = Math.max(vvLeft + 6, vvLeft + vvWidth - 336);

  toolbar.style.top = top + 'px';
  toolbar.style.left = left + 'px';
  toolbar.classList.add('show');
}

function hideTableToolbar() {
  document.getElementById('tableToolbar').classList.remove('show');
  activeTableCell = null;
}

function tableAddRow() {
  if (!activeTableCell) return;
  const tr = activeTableCell.closest('tr');
  const table = activeTableCell.closest('table');
  if (!tr || !table) return;
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  const colCount = tr.children.length || 1;
  const newTr = document.createElement('tr');
  for (let i = 0; i < colCount; i++) {
    const td = document.createElement('td');
    td.innerHTML = '<br>';
    newTr.appendChild(td);
  }
  tr.parentNode.insertBefore(newTr, tr.nextSibling);
  const firstNewCell = newTr.children[0] || activeTableCell;
  if (firstNewCell) {
    const r = document.createRange();
    r.selectNodeContents(firstNewCell);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    showTableToolbar(firstNewCell);
  }
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
}

function tableDeleteRow() {
  if (!activeTableCell) return;
  const tr = activeTableCell.closest('tr');
  const table = activeTableCell.closest('table');
  if (!tr || !table) return;
  const allRows = table.querySelectorAll('tr');
  if (allRows.length <= 1) {
    tableDelete();
    return;
  }
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  const nextFocusRow = tr.nextElementSibling || tr.previousElementSibling;
  tr.remove();
  if (nextFocusRow && nextFocusRow.children[0]) {
    const targetCell = nextFocusRow.children[0];
    editor.focus();
    const r = document.createRange();
    r.selectNodeContents(targetCell);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    showTableToolbar(targetCell);
  } else {
    hideTableToolbar();
  }
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
}

function tableAddCol() {
  if (!activeTableCell) return;
  const tr = activeTableCell.closest('tr');
  const table = activeTableCell.closest('table');
  if (!tr || !table) return;
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  const colIndex = Array.from(tr.children).indexOf(activeTableCell);
  const allRows = table.querySelectorAll('tr');
  let firstNewColCell = null;
  allRows.forEach((row, idx) => {
    const isHeaderRow = row.children[0] && row.children[0].tagName === 'TH';
    const newCell = document.createElement(isHeaderRow ? 'th' : 'td');
    newCell.innerHTML = isHeaderRow ? 'عنوان' : '<br>';
    const refCell = row.children[colIndex + 1] || null;
    row.insertBefore(newCell, refCell);
    if (row === tr) firstNewColCell = newCell;
    else if (idx === 0 && !firstNewColCell) firstNewColCell = newCell;
  });
  if (firstNewColCell) {
    const r = document.createRange();
    r.selectNodeContents(firstNewColCell);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    showTableToolbar(firstNewColCell);
  }
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
}

function tableDeleteCol() {
  if (!activeTableCell) return;
  const tr = activeTableCell.closest('tr');
  const table = activeTableCell.closest('table');
  if (!tr || !table) return;
  if (tr.children.length <= 1) {
    tableDelete();
    return;
  }
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  const colIndex = Array.from(tr.children).indexOf(activeTableCell);
  const nextCell = tr.children[colIndex + 1] || tr.children[colIndex - 1];
  const allRows = table.querySelectorAll('tr');
  allRows.forEach(row => {
    if (row.children[colIndex]) row.children[colIndex].remove();
  });
  if (nextCell) {
    editor.focus();
    const r = document.createRange();
    r.selectNodeContents(nextCell);
    r.collapse(true);
    const s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    showTableToolbar(nextCell);
  } else {
    hideTableToolbar();
  }
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
}

function tableDelete() {
  if (!activeTableCell) return;
  const table = activeTableCell.closest('table');
  if (!table) return;
  confirmAction('هل تريد حذف الجدول بالكامل؟', function() {
    clearTimeout(historyTimer);
  pushUndoSnapshot();
    if (table.parentNode) table.remove();
    hideTableToolbar();
    isDirty = true;
  setSaveStatus(false);
    updatePageGuides();
    showToast('🗑️ تم حذف الجدول', '');
  }, 'danger');
}

/* ═══════════════════════════════════════════
   إدراج الصور وضغطها والتحكم بها
   ═══════════════════════════════════════════ */
function triggerImageUpload() {
  saveSelectionState();
  document.getElementById('imageInput').value = '';
  document.getElementById('imageInput').click();
}

async function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showToast('❌ يرجى اختيار ملف صورة صالح', 'error');
    return;
  }

  if (file.size > 20 * 1024 * 1024) {
    showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 20 ميغابايت)', 'error');
    return;
  }

  showToast('⏳ جاري ضغط الصورة وإدراجها...', '');
  try {
    const compressedDataUrl = await compressImageFile(file);
    clearTimeout(historyTimer);
  pushUndoSnapshot();
    restoreSelectionState();
    editor.focus();

    const img = document.createElement('img');
    img.src = compressedDataUrl;
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.borderRadius = '4px';
    img.style.display = 'block';
    img.style.margin = '10px auto';

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && isNodeInsideEditor(sel.anchorNode)) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const br = document.createElement('br');
      range.insertNode(br);
      range.insertNode(img);
      range.setStartAfter(br);
      range.setEndAfter(br);
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      isDirty = true;
  setSaveStatus(false);
      updatePageGuides();
      showToast('🖼️ تم ضغط وإدراج الصورة بنجاح', 'success');
      return;
    }

    editor.appendChild(img);
    editor.appendChild(document.createElement('br'));
    placeCaretAtEnd();
    isDirty = true;
  setSaveStatus(false);
    updatePageGuides();
    showToast('🖼️ تم ضغط وإدراج الصورة بنجاح', 'success');
  } catch (err) {
    console.error('Image upload/compress error:', err);
    showToast('❌ فشلت قراءة أو ضغط الصورة', 'error');
  }
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة العائم
   ═══════════════════════════════════════════ */
function showImageToolbar(img) {
  selectedImage = img;
  editor.querySelectorAll('img.img-selected').forEach(i => i.classList.remove('img-selected'));
  img.classList.add('img-selected');

  const toolbar = document.getElementById('imgToolbar');
  const rect = img.getBoundingClientRect();
  const vv = window.visualViewport;
  const vvTop = vv ? vv.offsetTop : 0;
  const vvLeft = vv ? vv.offsetLeft : 0;
  const vvWidth = vv ? vv.width : window.innerWidth;
  const vvHeight = vv ? vv.height : window.innerHeight;
  const toolbarWrapEl = document.getElementById('toolbarWrap');
  const minTop = Math.max(vvTop + 8, (toolbarWrapEl ? toolbarWrapEl.getBoundingClientRect().bottom : 0) + 8);
  let top = rect.top - 46;
  let left = rect.left + (rect.width / 2) - 165;

  if (top < minTop) top = rect.bottom + 8;
  const maxTop = vvTop + vvHeight - 54;
  if (top > maxTop) top = Math.max(minTop, maxTop);
  if (left < vvLeft + 6) left = vvLeft + 6;
  if (left + 330 > vvLeft + vvWidth) left = Math.max(vvLeft + 6, vvLeft + vvWidth - 336);

  toolbar.style.top = top + 'px';
  toolbar.style.left = left + 'px';
  toolbar.classList.add('show');
}

function hideImageToolbar() {
  document.getElementById('imgToolbar').classList.remove('show');
  if (selectedImage) {
    selectedImage.classList.remove('img-selected');
    selectedImage = null;
  }
}

function resizeSelectedImage(size) {
  if (!selectedImage) return;
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  selectedImage.style.maxWidth = size;
  selectedImage.style.width = size;
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
  setTimeout(() => { if (selectedImage) showImageToolbar(selectedImage); }, 50);
}

function alignSelectedImage(align) {
  if (!selectedImage) return;
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  if (align === 'center') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  } else if (align === 'right') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = '0';
    selectedImage.style.float = 'none';
  } else if (align === 'left') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = '0';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  }
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
  setTimeout(() => { if (selectedImage) showImageToolbar(selectedImage); }, 50);
}

function deleteSelectedImage() {
  if (!selectedImage) return;
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  selectedImage.remove();
  hideImageToolbar();
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
  showToast('🗑️ تم حذف الصورة', '');
}

editor.addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    e.stopPropagation();
    hideTableToolbar();
    showImageToolbar(e.target);
    return;
  }
  hideImageToolbar();
  const cell = e.target.closest('td, th');
  if (cell && isNodeInsideEditor(cell)) {
    showTableToolbar(cell);
  } else {
    hideTableToolbar();
  }
});

document.addEventListener('click', function(e) {
  if (selectedImage && !e.target.closest('#imgToolbar') && !e.target.closest('#editor')) {
    hideImageToolbar();
  }
  if (activeTableCell && !e.target.closest('#tableToolbar') && !e.target.closest('#editor')) {
    hideTableToolbar();
  }
});

window.addEventListener('scroll', function() {
  if (selectedImage) showImageToolbar(selectedImage);
  if (activeTableCell) showTableToolbar(activeTableCell);
}, { passive: true });

window.addEventListener('resize', function() {
  if (selectedImage) showImageToolbar(selectedImage);
  if (activeTableCell) showTableToolbar(activeTableCell);
});

if (window.visualViewport) {
  const syncFloatingToolbars = function() {
    if (selectedImage) showImageToolbar(selectedImage);
    if (activeTableCell) showTableToolbar(activeTableCell);
  };
  window.visualViewport.addEventListener('scroll', syncFloatingToolbars, { passive: true });
  window.visualViewport.addEventListener('resize', syncFloatingToolbars, { passive: true });
}

/* ═══════════════════════════════════════════
   اعتراض حدث اللصق (ضغط الصور + تعقيم HTML)
   ═══════════════════════════════════════════ */
editor.addEventListener('paste', async function(e) {
  const cd = e.clipboardData || window.clipboardData;
  if (!cd) return;

  // 1. التحقق من وجود صورة في الحافظة
  let imageFile = null;
  if (cd.items && cd.items.length) {
    for (const item of cd.items) {
      if (item.kind === 'file' && item.type && item.type.startsWith('image/')) {
        imageFile = item.getAsFile();
        break;
      }
    }
  }
  if (!imageFile && cd.files && cd.files.length) {
    for (const f of cd.files) {
      if (f.type && f.type.startsWith('image/')) {
        imageFile = f;
        break;
      }
    }
  }

  if (imageFile) {
    e.preventDefault();
    saveSelectionState();
    showToast('⏳ جاري ضغط الصورة الملصقة...', '');
    try {
      const compressedDataUrl = await compressImageFile(imageFile);
      clearTimeout(historyTimer);
  pushUndoSnapshot();
      restoreSelectionState();
      editor.focus();

      const img = document.createElement('img');
      img.src = compressedDataUrl;
      img.style.maxWidth = '100%';
      img.style.height = 'auto';
      img.style.borderRadius = '4px';
      img.style.display = 'block';
      img.style.margin = '10px auto';

      const sel = window.getSelection();
      if (sel && sel.rangeCount > 0 && isNodeInsideEditor(sel.anchorNode)) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        range.insertNode(img);
        range.setStartAfter(br);
        range.setEndAfter(br);
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelection = range.cloneRange();
      } else {
        editor.appendChild(img);
        editor.appendChild(document.createElement('br'));
        placeCaretAtEnd();
      }
      isDirty = true;
  setSaveStatus(false);
      updatePageGuides();
      showToast('🖼️ تم ضغط ولصق الصورة بنجاح', 'success');
    } catch (err) {
      console.error('Paste image error:', err);
      showToast('❌ تعذر معالجة الصورة الملصقة', 'error');
    }
    return;
  }

  // 2. التحقق من وجود محتوى HTML في الحافظة وتعقيمه
  const htmlData = cd.getData('text/html');
  if (htmlData && htmlData.trim()) {
    e.preventDefault();
    saveSelectionState();
    clearTimeout(historyTimer);
    pushUndoSnapshot();
    const plainText = cd.getData('text/plain') || '';
    let cleaned = sanitizeHtml(htmlData);
    const temp = document.createElement('div');
    temp.innerHTML = cleaned;
    for (const img of Array.from(temp.querySelectorAll('img'))) {
      const src = img.getAttribute('src') || '';
      if (/^data:image\//i.test(src)) {
        try { img.setAttribute('src', await compressImageDataUrl(src)); }
        catch (err) { console.warn('Embedded paste image compression failed:', err); }
      }
    }
    // حذف الصور ذات الروابط الخارجية غير المضمّنة بـ data:image
    temp.querySelectorAll('img').forEach(img => {
      const src = (img.getAttribute('src') || '').trim().toLowerCase();
      if (!src.startsWith('data:image/')) {
        img.remove();
      }
    });
    const safeHtml = temp.innerHTML;
    restoreSelectionState();
    editor.focus();
    if (safeHtml.trim()) {
      document.execCommand('insertHTML', false, safeHtml);
    } else if (plainText) {
      document.execCommand('insertText', false, plainText);
    } else {
      return;
    }
    isDirty = true;
    setSaveStatus(false);
    updatePageGuides();
    syncToolbarState();
  }
});

/* ═══════════════════════════════════════════
   الإملاء الصوتي (متوافق مع Chrome وسامسونج بدون getUserMedia)
   ═══════════════════════════════════════════ */
function toggleSpeech() {
  if (isRecording) {
    stopSpeech();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    confirmAction(
      'متصفحك لا يدعم ميزة الإملاء الصوتي.\n\nيرجى استخدام متصفح Google Chrome أو متصفح سامسونج.',
      function(){},
      'danger'
    );
    return;
  }

  saveSelectionState();

  try {
    recognition = new SpeechRecognition();
  } catch(e) {
    confirmAction('تعذر تهيئة التعرف على الصوت: ' + e.message, function(){}, 'danger');
    return;
  }

  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isRecording = true;
    const micBtn = document.getElementById('micBtn');
    if (micBtn) micBtn.classList.add('recording');
    const micLabel = document.getElementById('micLabel');
    if (micLabel) micLabel.textContent = 'استماع..';
    showToast('🎙️ بدأ الاستماع.. تحدّث الآن', 'success');
  };

  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i] && event.results[i][0]) {
        transcript += event.results[i][0].transcript;
      }
    }
    if (transcript.trim()) {
      insertTextAtCursor(transcript.trim() + ' ');
    }
  };

  recognition.onerror = function(event) {
    console.warn('Speech Recognition error:', event.error);
    if (event.error === 'no-speech' || event.error === 'aborted') {
      return;
    }

    let reason = '';
    switch (event.error) {
      case 'not-allowed':
        reason = 'لم يتم منح إذن المايكروفون.\n\nيرجى الضغط على علامة القفل أو الإعدادات في شريط عنوان المتصفح والسماح بالمايكروفون.';
        break;
      case 'network':
        reason = 'خطأ في الاتصال بالإنترنت.\nالتعرف الصوتي يحتاج اتصالاً نشطاً بالشبكة.';
        break;
      case 'audio-capture':
        reason = 'تعذر التقاط الصوت من المايكروفون.\nتأكد من عدم استخدام المايكروفون بواسطة تطبيق آخر.';
        break;
      case 'service-not-allowed':
        reason = 'خدمة التعرف الصوتي غير مسموح بها في المتصفح حالياً.';
        break;
      case 'language-not-supported':
        reason = 'اللغة العربية غير مدعومة للتعرف الصوتي في هذا الجهاز.';
        break;
      default:
        reason = 'خطأ في التعرف على الصوت: ' + event.error;
    }

    stopSpeech();
    confirmAction(reason, function(){}, 'danger');
  };

  recognition.onend = function() {
    if (isRecording) {
      setTimeout(function() {
        if (isRecording && recognition) {
          try {
            recognition.start();
          } catch(e) {
            console.warn('Restart speech error:', e);
          }
        }
      }, 200);
    }
  };

  try {
    recognition.start();
  } catch(err) {
    console.error('Recognition start error:', err);
    isRecording = false;
    confirmAction('تعذر بدء تشغيل المايكروفون:\n' + (err.message || err), function(){}, 'danger');
  }
}

function stopSpeech() {
  isRecording = false;
  if (recognition) {
    try {
      recognition.onend = null;
      recognition.onerror = null;
      recognition.stop();
    } catch(e) {}
    recognition = null;
  }
  const micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.remove('recording');
  const micLabel = document.getElementById('micLabel');
  if (micLabel) micLabel.textContent = 'مايك';
  showToast('🔇 تم إيقاف المايكروفون', '');
}

function insertTextAtCursor(text) {
  clearTimeout(historyTimer);
  pushUndoSnapshot();

  editor.focus();
  if (savedSelection) restoreSelectionState();

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && isNodeInsideEditor(sel.anchorNode)) {
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const textNode = document.createTextNode(text);
    range.insertNode(textNode);
    range.setStartAfter(textNode);
    range.setEndAfter(textNode);
    sel.removeAllRanges();
    sel.addRange(range);
    savedSelection = range.cloneRange();
    isDirty = true;
  setSaveStatus(false);
    updatePageGuides();
    return;
  }

  const textNode = document.createTextNode(text);
  editor.appendChild(textNode);
  placeCaretAtEnd();
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
}

function placeCaretAtEnd() {
  editor.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
  savedSelection = range.cloneRange();
}

/* ═══════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  // التنقل بـ Tab و Shift+Tab داخل خلايا الجداول
  if (e.key === 'Tab') {
    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0 && isNodeInsideEditor(sel.anchorNode)) {
      const anchorEl = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
      const cell = anchorEl ? anchorEl.closest('td, th') : null;
      if (cell && isNodeInsideEditor(cell)) {
        const table = cell.closest('table');
        if (table) {
          e.preventDefault();
          const cells = Array.from(table.querySelectorAll('td, th'));
          const idx = cells.indexOf(cell);
          if (e.shiftKey) {
            if (idx > 0) {
              const prevCell = cells[idx - 1];
              const r = document.createRange();
              r.selectNodeContents(prevCell);
              r.collapse(true);
              sel.removeAllRanges();
              sel.addRange(r);
              showTableToolbar(prevCell);
            }
          } else {
            if (idx >= 0 && idx < cells.length - 1) {
              const nextCell = cells[idx + 1];
              const r = document.createRange();
              r.selectNodeContents(nextCell);
              r.collapse(true);
              sel.removeAllRanges();
              sel.addRange(r);
              showTableToolbar(nextCell);
            } else if (idx === cells.length - 1) {
              // آخر خلية في الجدول: إضافة صف جديد تلقائياً ونقل المؤشر إليه
              activeTableCell = cell;
              tableAddRow();
            }
          }
          return;
        }
      }
    }
  }

  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    performRedo();
    return;
  }

  if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
    switch(e.key.toLowerCase()) {
      case 's':
        e.preventDefault();
        confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm');
        break;
      case 'b':
        e.preventDefault();
        fmt('bold');
        break;
      case 'i':
        e.preventDefault();
        fmt('italic');
        break;
      case 'u':
        e.preventDefault();
        fmt('underline');
        break;
      case 'z':
        e.preventDefault();
        performUndo();
        break;
      case 'y':
        e.preventDefault();
        performRedo();
        break;
    }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedImage) {
    e.preventDefault();
    deleteSelectedImage();
  }
});

/* ═══════════════════════════════════════════
   حفظ تلقائي في الخلفية كل 30 ثانية عبر IndexedDB
   ═══════════════════════════════════════════ */
setInterval(async function() {
  if (isDirty && editor.innerHTML.trim()) {
    try {
      await idbSet('miniword_content', editor.innerHTML);
      const now = new Date();
      const timeStr = now.toLocaleString('ar-EG', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
      await idbSet('miniword_time', timeStr);
      isDirty = false;
      setSaveStatus(true);
    } catch (e) {
      console.error('Auto-save failed:', e);
      showToast('⚠️ فشل الحفظ التلقائي: تعذر الوصول لذاكرة المتصفح', 'error');
    }
  }
}, 30000);
