   أدوات التنسيق
   ═══════════════════════════════════════════ */
function fmt(command, value) {
  document.execCommand(command, false, value || null);
  editor.focus();
}

function applyFontFamily(font) {
  document.execCommand('fontName', false, font);
  editor.focus();
}

function applyFontSize(size) {
  document.execCommand('fontSize', false, size);
  editor.focus();
}

function changeFontSizeStep(step) {
  const sel = document.getElementById('fontSize');
  let idx = sel.selectedIndex + step;
  if (idx < 0) idx = 0;
  if (idx >= sel.options.length) idx = sel.options.length - 1;
  sel.selectedIndex = idx;
  applyFontSize(sel.value);
}

function applyColor(command, color) {
  document.execCommand(command === 'hiliteColor' ? 'hiliteColor' : 'foreColor', false, color);
  editor.focus();
}

/* ═══════════════════════════════════════════
   إدراج الصور والتحكم بها
   ═══════════════════════════════════════════ */
function triggerImageUpload() {
  saveSelectionState();
  document.getElementById('imageInput').value = '';
  document.getElementById('imageInput').click();
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showToast('❌ يرجى اختيار ملف صورة صالح', 'error');
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 10 ميغابايت)', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    restoreSelectionState();
    editor.focus();

    const img = document.createElement('img');
    img.src = e.target.result;
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.borderRadius = '4px';
    img.style.display = 'block';
    img.style.margin = '10px auto';

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      let node = sel.anchorNode, inside = false;
      let curr = node;
      while (curr) {
        if (curr === editor) { inside = true; break; }
        curr = curr.parentNode;
      }
      if (inside) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        range.insertNode(img);
        range.setStartAfter(br);
        range.setEndAfter(br);
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelection = range.cloneRange();
        showToast('🖼️ تم إدراج الصورة بنجاح', 'success');
        return;
      }
    }

    editor.appendChild(img);
    editor.appendChild(document.createElement('br'));
    placeCaretAtEnd();
    showToast('🖼️ تم إدراج الصورة بنجاح', 'success');
  };

  reader.onerror = function() {
    showToast('❌ فشلت قراءة الصورة', 'error');
  };

  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة العائم
   ═══════════════════════════════════════════ */
function showImageToolbar(img) {
  selectedImage = img;
  editor.querySelectorAll('img.img-selected').forEach(i => i.classList.remove('img-selected'));
  img.classList.add('img-selected');

  const toolbar = document.getElementById('imgToolbar');
  const rect = img.getBoundingClientRect();
  let top = rect.top - 46;
  let left = rect.left + (rect.width / 2) - 165;

  if (top < 10) top = rect.bottom + 8;
  if (left < 6) left = 6;
  if (left + 330 > window.innerWidth) left = window.innerWidth - 336;

  toolbar.style.top = top + 'px';
  toolbar.style.left = left + 'px';
  toolbar.classList.add('show');
}

function hideImageToolbar() {
  document.getElementById('imgToolbar').classList.remove('show');
  if (selectedImage) {
    selectedImage.classList.remove('img-selected');
    selectedImage = null;
  }
}

function resizeSelectedImage(size) {
  if (!selectedImage) return;
  selectedImage.style.maxWidth = size;
  selectedImage.style.width = size;
  setTimeout(() => { if (selectedImage) showImageToolbar(selectedImage); }, 50);
}

function alignSelectedImage(align) {
  if (!selectedImage) return;
  if (align === 'center') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  } else if (align === 'right') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = '0';
    selectedImage.style.float = 'none';
  } else if (align === 'left') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = '0';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  }
  setTimeout(() => { if (selectedImage) showImageToolbar(selectedImage); }, 50);
}

function deleteSelectedImage() {
  if (!selectedImage) return;
  selectedImage.remove();
  hideImageToolbar();
  showToast('🗑️ تم حذف الصورة', '');
}

editor.addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    e.stopPropagation();
    showImageToolbar(e.target);
  } else {
    hideImageToolbar();
  }
});

document.addEventListener('click', function(e) {
  if (selectedImage && !e.target.closest('#imgToolbar') && !e.target.closest('#editor')) {
    hideImageToolbar();
  }
});

window.addEventListener('scroll', function() {
  if (selectedImage) showImageToolbar(selectedImage);
}, { passive: true });

window.addEventListener('resize', function() {
  if (selectedImage) showImageToolbar(selectedImage);
});

/* ═══════════════════════════════════════════
   الإملاء الصوتي (متوافق مع Chrome وسامسونج بدون getUserMedia)
   ═══════════════════════════════════════════ */
function toggleSpeech() {
  if (isRecording) {
    stopSpeech();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    confirmAction(
      'متصفحك لا يدعم ميزة الإملاء الصوتي.\n\nيرجى استخدام متصفح Google Chrome أو متصفح سامسونج.',
      function(){},
      'danger'
    );
    return;
  }

  saveSelectionState();

  try {
    recognition = new SpeechRecognition();
  } catch(e) {
    confirmAction('تعذر تهيئة التعرف على الصوت: ' + e.message, function(){}, 'danger');
    return;
  }

  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isRecording = true;
    const micBtn = document.getElementById('micBtn');
    if (micBtn) micBtn.classList.add('recording');
    const micLabel = document.getElementById('micLabel');
    if (micLabel) micLabel.textContent = 'استماع..';
    showToast('🎙️ بدأ الاستماع.. تحدّث الآن', 'success');
  };

  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i] && event.results[i][0]) {
        transcript += event.results[i][0].transcript;
      }
    }
    if (transcript.trim()) {
      insertTextAtCursor(transcript.trim() + ' ');
    }
  };

  recognition.onerror = function(event) {
    console.warn('Speech Recognition error:', event.error);
    if (event.error === 'no-speech' || event.error === 'aborted') {
      return; // عدم مقاطعة المستخدم عند التوقف المؤقت
    }

    let reason = '';
    switch (event.error) {
      case 'not-allowed':
        reason = 'لم يتم منح إذن المايكروفون.\n\nيرجى الضغط على علامة القفل أو الإعدادات في شريط عنوان المتصفح والسماح بالمايكروفون.';
        break;
      case 'network':
        reason = 'خطأ في الاتصال بالإنترنت.\nالتعرف الصوتي يحتاج اتصالاً نشطاً بالشبكة.';
        break;
      case 'audio-capture':
        reason = 'تعذر التقاط الصوت من المايكروفون.\nتأكد من عدم استخدام المايكروفون بواسطة تطبيق آخر.';
        break;
      case 'service-not-allowed':
        reason = 'خدمة التعرف الصوتي غير مسموح بها في المتصفح حالياً.';
        break;
      case 'language-not-supported':
        reason = 'اللغة العربية غير مدعومة للتعرف الصوتي في هذا الجهاز.';
        break;
      default:
        reason = 'خطأ في التعرف على الصوت: ' + event.error;
    }

    stopSpeech();
    confirmAction(reason, function(){}, 'danger');
  };

  recognition.onend = function() {
    // إعادة التشغيل تلقائياً طالما أن المستخدم لم يضغط إيقاف
    if (isRecording) {
      setTimeout(function() {
        if (isRecording && recognition) {
          try {
            recognition.start();
          } catch(e) {
            console.warn('Restart speech error:', e);
          }
        }
      }, 200);
    }
  };

  try {
    recognition.start();
  } catch(err) {
    console.error('Recognition start error:', err);
    isRecording = false;
    confirmAction('تعذر بدء تشغيل المايكروفون:\n' + (err.message || err), function(){}, 'danger');
  }
}

function stopSpeech() {
  isRecording = false;
  if (recognition) {
    try {
      recognition.onend = null;
      recognition.onerror = null;
      recognition.stop();
    } catch(e) {}
    recognition = null;
  }
  const micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.remove('recording');
  const micLabel = document.getElementById('micLabel');
  if (micLabel) micLabel.textContent = 'مايك';
  showToast('🔇 تم إيقاف المايكروفون', '');
}

function insertTextAtCursor(text) {
  editor.focus();
  if (savedSelection) restoreSelectionState();

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    let node = sel.anchorNode, inside = false;
    let curr = node;
    while (curr) {
      if (curr === editor) { inside = true; break; }
      curr = curr.parentNode;
    }
    if (inside) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      return;
    }
  }

  const textNode = document.createTextNode(text);
  editor.appendChild(textNode);
  placeCaretAtEnd();
}

function placeCaretAtEnd() {
  editor.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
  savedSelection = range.cloneRange();
}

/* ═══════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
    switch(e.key.toLowerCase()) {
      case 's':
        e.preventDefault();
        confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm');
        break;
      case 'b':
        e.preventDefault();
        fmt('bold');
        break;
      case 'i':
        e.preventDefault();
        fmt('italic');
        break;
      case 'u':
        e.preventDefault();
        fmt('underline');
        break;
    }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedImage) {
    e.preventDefault();
    deleteSelectedImage();
  }
});

/* ═══════════════════════════════════════════

setInterval(function() {
  if (editor.innerHTML.trim()) {
    try {
      localStorage.setItem('miniword_content', editor.innerHTML);
      const now = new Date();
      const timeStr = now.toLocaleString('ar-EG', {
        year: 'numeric', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
      localStorage.setItem('miniword_time', timeStr);
    } catch (e) {}
  }
}, 30000);
