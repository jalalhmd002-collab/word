<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Word — محرر نصوص عربي</title>

<!-- خطوط جوجل العربية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- مكتبة html2pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

<style>
/* ═══════════════════════════════════════════
   CSS Variables & Reset
   ═══════════════════════════════════════════ */
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --danger: #ef4444;
  --success: #22c55e;
  --bg: #f0f2f5;
  --toolbar-bg: #ffffff;
  --paper-bg: #ffffff;
  --border: #d1d5db;
  --text: #1f2937;
  --text-light: #6b7280;
  --shadow: 0 2px 8px rgba(0,0,0,.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,.15);
  --radius: 8px;
  --toolbar-height: auto;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ═══════════════════════════════════════════
   Top File Bar
   ═══════════════════════════════════════════ */
.file-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  flex-wrap: wrap;
  box-shadow: 0 2px 6px rgba(0,0,0,.15);
}

.file-bar .app-title {
  font-weight: 700;
  font-size: 15px;
  margin-left: 8px;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.file-bar .app-title svg { width: 20px; height: 20px; }

.file-bar button {
  background: rgba(255,255,255,.15);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 7px 12px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background .2s;
}

.file-bar button:hover,
.file-bar button:active { background: rgba(255,255,255,.3); }

.file-bar .save-info {
  font-size: 11px;
  opacity: .8;
  margin-right: auto;
  white-space: nowrap;
}

/* ═══════════════════════════════════════════
   Formatting Toolbar
   ═══════════════════════════════════════════ */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 99;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  padding: 6px 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  box-shadow: var(--shadow);
}

.toolbar::-webkit-scrollbar { height: 3px; }
.toolbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

.toolbar .sep {
  width: 1px;
  height: 28px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 2px;
}

.toolbar button,
.toolbar select {
  background: #f3f4f6;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 34px;
  min-height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
}

.toolbar button:hover,
.toolbar button:active { background: #e5e7eb; }
.toolbar button.active { background: var(--primary); color: #fff; border-color: var(--primary); }

.toolbar select {
  padding: 6px 6px 6px 24px;
  appearance: auto;
  -webkit-appearance: auto;
  font-size: 13px;
  max-width: 130px;
}

.toolbar input[type="color"] {
  width: 34px;
  height: 34px;
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  padding: 2px;
  background: #f3f4f6;
  flex-shrink: 0;
}

.toolbar .mic-btn.recording {
  background: var(--danger) !important;
  color: #fff !important;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50%      { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
}

/* ═══════════════════════════════════════════
   Editor / Paper Area
   ═══════════════════════════════════════════ */
.editor-wrapper {
  display: flex;
  justify-content: center;
  padding: 20px 10px 60px;
  min-height: calc(100vh - 140px);
}

.paper {
  background: var(--paper-bg);
  width: 100%;
  max-width: 800px;
  min-height: 1000px;
  padding: 50px 40px;
  border-radius: 4px;
  box-shadow: var(--shadow-lg);
  outline: none;
  font-size: 16px;
  line-height: 1.9;
  direction: rtl;
  text-align: right;
  font-family: 'Cairo', sans-serif;
  caret-color: var(--primary);
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.paper:empty::before {
  content: "ابدأ الكتابة هنا...";
  color: #9ca3af;
  pointer-events: none;
}

.paper:focus { box-shadow: 0 0 0 3px rgba(37,99,235,.2), var(--shadow-lg); }

.paper img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  cursor: pointer;
  transition: outline .15s;
}

.paper img:hover { outline: 2px solid var(--primary); outline-offset: 2px; }
.paper img.img-selected { outline: 3px solid var(--primary); outline-offset: 3px; }

/* ═══════════════════════════════════════════
   Image Context Toolbar (floating)
   ═══════════════════════════════════════════ */
.img-toolbar {
  position: fixed;
  z-index: 9000;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 10px;
  box-shadow: 0 8px 28px rgba(0,0,0,.18);
  display: none;
  gap: 4px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  max-width: 340px;
}

.img-toolbar.show { display: flex; }

.img-toolbar button {
  background: #f3f4f6;
  color: var(--text);
  border: none;
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all .15s;
}

.img-toolbar button:hover { background: #e5e7eb; }
.img-toolbar button.active { background: var(--primary); color: #fff; }
.img-toolbar button.danger { color: var(--danger); }
.img-toolbar button.danger:hover { background: #fef2f2; }

.img-toolbar .sep {
  width: 1px;
  height: 24px;
  background: var(--border);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════
   Custom Modal
   ═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s, visibility .25s;
}

.modal-overlay.show { opacity: 1; visibility: visible; }

.modal-box {
  background: #fff;
  border-radius: 16px;
  padding: 28px 24px 20px;
  max-width: 400px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.25);
  transform: scale(.9);
  transition: transform .25s;
}

.modal-overlay.show .modal-box { transform: scale(1); }

.modal-box .modal-icon {
  font-size: 40px;
  margin-bottom: 10px;
}

.modal-box h3 {
  font-size: 18px;
  margin-bottom: 8px;
  font-weight: 700;
}

.modal-box p {
  font-size: 14px;
  color: var(--text-light);
  margin-bottom: 20px;
  line-height: 1.6;
  white-space: pre-line;
}

.modal-box .modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.modal-box .btn {
  padding: 10px 24px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.modal-box .btn-confirm {
  background: var(--primary);
  color: #fff;
}

.modal-box .btn-confirm:hover { background: var(--primary-hover); }

.modal-box .btn-danger {
  background: var(--danger);
  color: #fff;
}

.modal-box .btn-danger:hover { background: #dc2626; }

.modal-box .btn-cancel {
  background: #f3f4f6;
  color: var(--text);
}

.modal-box .btn-cancel:hover { background: #e5e7eb; }

/* ═══════════════════════════════════════════
   Preview Modal
   ═══════════════════════════════════════════ */
.preview-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.6);
  z-index: 10000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 20px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition: opacity .25s, visibility .25s;
}

.preview-overlay.show { opacity: 1; visibility: visible; }

.preview-container {
  background: #fff;
  width: 100%;
  max-width: 820px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
  margin: 20px 0;
}

.preview-header {
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
}

.preview-header h3 { font-size: 16px; }

.preview-header button {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 6px 16px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
}

.preview-header button:hover { background: rgba(255,255,255,.35); }

.preview-body {
  padding: 50px 40px;
  direction: rtl;
  text-align: right;
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
  line-height: 1.9;
  min-height: 500px;
}

.preview-body img { max-width: 100%; height: auto; }

/* ═══════════════════════════════════════════
   Toast Notification
   ═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1f2937;
  color: #fff;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  z-index: 99999;
  opacity: 0;
  transition: all .35s;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.success { background: #16a34a; }
.toast.error   { background: #dc2626; }

/* ═══════════════════════════════════════════
   Mobile Responsive
   ═══════════════════════════════════════════ */
@media (max-width: 640px) {
  .file-bar { padding: 5px 6px; gap: 3px; }
  .file-bar .app-title { font-size: 13px; margin-left: 4px; }
  .file-bar button { padding: 6px 8px; font-size: 11px; }

  .toolbar { padding: 4px 6px; gap: 3px; }
  .toolbar button,
  .toolbar select { min-width: 32px; min-height: 32px; padding: 5px 6px; font-size: 13px; }
  .toolbar select { max-width: 100px; font-size: 12px; }

  .editor-wrapper { padding: 10px 4px 40px; }

  .paper {
    padding: 24px 18px;
    min-height: 600px;
    border-radius: 0;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    font-size: 15px;
  }

  .preview-body { padding: 24px 18px; }

  .img-toolbar { max-width: 92vw; }
}

/* ═══════════════════════════════════════════
   Print Styles
   ═══════════════════════════════════════════ */
@media print {
  .file-bar, .toolbar, .toast, .modal-overlay, .preview-overlay, .img-toolbar { display: none !important; }
  .editor-wrapper { padding: 0; }
  .paper {
    box-shadow: none;
    max-width: 100%;
    border-radius: 0;
    padding: 20px;
  }
}

/* Tooltip */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 6px);
  right: 50%;
  transform: translateX(50%);
  background: #1f2937;
  color: #fff;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s;
  z-index: 200;
}
[data-tooltip]:hover::after { opacity: 1; }
@media (max-width: 640px) { [data-tooltip]::after { display: none; } }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     شريط الملفات العلوي
     ═══════════════════════════════════════ -->
<div class="file-bar">
  <span class="app-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Mini Word
  </span>

  <button onclick="confirmAction('هل تريد إنشاء مستند جديد؟\nسيتم مسح المحتوى الحالي.', newDocument, 'danger')" data-tooltip="مستند جديد">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    جديد
  </button>

  <button onclick="confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm')" data-tooltip="حفظ محلي">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    حفظ
  </button>

  <button onclick="confirmAction('هل تريد تنزيل المستند بصيغة Word؟', exportWord, 'confirm')" data-tooltip="تصدير Word">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    حفظ كـ Word
  </button>

  <button onclick="confirmAction('هل تريد تصدير المستند بصيغة PDF؟', exportPDF, 'confirm')" data-tooltip="تصدير PDF">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2"/><text x="12" y="15" text-anchor="middle" font-size="8" fill="currentColor" stroke="none" font-weight="bold">PDF</text></svg>
    حفظ كـ PDF
  </button>

  <button onclick="openPreview()" data-tooltip="معاينة الطباعة">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    معاينة
  </button>

  <span class="save-info" id="saveInfo"></span>
</div>

<!-- ═══════════════════════════════════════
     شريط أدوات التنسيق
     ═══════════════════════════════════════ -->
<div class="toolbar" id="toolbar">

  <!-- نوع الخط -->
  <select id="fontFamily" onchange="applyFontFamily(this.value)" data-tooltip="نوع الخط">
    <option value="Cairo">Cairo</option>
    <option value="Tajawal">Tajawal</option>
    <option value="Amiri">Amiri</option>
    <option value="Arial">Arial</option>
    <option value="Tahoma">Tahoma</option>
    <option value="Times New Roman">Times New Roman</option>
  </select>

  <!-- حجم الخط -->
  <select id="fontSize" onchange="applyFontSize(this.value)" data-tooltip="حجم الخط">
    <option value="1">10</option>
    <option value="2">12</option>
    <option value="3" selected>14</option>
    <option value="4">18</option>
    <option value="5">24</option>
    <option value="6">32</option>
    <option value="7">48</option>
  </select>

  <button onclick="changeFontSizeStep(1)" data-tooltip="تكبير الخط" style="font-weight:700;">A+</button>
  <button onclick="changeFontSizeStep(-1)" data-tooltip="تصغير الخط" style="font-size:12px;">A−</button>

  <div class="sep"></div>

  <!-- تنسيق النص -->
  <button onclick="fmt('bold')" data-tooltip="عريض" style="font-weight:800;">B</button>
  <button onclick="fmt('italic')" data-tooltip="مائل" style="font-style:italic;">I</button>
  <button onclick="fmt('underline')" data-tooltip="تسطير" style="text-decoration:underline;">U</button>
  <button onclick="fmt('strikeThrough')" data-tooltip="يتوسطه خط" style="text-decoration:line-through;">S</button>

  <div class="sep"></div>

  <!-- لون النص -->
  <label data-tooltip="لون النص" style="position:relative;display:flex;align-items:center;cursor:pointer;">
    <span style="font-size:16px;font-weight:700;color:var(--text);">A</span>
    <input type="color" id="foreColor" value="#000000" onchange="applyColor('foreColor', this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
  </label>

  <!-- لون التمييز -->
  <label data-tooltip="لون التمييز" style="position:relative;display:flex;align-items:center;cursor:pointer;">
    <span style="font-size:16px;background:#fef08a;padding:0 4px;border-radius:3px;font-weight:700;">A</span>
    <input type="color" id="hiliteColor" value="#ffff00" onchange="applyColor('hiliteColor', this.value)" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
  </label>

  <div class="sep"></div>

  <!-- المحاذاة -->
  <button onclick="fmt('justifyRight')" data-tooltip="محاذاة يمين">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="10" x2="9" y2="10"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="9" y2="18"/></svg>
  </button>
  <button onclick="fmt('justifyCenter')" data-tooltip="توسيط">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="17" y1="10" x2="7" y2="10"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="7" y2="18"/></svg>
  </button>
  <button onclick="fmt('justifyLeft')" data-tooltip="محاذاة يسار">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="10" x2="15" y2="10"/><line x1="3" y1="14" x2="21" y2="14"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
  </button>
  <button onclick="fmt('justifyFull')" data-tooltip="ضبط">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="10" x2="3" y2="10"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
  </button>

  <div class="sep"></div>

  <!-- القوائم -->
  <button onclick="fmt('insertUnorderedList')" data-tooltip="قائمة نقطية">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1.5" fill="currentColor"/><circle cx="3" cy="12" r="1.5" fill="currentColor"/><circle cx="3" cy="18" r="1.5" fill="currentColor"/></svg>
  </button>
  <button onclick="fmt('insertOrderedList')" data-tooltip="قائمة رقمية">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="3" y="8" font-size="7" fill="currentColor" stroke="none">1</text><text x="3" y="14" font-size="7" fill="currentColor" stroke="none">2</text><text x="3" y="20" font-size="7" fill="currentColor" stroke="none">3</text></svg>
  </button>

<!-- ═══════════════════════════════════════
     رسالة Toast
     ═══════════════════════════════════════ -->
<div class="toast" id="toast"></div>


<script>
/* ═══════════════════════════════════════════
   متغيرات عامة
   ═══════════════════════════════════════════ */
const editor = document.getElementById('editor');
let pendingAction = null;
let recognition = null;
let isRecording = false;
let selectedImage = null;       // الصورة المحددة حالياً
let savedSelection = null;      // حفظ موضع المؤشر قبل فتح اختيار الصورة

/* ═══════════════════════════════════════════
   تحميل المستند المحفوظ عند بدء التشغيل
   ═══════════════════════════════════════════ */
(function init() {
  const saved = localStorage.getItem('miniword_content');
  if (saved) editor.innerHTML = saved;
  const time = localStorage.getItem('miniword_time');
  if (time) document.getElementById('saveInfo').textContent = '💾 آخر حفظ: ' + time;
})();

/* ═══════════════════════════════════════════
   منع إغلاق الصفحة بالخطأ
   ═══════════════════════════════════════════ */
window.addEventListener('beforeunload', function(e) {
  if (editor.innerHTML.trim() !== '') {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ═══════════════════════════════════════════
   نظام نوافذ التأكيد
   ═══════════════════════════════════════════ */
function confirmAction(message, action, type) {
  const modal = document.getElementById('confirmModal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const msg = document.getElementById('modalMessage');
  const btn = document.getElementById('modalConfirmBtn');

  if (type === 'danger') {
    icon.textContent = '⚠️';
    title.textContent = 'تأكيد الإجراء';
    btn.className = 'btn btn-danger';
  } else {
    icon.textContent = '✅';
    title.textContent = 'تأكيد';
    btn.className = 'btn btn-confirm';
  }

  msg.textContent = message;
  pendingAction = action;
  modal.classList.add('show');
}

function modalConfirm() {
  closeModal();
  if (pendingAction) {
    const action = pendingAction;
    pendingAction = null;
    action();
  }
}

function closeModal() {
  document.getElementById('confirmModal').classList.remove('show');
  pendingAction = null;
}

// إغلاق عند النقر خارج الصندوق
document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ═══════════════════════════════════════════
   Toast Messages
   ═══════════════════════════════════════════ */
function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => toast.classList.remove('show'), 3000);
}

/* ═══════════════════════════════════════════
   حفظ واسترجاع موضع المؤشر
   ═══════════════════════════════════════════ */
function saveSelectionState() {
  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    // تأكد أن التحديد داخل المحرر
    let node = range.startContainer;
    while (node) {
      if (node === editor) {
        savedSelection = range.cloneRange();
        return;
      }
      node = node.parentNode;
    }
  }
  savedSelection = null;
}

function restoreSelectionState() {
  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
}

/* ═══════════════════════════════════════════
   عمليات الملفات
   ═══════════════════════════════════════════ */

// مستند جديد
function newDocument() {
  editor.innerHTML = '';
  localStorage.removeItem('miniword_content');
  localStorage.removeItem('miniword_time');
  document.getElementById('saveInfo').textContent = '';
  hideImageToolbar();
  showToast('📄 تم إنشاء مستند جديد', 'success');
}

// حفظ محلي
function saveDocument() {
  localStorage.setItem('miniword_content', editor.innerHTML);
  const now = new Date();
  const timeStr = now.toLocaleString('ar-EG', {
    year: 'numeric', month: 'short', day: 'numeric',
    hour: '2-digit', minute: '2-digit'
  });
  localStorage.setItem('miniword_time', timeStr);
  document.getElementById('saveInfo').textContent = '💾 آخر حفظ: ' + timeStr;
  showToast('✅ تم الحفظ بنجاح', 'success');
}

// تصدير Word
function exportWord() {
  const content = editor.innerHTML;
  const html = `
    <html xmlns:o="urn:schemas-microsoft-com:office:office"
          xmlns:w="urn:schemas-microsoft-com:office:word"
          xmlns="http://www.w3.org/TR/REC-html40">
    <head>
      <meta charset="utf-8">
      <style>
        body { direction: rtl; font-family: 'Cairo', 'Arial', sans-serif; font-size: 14pt; line-height: 1.8; text-align: right; }
        img  { max-width: 100%; height: auto; }
        @page { size: A4; margin: 2cm; }
      </style>
    </head>
    <body>${content}</body>
    </html>`;
  const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'مستند_Mini_Word.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('📥 تم تنزيل ملف Word', 'success');
}

// تصدير PDF
function exportPDF() {
  const content = editor.cloneNode(true);
  // إزالة أي حدود تحديد الصور في النسخة
  content.querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.outline = 'none';
  });
  content.style.direction = 'rtl';
  content.style.textAlign = 'right';
  content.style.fontFamily = "'Cairo', 'Tajawal', sans-serif";
  content.style.fontSize = '14px';
  content.style.lineHeight = '1.9';
  content.style.padding = '0';

  const opt = {
    margin:       [15, 15, 15, 15],
    filename:     'مستند_Mini_Word.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true, letterRendering: true, scrollY: 0 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  if (typeof html2pdf !== 'undefined') {
    html2pdf().set(opt).from(content).save().then(() => {
      showToast('📥 تم تصدير ملف PDF', 'success');
    }).catch(() => {
      printAsPDF();
    });
  } else {
    printAsPDF();
  }
}

function printAsPDF() {
  const printWin = window.open('', '_blank');
  printWin.document.write(`
    <!DOCTYPE html>
    <html dir="rtl" lang="ar">
    <head>
      <meta charset="UTF-8">
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
      <style>
        body { direction: rtl; font-family: 'Cairo', sans-serif; font-size: 14pt; line-height: 1.9; text-align: right; padding: 40px; }
        img  { max-width: 100%; height: auto; }
        @page { size: A4; margin: 2cm; }
      </style>
    </head>
    <body>${editor.innerHTML}</body>
    </html>`);
  printWin.document.close();
  setTimeout(() => { printWin.print(); }, 800);
  showToast('🖨️ تم فتح نافذة الطباعة / PDF', 'success');
}

/* ═══════════════════════════════════════════
   المعاينة
   ═══════════════════════════════════════════ */
function openPreview() {
  const previewContent = editor.innerHTML || '<p style="color:#9ca3af;">المستند فارغ</p>';
  document.getElementById('previewBody').innerHTML = previewContent;
  // إزالة تحديد الصور في المعاينة
  document.getElementById('previewBody').querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.cursor = 'default';
    img.style.outline = 'none';
  });
  document.getElementById('previewOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closePreview() {
  document.getElementById('previewOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('previewOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePreview();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closePreview();
    closeModal();
    hideImageToolbar();
  }
});

/* ═══════════════════════════════════════════
   أدوات التنسيق
   ═══════════════════════════════════════════ */
function fmt(command, value) {
  document.execCommand(command, false, value || null);
  editor.focus();
}

function applyFontFamily(font) {
  document.execCommand('fontName', false, font);
  editor.focus();
}

function applyFontSize(size) {
  document.execCommand('fontSize', false, size);
  editor.focus();
}

function changeFontSizeStep(step) {
  const sel = document.getElementById('fontSize');
  let idx = sel.selectedIndex + step;
  if (idx < 0) idx = 0;
  if (idx >= sel.options.length) idx = sel.options.length - 1;
  sel.selectedIndex = idx;
  applyFontSize(sel.value);
}

function applyColor(command, color) {
  if (command === 'hiliteColor') {
    document.execCommand('hiliteColor', false, color);
  } else {
    document.execCommand('foreColor', false, color);
  }
  editor.focus();
}

/* ═══════════════════════════════════════════
   إدراج الصور
   ═══════════════════════════════════════════ */
function triggerImageUpload() {
  // حفظ موضع المؤشر قبل فتح مربع اختيار الملف
  saveSelectionState();
  document.getElementById('imageInput').value = '';
  document.getElementById('imageInput').click();
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  // التحقق من نوع الملف
  if (!file.type.startsWith('image/')) {
    showToast('❌ يرجى اختيار ملف صورة فقط', 'error');
    return;
  }

  // التحقق من حجم الملف (أقصى 10 ميغا)
  if (file.size > 10 * 1024 * 1024) {
    showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 10 ميغا)', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    const base64 = e.target.result;

    // استرجاع موضع المؤشر المحفوظ
    restoreSelectionState();
    editor.focus();

    const img = document.createElement('img');
    img.src = base64;
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.borderRadius = '4px';
    img.style.display = 'block';
    img.style.margin = '12px auto';

    const sel = window.getSelection();
    if (sel.rangeCount > 0) {
      let node = sel.anchorNode;
      let insideEditor = false;
      while (node) {
        if (node === editor) { insideEditor = true; break; }
        node = node.parentNode;
      }
      if (insideEditor) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        // إضافة سطر فارغ بعد الصورة لضمان استمرار الكتابة
        const br = document.createElement('br');
        range.insertNode(br);
        range.insertNode(img);
        // وضع المؤشر بعد الصورة
        range.setStartAfter(br);
        range.setEndAfter(br);
        sel.removeAllRanges();
        sel.addRange(range);
      } else {
        editor.appendChild(img);
        editor.appendChild(document.createElement('br'));
      }
    } else {
      editor.appendChild(img);
      editor.appendChild(document.createElement('br'));
    }

    showToast('🖼️ تم إدراج الصورة بنجاح', 'success');
  };

  reader.onerror = function() {
    showToast('❌ فشل قراءة الصورة', 'error');
  };

  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة العائم
   ═══════════════════════════════════════════ */
function showImageToolbar(img) {
  selectedImage = img;

  // إزالة التحديد السابق من أي صورة أخرى
  editor.querySelectorAll('img.img-selected').forEach(i => i.classList.remove('img-selected'));
  img.classList.add('img-selected');

  const toolbar = document.getElementById('imgToolbar');
  const rect = img.getBoundingClientRect();

  // حساب موضع الشريط فوق الصورة أو تحتها
  let top = rect.top - 50;
  let left = rect.left + (rect.width / 2) - 170;

  // إذا لم يكن هناك مساحة كافية فوق الصورة، أظهره تحتها
  if (top < 10) {
    top = rect.bottom + 8;
  }

  // حدود الشاشة
  if (left < 8) left = 8;
  if (left + 340 > window.innerWidth) left = window.innerWidth - 348;

  toolbar.style.top = top + 'px';
  toolbar.style.left = left + 'px';
  toolbar.classList.add('show');
}

function hideImageToolbar() {
  document.getElementById('imgToolbar').classList.remove('show');
  if (selectedImage) {
    selectedImage.classList.remove('img-selected');
    selectedImage = null;
  }
}

function resizeSelectedImage(size) {
  if (!selectedImage) return;
  selectedImage.style.maxWidth = size;
  selectedImage.style.width = size;
  // إعادة حساب موضع الشريط
  setTimeout(() => {
    if (selectedImage) showImageToolbar(selectedImage);
  }, 50);
}

function alignSelectedImage(align) {
  if (!selectedImage) return;
  // لف الصورة في div للتحكم بالمحاذاة
  const wrapper = selectedImage.parentElement;

  if (align === 'center') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  } else if (align === 'right') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = '0';
    selectedImage.style.float = 'none';
  } else if (align === 'left') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = '0';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  }

  setTimeout(() => {
    if (selectedImage) showImageToolbar(selectedImage);
  }, 50);
}

function deleteSelectedImage() {
  if (!selectedImage) return;
  selectedImage.remove();
  hideImageToolbar();
  showToast('🗑️ تم حذف الصورة', '');
}

// الاستماع للنقر على الصور داخل المحرر
editor.addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    e.stopPropagation();
    showImageToolbar(e.target);
  } else {
    hideImageToolbar();
  }
});

// إخفاء شريط الصورة عند النقر خارج المحرر والشريط
document.addEventListener('click', function(e) {
  if (selectedImage && !e.target.closest('#imgToolbar') && !e.target.closest('#editor')) {
    hideImageToolbar();
  }
});

// تحديث موضع شريط الصورة عند التمرير أو تغيير حجم النافذة
window.addEventListener('scroll', function() {
  if (selectedImage) showImageToolbar(selectedImage);
}, { passive: true });
window.addEventListener('resize', function() {
  if (selectedImage) showImageToolbar(selectedImage);
});


/* ═══════════════════════════════════════════
   الإملاء الصوتي - Web Speech API (مُحسّن للهاتف)
   ═══════════════════════════════════════════ */
async function toggleSpeech() {
  if (isRecording) {
    stopSpeech();
    return;
  }

  // التحقق من دعم المتصفح
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    confirmAction(
      'متصفحك لا يدعم ميزة الإملاء الصوتي.\n\nجرّب استخدام متصفح Google Chrome أو Microsoft Edge.',
      function(){},
      'danger'
    );
    return;
  }

  // طلب إذن المايكروفون صراحةً عبر getUserMedia قبل بدء التعرف
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    // إيقاف المسار فوراً بعد الحصول على الإذن (SpeechRecognition سيفتح مساره الخاص)
    stream.getTracks().forEach(track => track.stop());
  } catch (err) {
    let reason = '';
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      reason = 'لم يتم منح إذن الوصول للمايكروفون.\n\nيرجى السماح بالوصول من إعدادات المتصفح ثم المحاولة مرة أخرى.';
    } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
      reason = 'لم يتم العثور على مايكروفون متصل بالجهاز.\n\nتأكد من توصيل المايكروفون أو استخدام جهاز يحتوي على مايكروفون مدمج.';
    } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
      reason = 'المايكروفون مستخدم من قبل تطبيق آخر.\n\nأغلق التطبيقات الأخرى التي تستخدم المايكروفون وحاول مرة أخرى.';
    } else {
      reason = 'تعذر تشغيل المايكروفون.\n\nالخطأ التقني: ' + err.name + ' — ' + err.message;
    }
    confirmAction(reason, function(){}, 'danger');
    return;
  }

  // حفظ موضع المؤشر في المحرر
  saveSelectionState();

  // إنشاء كائن التعرف
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-SA';
  recognition.continuous = false;       // ← false للتوافق مع متصفحات الهاتف
  recognition.interimResults = false;   // ← false لتجنب مشاكل الهاتف
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    document.getElementById('micLabel').textContent = 'جارٍ الاستماع...';
    showToast('🎙️ بدأ الاستماع... تحدّث الآن', 'success');
  };

  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    if (transcript.trim()) {
      insertTextAtCursor(transcript + ' ');
    }
  };

  recognition.onerror = function(event) {
    console.error('Speech recognition error:', event.error);

    // لا نوقف عند أخطاء "no-speech" أو "aborted" — نعيد المحاولة
    if (event.error === 'no-speech' || event.error === 'aborted') {
      // إعادة التشغيل تلقائياً
      return;
    }

    let reason = '';
    switch (event.error) {
      case 'not-allowed':
        reason = 'لم يتم منح إذن الوصول للمايكروفون.\n\nيرجى السماح من إعدادات المتصفح.';
        break;
      case 'network':
        reason = 'خطأ في الاتصال بالشبكة.\n\nالتعرف على الصوت يحتاج اتصال بالإنترنت. تحقق من اتصالك وحاول مرة أخرى.';
        break;
      case 'audio-capture':
        reason = 'تعذر التقاط الصوت من المايكروفون.\n\nتأكد من أن المايكروفون يعمل بشكل صحيح.';
        break;
      case 'service-not-allowed':
        reason = 'خدمة التعرف على الصوت غير متاحة في متصفحك.\n\nجرّب Google Chrome.';
        break;
      case 'language-not-supported':
        reason = 'اللغة العربية غير مدعومة في هذا المتصفح.\n\nجرّب متصفح Google Chrome.';
        break;
      default:
        reason = 'خطأ في التعرف على الصوت.\n\nنوع الخطأ: ' + event.error;
    }

    stopSpeech();
    confirmAction(reason, function(){}, 'danger');
  };

  recognition.onend = function() {
    // إعادة التشغيل تلقائياً إذا كان الزر لا يزال في وضع التشغيل
    if (isRecording) {
      try {
        setTimeout(function() {
          if (isRecording && recognition) {
            recognition.start();
          }
        }, 200);  // تأخير قصير لتجنب الأخطاء في بعض المتصفحات
      } catch(e) {
        stopSpeech();
      }
    }
  };

  try {
    recognition.start();
  } catch(e) {
    confirmAction(
      'فشل تشغيل المايكروفون.\n\nالخطأ: ' + e.message,
      function(){},
      'danger'
    );
  }
}

function stopSpeech() {
  isRecording = false;
  if (recognition) {
    try {
      recognition.onend = null;   // منع إعادة التشغيل التلقائي
      recognition.abort();
    } catch(e) { /* تجاهل */ }
    recognition = null;
  }
  document.getElementById('micBtn').classList.remove('recording');
  document.getElementById('micLabel').textContent = 'مايك';
  showToast('🔇 تم إيقاف الاستماع', '');
}

function insertTextAtCursor(text) {
  editor.focus();

  // محاولة استرجاع الموضع المحفوظ أولاً
  if (savedSelection) {
    restoreSelectionState();
  }

  const sel = window.getSelection();
  if (sel.rangeCount > 0) {
    let node = sel.anchorNode;
    let insideEditor = false;
    while (node) {
      if (node === editor) { insideEditor = true; break; }
      node = node.parentNode;
    }
    if (insideEditor) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
      // تحديث الموضع المحفوظ
      savedSelection = range.cloneRange();
      return;
    }
  }
  // إذا لم يكن هناك تحديد في المحرر، أضف النص في النهاية
  editor.innerHTML += text;
  // ضع المؤشر في النهاية
  placeCaretAtEnd();
}

function placeCaretAtEnd() {
  editor.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
  savedSelection = range.cloneRange();
}

/* ═══════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
    switch(e.key.toLowerCase()) {
      case 's':
        e.preventDefault();
        confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm');
        break;
      case 'b':
        e.preventDefault();
        fmt('bold');
        break;
      case 'i':
        e.preventDefault();
        fmt('italic');
        break;
      case 'u':
        e.preventDefault();
        fmt('underline');
        break;
    }
  }
  // حذف الصورة المحددة بزر Delete أو Backspace
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedImage) {
    e.preventDefault();
    deleteSelectedImage();
  }
});

/* ═══════════════════════════════════════════
   حفظ تلقائي كل 30 ثانية
   ═══════════════════════════════════════════ */
setInterval(function() {
  if (editor.innerHTML.trim()) {
    localStorage.setItem('miniword_content', editor.innerHTML);
    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
    localStorage.setItem('miniword_time', timeStr);
    document.getElementById('saveInfo').textContent = '💾 حفظ تلقائي: ' + timeStr;
  }
}, 30000);

</script>
