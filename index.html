<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Word — محرر نصوص عربي</title>

<!-- خطوط جوجل العربية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;family=Cairo:wght@300;400;600;700&amp;family=Tajawal:wght@300;400;500;700&amp;display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   المتغيرات وإعادة الضبط العامة
   ═══════════════════════════════════════════ */
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --danger: #ef4444;
  --success: #22c55e;
  --bg: #e2e8f0;
  --toolbar-bg: #ffffff;
  --paper-bg: #ffffff;
  --border: #cbd5e1;
  --text: #1e293b;
  --text-light: #64748b;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg: 0 6px 24px rgba(0,0,0,.12);
  --radius: 6px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ═══════════════════════════════════════════
   1. الشريط العلوي — سطر واحد مضغوط تماماً
   ═══════════════════════════════════════════ */
.file-bar {
  position: sticky;
  top: 0;
  z-index: 120;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  padding: 4px 10px;
  height: 40px;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
  overflow: visible;
  white-space: nowrap;
}

.file-menu-wrap {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
}

.file-menu-trigger {
  background: rgba(255,255,255,.18);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background .15s;
  flex-shrink: 0;
}

.file-menu-trigger:hover,
.file-menu-trigger.open {
  background: rgba(255,255,255,.32);
}

.file-menu-trigger svg {
  width: 16px;
  height: 16px;
}

.save-status { margin-inline-start: auto; font-size: 11px; font-weight: 700; color: #bbf7d0; padding: 2px 7px; border-radius: 10px; background: rgba(255,255,255,.12); }
.save-status.unsaved { color: #fef08a; }
.file-bar .app-title {
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.file-actions {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 10px 28px rgba(15,23,42,.22);
  padding: 6px;
  display: none;
  flex-direction: column;
  gap: 3px;
  min-width: 155px;
  z-index: 300;
}

.file-actions.show {
  display: flex;
}

.file-actions button {
  background: transparent;
  color: var(--text);
  border: none;
  border-radius: var(--radius);
  padding: 7px 10px;
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: right;
  transition: background .15s;
}

.file-actions button svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
  color: var(--primary);
}

.file-actions button:hover,
.file-actions button:active {
  background: #f1f5f9;
}

.file-actions button.active {
  background: #dbeafe;
  color: var(--primary-hover);
}

/* ═══════════════════════════════════════════
   2. شريط أدوات التنسيق — سطران ثابتان (بدون تمرير)
   ═══════════════════════════════════════════ */
.toolbar-wrap {
  position: sticky;
  top: 40px;
  z-index: 99;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 4px 10px;
  overflow: hidden;
}

.toolbar-row + .toolbar-row {
  border-top: 1px solid #f1f5f9;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.toolbar-row .sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 4px;
}

.toolbar-row button,
.toolbar-row select {
  background: #f1f5f9;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 3px 4px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}

.toolbar-row button {
  min-width: 27px;
  flex-shrink: 0;
}
.format-clear-btn { width: 27px; min-width: 27px; padding: 0 !important; }

.toolbar-row button:hover,
.toolbar-row button:active {
  background: #e2e8f0;
}

.toolbar-row button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.toolbar-row select {
  appearance: auto;
  -webkit-appearance: auto;
  font-size: 11px;
  padding: 2px 2px 2px 14px;
}

#fontFamily {
  max-width: 115px;
  min-width: 85px;
  flex: 0 0 auto;
}

#fontSize {
  max-width: 56px;
  min-width: 44px;
  flex: 0 0 auto;
}

.color-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  background: #f1f5f9;
  border-radius: var(--radius);
  width: 27px;
  height: 28px;
  flex-shrink: 0;
}

.color-btn:hover {
  background: #e2e8f0;
}

.color-btn input[type="color"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.mic-btn.recording {
  background: var(--danger) !important;
  color: #fff !important;
  animation: pulse-mic 1s infinite;
}

@keyframes pulse-mic {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50%      { box-shadow: 0 0 0 5px rgba(239,68,68,0); }
}

/* ═══════════════════════════════════════════
   3. ورقة الكتابة — مقاس A4 القياسي
   ═══════════════════════════════════════════ */
.editor-wrapper {
  display: flex;
  justify-content: center;
  padding: 18px 8px 50px;
}

.paper-stage {
  position: relative;
  width: 210mm;
  max-width: 100%;
  transition: width .2s ease;
}

body.landscape-mode .paper-stage {
  width: 297mm;
}

.page-guides {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

.page-sheet {
  position: absolute;
  left: 0;
  right: 0;
  background: var(--paper-bg);
  border-radius: 3px;
  box-shadow: 0 4px 16px rgba(15,23,42,.13);
  border: 1px solid #cbd5e1;
}

.page-badge {
  position: absolute;
  top: 7px;
  left: 10px;
  font-size: 10px;
  font-weight: 700;
  color: #475569;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  padding: 1px 8px;
  border-radius: 999px;
  opacity: 0.92;
}

.page-gap-label {
  position: absolute;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg);
  color: #475569;
  font-size: 10px;
  font-weight: 700;
  padding: 1px 10px;
  border-radius: 999px;
  border: 1px solid #94a3b8;
  z-index: 3;
}

.paper {
  position: relative;
  z-index: 1;
  background: transparent;
  width: 100%;
  min-height: 297mm;
  max-width: 100%;
  box-sizing: border-box;
  padding: 20mm;
  border-radius: 3px;
  outline: none;
  font-size: 15px;
  line-height: 1.85;
  direction: rtl;
  text-align: justify;
  font-family: 'Cairo', sans-serif;
  caret-color: var(--primary);
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.paper:empty::before {
  content: "ابدأ الكتابة هنا...";
  color: #94a3b8;
  pointer-events: none;
}

.paper:focus {
  box-shadow: none;
}

.paper img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  cursor: pointer;
  transition: outline .15s;
}

.paper img:hover {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.paper img.img-selected {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
}

.paper table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 13px;
  direction: rtl;
}

.paper th, .paper td {
  border: 1px solid #cbd5e1;
  padding: 6px 8px;
  text-align: right;
  vertical-align: top;
}

.paper th {
  background: #f1f5f9;
  font-weight: 700;
}

.paper pre {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  direction: ltr;
  text-align: left;
  margin: 8px 0;
}

.paper blockquote {
  border-right: 3px solid var(--primary);
  padding: 4px 12px;
  margin: 8px 0;
  color: #475569;
  background: #f8fafc;
}

.pdf-page-sep {
  border: none;
  border-top: 1px dashed #cbd5e1;
  margin: 14px 0;
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة والجدول العائم
   ═══════════════════════════════════════════ */
.img-toolbar,
.table-toolbar {
  position: fixed;
  z-index: 9000;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  display: none;
  gap: 3px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  max-width: 340px;
}

.img-toolbar.show,
.table-toolbar.show {
  display: flex;
}

.img-toolbar button,
.table-toolbar button {
  background: #f1f5f9;
  color: var(--text);
  border: none;
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 11px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: all .12s;
}

.img-toolbar button:hover,
.table-toolbar button:hover {
  background: #e2e8f0;
}

.img-toolbar button.danger,
.table-toolbar button.danger {
  color: var(--danger);
}

.img-toolbar button.danger:hover,
.table-toolbar button.danger:hover {
  background: #fef2f2;
}

.img-toolbar .sep,
.table-toolbar .sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════
   نافذة التأكيد المخصصة (Modal)
   ═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.5);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
  backdrop-filter: blur(2px);
}

.modal-overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal-box {
  background: #fff;
  border-radius: 14px;
  padding: 24px 20px 18px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,.22);
  transform: scale(.92);
  transition: transform .2s;
}

.modal-overlay.show .modal-box {
  transform: scale(1);
}

.modal-box .modal-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.modal-box h3 {
  font-size: 17px;
  margin-bottom: 8px;
  font-weight: 700;
}

.modal-box p {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

.modal-box .modal-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.modal-box .btn {
  padding: 9px 20px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.modal-box .btn-confirm {
  background: var(--primary);
  color: #fff;
}

.modal-box .btn-confirm:hover {
  background: var(--primary-hover);
}

.modal-box .btn-danger {
  background: var(--danger);
  color: #fff;
}

.modal-box .btn-danger:hover {
  background: #dc2626;
}

.modal-box .btn-cancel {
  background: #f1f5f9;
  color: var(--text);
}

.modal-box .btn-cancel:hover {
  background: #e2e8f0;
}

.table-dim-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 18px;
  text-align: right;
}

.table-dim-field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}

.table-dim-field input {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  text-align: center;
  outline: none;
}

.table-dim-field input:focus {
  border-color: var(--primary);
}

.modal-filename-wrap {
  display: none;
  margin-bottom: 16px;
  text-align: right;
}

.modal-filename-wrap.show {
  display: block;
}

.modal-filename-wrap label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 5px;
}

.modal-filename-wrap input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text);
  outline: none;
}

.modal-filename-wrap input:focus {
  border-color: var(--primary);
}

/* ═══════════════════════════════════════════
   نافذة المعاينة — A4
   ═══════════════════════════════════════════ */
.preview-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.65);
  z-index: 10000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
}

.preview-overlay.show {
  opacity: 1;
  visibility: visible;
}

.preview-container {
  background: transparent;
  width: 210mm;
  max-width: 100%;
  margin: 10px auto 30px;
}

body.landscape-mode .preview-container {
  width: 297mm;
}

.preview-header {
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  border-radius: 8px;
  margin-bottom: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.22);
}

.preview-stage {
  position: relative;
  width: 100%;
}

.preview-header h3 {
  font-size: 14px;
}

.preview-header button {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.preview-header button:hover {
  background: rgba(255,255,255,.32);
}

.preview-body {
  position: relative;
  z-index: 1;
  background: transparent;
  padding: 20mm;
  direction: rtl;
  text-align: justify;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  line-height: 1.85;
  min-height: 297mm;
  box-sizing: border-box;
}

.preview-body img {
  max-width: 100%;
  height: auto;
}

/* ═══════════════════════════════════════════
   رسالة التنبيه العائمة (Toast)
   ═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1e293b;
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 12px;
  font-family: inherit;
  z-index: 99999;
  opacity: 0;
  transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.success { background: #16a34a; }
.toast.error   { background: #dc2626; }

/* ═══════════════════════════════════════════
   التجاوب مع الهواتف الذكية (Mobile Responsive)
   ═══════════════════════════════════════════ */
@media (max-width: 520px) {
  .file-bar {
    padding: 3px 8px;
    height: 36px;
  }
  .file-bar .app-title {
    font-size: 13px;
  }
  .file-menu-trigger {
    width: 26px;
    height: 26px;
  }

  .toolbar-wrap {
    top: 36px;
  }
  .toolbar-row {
    justify-content: space-between;
    padding: 2px 3px;
    gap: 1px;
  }
  .toolbar-group {
    gap: 2px;
  }
  .toolbar-row button {
    min-width: 24px;
    height: 26px;
    padding: 2px 2px;
    font-size: 11px;
  }
  .toolbar-row select {
    height: 26px;
    font-size: 10px;
  }
  #fontFamily {
    min-width: 46px;
    max-width: 60px;
  }
  .format-clear-btn { width: 24px; min-width: 24px; }
  #fontSize {
    max-width: 36px;
    min-width: 30px;
  }
  .color-btn {
    width: 24px;
    height: 26px;
  }
  .toolbar-row .sep {
    width: 1px;
    height: 18px;
    margin: 0 1px;
  }
  .toolbar-row:nth-child(2) button[onclick="openTableModal()"],
  .toolbar-row:nth-child(2) button[onclick="triggerImageUpload()"],
  .toolbar-row:nth-child(2) .mic-btn {
    padding-left: 2px !important;
    padding-right: 2px !important;
    gap: 1px !important;
  }
  .toolbar-row:nth-child(2) button span { font-size: 10px !important; }

  .editor-wrapper {
    padding: 8px 3px 30px;
  }
  .paper {
    padding: 16mm 10mm;
    min-height: calc(100vw * 1.4142);
    border-radius: 2px;
    font-size: 14px;
  }

  .preview-body {
    padding: 14mm 8mm;
    min-height: auto;
  }
  .img-toolbar,
  .table-toolbar {
    max-width: 94vw;
  }
}

/* ═══════════════════════════════════════════
   إعدادات الطباعة والتصدير — A4 القياسي
   ═══════════════════════════════════════════ */
@media print {
  @page {
    size: A4 portrait;
    margin: 0;
  }

  html, body {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .file-bar, .toolbar-wrap, .toast, .modal-overlay, .preview-overlay, .img-toolbar, .table-toolbar, .page-guides {
    display: none !important;
  }

  .editor-wrapper {
    padding: 0 !important;
    margin: 0 !important;
    display: block !important;
  }

  .paper-stage {
    width: 100% !important;
    max-width: 100% !important;
  }

  .paper {
    box-shadow: none !important;
    width: 100% !important;
    max-width: 100% !important;
    min-height: auto !important;
    border-radius: 0 !important;
    padding: 15mm !important;
    margin: 0 !important;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .paper img {
    outline: none !important;
  }
}

/* تلميحات الأدوات للكمبيوتر */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 5px);
  right: 50%;
  transform: translateX(50%);
  background: #1e293b;
  color: #fff;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
  z-index: 200;
}
[data-tooltip]:hover::after { opacity: 1; }
@media (max-width: 640px) { [data-tooltip]::after { display: none; } }
</style>
</head>

<script>
/* ═══════════════════════════════════════════
   المتغيرات العامة
   ═══════════════════════════════════════════ */
const editor = document.getElementById('editor');
let pendingAction = null;
let recognition = null;
let isRecording = false;
let selectedImage = null;
let activeTableCell = null;
let savedSelection = null;
let isLandscape = false;
let isDirty = false;
const PAGE_GAP = 18;
const undoStack = [];
const redoStack = [];
const MAX_HISTORY = 50;

/* ═══════════════════════════════════════════
   التخزين الدائم عبر IndexedDB (لتجاوز حد 5MB)
   ═══════════════════════════════════════════ */
const DB_NAME = 'MiniWordDB';
const DB_VERSION = 1;
const STORE_NAME = 'docStore';
let dbPromise = null;

function openMiniWordDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error('IndexedDB غير مدعوم في هذا المتصفح'));
      return;
    }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = function(e) {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = function(e) {
      resolve(e.target.result);
    };
    req.onerror = function() {
      dbPromise = null;
      reject(req.error || new Error('تعذر فتح قاعدة البيانات المحلية'));
    };
  });
  return dbPromise;
}

async function idbGet(key) {
  const db = await openMiniWordDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('فشل القراءة من IndexedDB'));
  });
}

async function idbSet(key, value) {
  const db = await openMiniWordDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || req.error || new Error('فشل الكتابة في IndexedDB'));
    tx.onabort = () => reject(tx.error || new Error('تم إلغاء عملية الحفظ'));
  });
}

async function idbDelete(key) {
  const db = await openMiniWordDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error('فشل الحذف من IndexedDB'));
  });
}

/* ═══════════════════════════════════════════
   التعقيم الأمني الصارم ضد XSS عند الاستيراد
   ═══════════════════════════════════════════ */
function sanitizeHtml(html) {
  if (!html) return '';
  const doc = new DOMParser().parseFromString(String(html), 'text/html');
  const dangerousTags = ['script', 'iframe', 'object', 'embed', 'svg', 'style', 'meta', 'link', 'base', 'form'];
  dangerousTags.forEach(tag => {
    doc.querySelectorAll(tag).forEach(el => el.remove());
  });

  const urlAttrs = new Set(['href', 'src', 'action', 'formaction', 'xlink:href', 'poster', 'data', 'background']);
  const allElements = doc.body ? doc.body.querySelectorAll('*') : [];
  allElements.forEach(el => {
    const attrs = Array.from(el.attributes);
    for (const attr of attrs) {
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) {
        el.removeAttribute(attr.name);
        continue;
      }
      if (urlAttrs.has(name)) {
        const cleaned = (attr.value || '').replace(/[\u0000-\u0020]+/g, '').toLowerCase();
        if (cleaned.startsWith('javascript:') || cleaned.startsWith('vbscript:') || cleaned.startsWith('data:text/html')) {
          el.removeAttribute(attr.name);
        }
      } else if (name === 'style') {
        const allowedStyles = new Set(['color', 'background-color', 'font-size', 'font-family', 'text-align', 'font-weight', 'font-style', 'text-decoration', 'direction', 'margin', 'margin-left', 'margin-right', 'width', 'max-width', 'border-collapse', 'vertical-align']);
        const safe = [];
        for (const declaration of (attr.value || '').split(';')) {
          const colon = declaration.indexOf(':');
          if (colon < 1) continue;
          const prop = declaration.slice(0, colon).trim().toLowerCase();
          const value = declaration.slice(colon + 1).trim();
          const compact = value.replace(/[\u0000-\u0020]+/g, '').toLowerCase();
          if (!allowedStyles.has(prop) || !value || /url\s*\(|expression\s*\(|javascript:|vbscript:|@import/i.test(compact)) continue;
          safe.push(prop + ': ' + value);
        }
        if (safe.length) el.setAttribute('style', safe.join('; '));
        else el.removeAttribute(attr.name);
      }
    }
  });

  return doc.body ? doc.body.innerHTML : '';
}

/* ═══════════════════════════════════════════
   ضغط الصور تلقائياً عبر Canvas (حد أقصى 1200px، جودة 0.82)
   ═══════════════════════════════════════════ */
function compressImageDataUrl(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = function() {
      try {
        const maxW = 1200;
        let targetW = img.naturalWidth || img.width || 800;
        let targetH = img.naturalHeight || img.height || 600;
        if (targetW > maxW) {
          targetH = Math.max(1, Math.round(targetH * (maxW / targetW)));
          targetW = maxW;
        }
        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        if (!ctx) {
          resolve(dataUrl);
          return;
        }
        const isPng = /^data:image\/png/i.test(dataUrl);
        if (!isPng) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, targetW, targetH);
        }
        ctx.drawImage(img, 0, 0, targetW, targetH);

        let keepPng = false;
        if (isPng) {
          try {
            const pixels = ctx.getImageData(0, 0, targetW, targetH).data;
            for (let i = 3; i < pixels.length; i += 4) {
              if (pixels[i] < 250) {
                keepPng = true;
                break;
              }
            }
          } catch (e) {
            keepPng = true;
          }
          if (!keepPng) {
            ctx.globalCompositeOperation = 'destination-over';
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, targetW, targetH);
            ctx.globalCompositeOperation = 'source-over';
          }
        }

        const compressed = keepPng
          ? canvas.toDataURL('image/png')
          : canvas.toDataURL('image/jpeg', 0.82);
        resolve(compressed);
      } catch (err) {
        reject(err);
      }
    };
    img.onerror = function() {
      reject(new Error('تعذر تحميل الصورة لضغطها'));
    };
    img.src = dataUrl;
  });
}

function compressImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const out = await compressImageDataUrl(e.target.result);
        resolve(out);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = function() {
      reject(new Error('فشلت قراءة ملف الصورة'));
    };
    reader.readAsDataURL(file);
  });
}

/* ═══════════════════════════════════════════
   تحميل المستند المحفوظ والترحيل التلقائي من localStorage
   ═══════════════════════════════════════════ */
(async function init() {
  try {
    let saved = await idbGet('miniword_content');
    let orient = await idbGet('miniword_orientation');

    // ترحيل البيانات القديمة من localStorage عند أول تشغيل
    let legacyContent = null;
    let legacyOrient = null;
    let legacyTime = null;
    try {
      legacyContent = localStorage.getItem('miniword_content');
      legacyOrient = localStorage.getItem('miniword_orientation');
      legacyTime = localStorage.getItem('miniword_time');
    } catch (lsErr) {
      console.warn('localStorage unavailable:', lsErr);
    }

    if (saved === undefined && legacyContent !== null) {
      saved = legacyContent;
      await idbSet('miniword_content', legacyContent);
      try { localStorage.removeItem('miniword_content'); } catch (e) {}
    }
    if (orient === undefined && legacyOrient !== null) {
      orient = legacyOrient;
      await idbSet('miniword_orientation', legacyOrient);
      try { localStorage.removeItem('miniword_orientation'); } catch (e) {}
    }
    if (legacyTime !== null) {
      const existingTime = await idbGet('miniword_time');
      if (existingTime === undefined) {
        await idbSet('miniword_time', legacyTime);
      }
      try { localStorage.removeItem('miniword_time'); } catch (e) {}
    }

    if (saved) {
      editor.innerHTML = saved;
    }
    if (orient === 'landscape') {
      applyOrientationState(true);
    }
  } catch (e) {
    console.warn('IndexedDB init fallback:', e);
    try {
      const lsSaved = localStorage.getItem('miniword_content');
      if (lsSaved) editor.innerHTML = lsSaved;
      if (localStorage.getItem('miniword_orientation') === 'landscape') {
        applyOrientationState(true);
      }
    } catch (e2) {}
  }
  updatePageGuides();
  syncToolbarState();
  undoStack.length = 0; redoStack.length = 0; clearTimeout(historyTimer);
  pushUndoSnapshot();
  setSaveStatus(true);
})();

function applyOrientationState(landscape) {
  isLandscape = !!landscape;
  document.body.classList.toggle('landscape-mode', isLandscape);
  const btn = document.getElementById('orientationBtn');
  const lbl = document.getElementById('orientationLabel');
  if (btn) btn.classList.toggle('active', isLandscape);
  if (lbl) lbl.textContent = isLandscape ? 'طولي' : 'بالعرض';

  let printStyle = document.getElementById('printOrientationStyle');
  if (!printStyle) {
    printStyle = document.createElement('style');
    printStyle.id = 'printOrientationStyle';
    document.head.appendChild(printStyle);
  }
  printStyle.textContent = `@media print { @page { size: A4 ${isLandscape ? 'landscape' : 'portrait'}; margin: 0; } }`;
}

async function toggleOrientation() {
  applyOrientationState(!isLandscape);
  try {
    await idbSet('miniword_orientation', isLandscape ? 'landscape' : 'portrait');
  } catch (e) {
    console.warn('Failed saving orientation:', e);
    showToast('⚠️ تعذر حفظ إعداد اتجاه الصفحة', 'error');
  }
  updatePageGuides();
  if (selectedImage) showImageToolbar(selectedImage);
  if (activeTableCell) showTableToolbar(activeTableCell);
  showToast(isLandscape ? '↔️ تم تحويل الصفحة إلى العرض (Landscape)' : '↕️ تم تحويل الصفحة إلى الطول (Portrait)', 'success');
}

function getA4PageHeight() {
  const w = editor.clientWidth || (isLandscape ? 1123 : 794);
  const ratio = isLandscape ? (210 / 297) : (297 / 210);
  return Math.max(260, Math.round(w * ratio));
}

function toggleFileMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('fileActionsMenu');

}

function updatePageGuides() {
  const pageHeight = getA4PageHeight();
  editor.style.minHeight = '0px';
  const contentHeight = editor.scrollHeight;
  const totalPages = Math.max(1, Math.ceil(contentHeight / (pageHeight + PAGE_GAP)));
  const totalHeight = totalPages * pageHeight + (totalPages - 1) * PAGE_GAP;
  editor.style.minHeight = totalHeight + 'px';

  const guides = document.getElementById('pageGuides');
  if (!guides) return;
  const orientText = isLandscape ? ' عرضي' : '';
  let html = '';
  for (let i = 0; i < totalPages; i++) {
    const topY = i * (pageHeight + PAGE_GAP);
    html += `<div class="page-sheet" style="top:${topY}px;height:${pageHeight}px;">
      <div class="page-badge">صفحة ${i + 1} / ${totalPages} (A4${orientText})</div>
    </div>`;
    if (i > 0) {
      html += `<div class="page-gap-label" style="top:${topY - PAGE_GAP / 2}px;">صفحة ${i + 1}</div>`;
    }
  }
  guides.innerHTML = html;
}

let historyTimer = null;

/* ═══════════════════════════════════════════
   نظام نوافذ التأكيد الصارم (Modal)
   ═══════════════════════════════════════════ */
function confirmAction(message, action, type, showFilename = false) {
  const modal = document.getElementById('confirmModal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const msg = document.getElementById('modalMessage');
  const btn = document.getElementById('modalConfirmBtn');
  const fnWrap = document.getElementById('modalFileNameWrap');
  const fnInput = document.getElementById('modalFileNameInput');

  if (type === 'danger') {
    icon.textContent = '⚠️';
    title.textContent = 'تأكيد الإجراء';
    btn.className = 'btn btn-danger';
  } else {
    icon.textContent = '✅';
    title.textContent = 'تأكيد';
    btn.className = 'btn btn-confirm';
  }

  if (fnWrap) {
    fnWrap.classList.toggle('show', !!showFilename);
  }
  if (showFilename && fnInput) {
    if (!fnInput.value.trim()) fnInput.value = 'مستند_Mini_Word';
  }

  msg.textContent = message;
  pendingAction = { fn: action, withFilename: !!showFilename };
  modal.classList.add('show');
  if (showFilename && fnInput) {
    setTimeout(() => { fnInput.focus(); fnInput.select(); }, 50);
  }
}

function modalConfirm() {
  const pending = pendingAction;
  const fnInput = document.getElementById('modalFileNameInput');
  const rawName = fnInput ? fnInput.value.trim() : '';
  const cleanName = (rawName || 'مستند_Mini_Word').replace(/[\\/:*?"<>|]+/g, '_').replace(/\.(docx|pdf)$/i, '') || 'مستند_Mini_Word';
  closeModal();
  if (pending && typeof pending.fn === 'function') {
    if (pending.withFilename) {
      pending.fn(cleanName);
    } else {
      pending.fn();
    }
  }
}

function closeModal() {
  document.getElementById('confirmModal').classList.remove('show');
  const fnWrap = document.getElementById('modalFileNameWrap');
  if (fnWrap) fnWrap.classList.remove('show');
  pendingAction = null;
}

function pushUndoSnapshot() {
  const html = editor.innerHTML;
  if (undoStack.length && undoStack[undoStack.length - 1] === html) return;
  undoStack.push(html);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack.length = 0;
}

function restoreHistoryHtml(html) {
  const prevScrollY = window.scrollY;
  editor.innerHTML = html;
  editor.focus();
  window.scrollTo(window.scrollX, prevScrollY);
  hideImageToolbar();
  hideTableToolbar();
  isDirty = true;
  setSaveStatus(false);
  updatePageGuides();
  syncToolbarState();
}

function performUndo() {
  clearTimeout(historyTimer);
  const current = editor.innerHTML;
  if (!undoStack.length) return;
  if (undoStack.length === 1 && undoStack[0] === current) return;
  if (undoStack[undoStack.length - 1] !== current) undoStack.push(current);
  undoStack.pop();
  redoStack.push(current);
  if (redoStack.length > MAX_HISTORY) redoStack.shift();
  const target = undoStack.length ? undoStack[undoStack.length - 1] : '<p><br></p>';
  restoreHistoryHtml(target);
}

function performRedo() {
  clearTimeout(historyTimer);
  if (!redoStack.length) return;
  const next = redoStack.pop();
  if (undoStack[undoStack.length - 1] !== editor.innerHTML) undoStack.push(editor.innerHTML);
  undoStack.push(next);
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  restoreHistoryHtml(next);
}

document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => toast.classList.remove('show'), 2800);
}

/* ═══════════════════════════════════════════
   حفظ واسترجاع موضع المؤشر + مزامنة شريط الأدوات
   ═══════════════════════════════════════════ */
function isNodeInsideEditor(node) {
  let curr = node;
  while (curr) {
    if (curr === editor) return true;
    curr = curr.parentNode;
  }
  return false;
}

function saveSelectionState() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    if (isNodeInsideEditor(range.startContainer)) {
      savedSelection = range.cloneRange();
      return;
    }
  }
}

function restoreSelectionState() {
  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
}

function syncToolbarState() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || !isNodeInsideEditor(sel.anchorNode)) {
    return;
  }

  saveSelectionState();

  const cmds = [
    'bold', 'italic', 'underline', 'strikeThrough',
    'justifyRight', 'justifyCenter', 'justifyLeft', 'justifyFull',
    'insertUnorderedList', 'insertOrderedList'
  ];
  cmds.forEach(cmd => {
    const btn = document.querySelector(`[data-cmd="${cmd}"]`);
    if (!btn) return;
    let active = false;
    try {
      active = document.queryCommandState(cmd);
    } catch (e) {}
    btn.classList.toggle('active', !!active);
  });

  // تحديث شريط أدوات الجدول عند التنقل بلوحة المفاتيح أو المؤشر
  const cellEl = sel.anchorNode.nodeType === 1
    ? sel.anchorNode.closest('td, th')
    : (sel.anchorNode.parentElement ? sel.anchorNode.parentElement.closest('td, th') : null);
  if (cellEl && isNodeInsideEditor(cellEl)) {
    if (activeTableCell !== cellEl) {
      showTableToolbar(cellEl);
    }
  } else if (activeTableCell) {
    hideTableToolbar();
  }

  // مزامنة نوع الخط وحجمه مع موضع المؤشر الحالي
  let anchorEl = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  if (anchorEl && isNodeInsideEditor(anchorEl)) {
    const cs = window.getComputedStyle(anchorEl);
    const fontSelect = document.getElementById('fontFamily');
    if (fontSelect) {
      let qFont = '';
      try { qFont = (document.queryCommandValue('fontName') || '').replace(/['"]/g, '').split(',')[0].trim(); } catch (e) {}
      const computedFont = (cs.fontFamily || '').replace(/['"]/g, '').split(',')[0].trim();
      const targetFont = (qFont || computedFont).toLowerCase();
      for (const opt of fontSelect.options) {
        if (opt.value.toLowerCase() === targetFont) {
          fontSelect.value = opt.value;
          break;
        }
      }
    }

    const sizeSelect = document.getElementById('fontSize');
    if (sizeSelect) {
      let qSize = '';
      try { qSize = String(document.queryCommandValue('fontSize') || '').trim(); } catch (e) {}
      if (/^[1-7]$/.test(qSize)) {
        sizeSelect.value = qSize;
      } else {
        const px = parseFloat(cs.fontSize) || 15;
        const sizeMap = [
          { val: '1', px: 10 },
          { val: '2', px: 13 },
          { val: '3', px: 16 },
          { val: '4', px: 18 },
          { val: '5', px: 24 },
          { val: '6', px: 32 },
          { val: '7', px: 48 }
        ];
        let best = sizeMap[2];
        let minDiff = Infinity;
        for (const item of sizeMap) {
          const diff = Math.abs(px - item.px);
          if (diff < minDiff) {
            minDiff = diff;
            best = item;
          }
        }
        sizeSelect.value = best.val;
      }
    }
  }
}

document.addEventListener('selectionchange', syncToolbarState);
editor.addEventListener('keyup', syncToolbarState);
editor.addEventListener('mouseup', syncToolbarState);

// حفظ موضع التحديد عند لمس أو النقر على قوائم الخطوط والألوان (للهواتف)
['fontFamily', 'fontSize', 'foreColor', 'hiliteColor', 'foreColorBtn', 'hiliteColorBtn'].forEach(id => {

/* ═══════════════════════════════════════════
   عمليات الملفات والتصدير
   ═══════════════════════════════════════════ */

// 0. فتح ملف بالصيغ الأساسية النظيفة

function handleOpenFile(event) {

    );

}

function escapeHtmlStr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function decodeTextBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
    return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  }
  if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
    return new TextDecoder('utf-16be').decode(bytes.subarray(2));
  }
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  }
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) {
    try {
      return new TextDecoder('windows-1256').decode(bytes);
    } catch (e2) {
      return new TextDecoder('utf-8').decode(bytes);
    }
  }
}

async function applyOpenedHtml(htmlContent, fileName, shouldSanitize = true) {
  clearTimeout(historyTimer);
  savedSelection = null;
  const safeHtml = shouldSanitize ? sanitizeHtml(htmlContent) : htmlContent;

    return;
  }
  showToast('📂 تم فتح الملف: ' + fileName, 'success');
}

async function inflateRawBytes(compressed) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('المتصفح لا يدعم فك ضغط الملفات الحديثة (DecompressionStream)');
  }
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(compressed);
  writer.close();
  const ab = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(ab);
}

async function readZipEntries(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  const dec = new TextDecoder('utf-8');

  let eocdOffset = -1;
  const minOff = Math.max(0, bytes.length - 65557);
  for (let i = bytes.length - 22; i >= minOff; i--) {
    if (view.getUint32(i, true) === 0x06054B50) {
      eocdOffset = i;
      break;
    }
  }
  if (eocdOffset === -1) throw new Error('ملف ZIP غير صالح');

  const cdCount = view.getUint16(eocdOffset + 10, true);
  const cdOffset = view.getUint32(eocdOffset + 16, true);

  const entries = {};
  let ptr = cdOffset;
  for (let i = 0; i < cdCount && ptr + 46 <= bytes.length; i++) {
    if (view.getUint32(ptr, true) !== 0x02014B50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;

    if (name.endsWith('/') || localOffset + 30 > bytes.length) continue;
    if (view.getUint32(localOffset, true) !== 0x04034B50) continue;
    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const rawSlice = bytes.subarray(dataStart, dataStart + compSize);

    let outBytes;
    if (method === 0) {
      outBytes = rawSlice;
    } else if (method === 8) {
      outBytes = await inflateRawBytes(rawSlice);
    } else {
      continue;
    }
    entries[name] = outBytes;
  }
  return entries;
}

function uint8ToBase64(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function guessImageMime(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'png') return 'image/png';
  if (ext === 'gif') return 'image/gif';
  if (ext === 'webp') return 'image/webp';
  if (ext === 'svg') return 'image/svg+xml';
  if (ext === 'bmp') return 'image/bmp';
  return 'image/jpeg';
}

function resolveZipPath(baseDir, relTarget) {
  if (!relTarget) return '';
  if (relTarget.startsWith('/')) {
    return relTarget.replace(/^\/+/, '');
  }
  const parts = (baseDir ? baseDir.split('/').filter(Boolean) : []).concat(relTarget.split('/'));
  const stack = [];
  for (const part of parts) {
    if (!part || part === '.') continue;
    if (part === '..') {
      if (stack.length > 0) stack.pop();
    } else {
      stack.push(part);
    }
  }
  return stack.join('/');
}

async function parseDocxToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const docBytes = entries['word/document.xml'];
  if (!docBytes) throw new Error('لم يتم العثور على word/document.xml');

  const dec = new TextDecoder('utf-8');
  const parser = new DOMParser();

  const relMap = {};
  if (entries['word/_rels/document.xml.rels']) {
    const relDoc = parser.parseFromString(dec.decode(entries['word/_rels/document.xml.rels']), 'application/xml');
    const rels = relDoc.getElementsByTagName('Relationship');
    for (const r of rels) {
      const id = r.getAttribute('Id');
      const target = r.getAttribute('Target') || '';
      if (id && target) {
        const normalized = resolveZipPath('word', target);
        if (entries[normalized]) {
          relMap[id] = normalized;
        } else if (entries['word/' + normalized]) {
          relMap[id] = 'word/' + normalized;
        } else {
          const baseName = normalized.split('/').pop();
          const fallbackKey = Object.keys(entries).find(k => k.endsWith('/' + baseName) || k === baseName);
          relMap[id] = fallbackKey || normalized;
        }
      }
    }
  }

  const xmlDoc = parser.parseFromString(dec.decode(docBytes), 'application/xml');
  const body = xmlDoc.getElementsByTagNameNS('*', 'body')[0] || xmlDoc.documentElement;
  const compressedMedia = {};
  for (const mediaPath of new Set(Object.values(relMap))) {
    const bytes = entries[mediaPath];
    if (!bytes || !/^word\/media\//i.test(mediaPath)) continue;
    try {
      const originalUrl = `data:${guessImageMime(mediaPath)};base64,${uint8ToBase64(bytes)}`;
      compressedMedia[mediaPath] = await compressImageDataUrl(originalUrl);
    } catch (e) {
      console.warn('DOCX image compression failed:', mediaPath, e);
    }
  }

  function firstChildByLocal(parent, localName) {
    for (const ch of parent.childNodes) {
      if (ch.nodeType === 1 && ch.localName === localName) return ch;
    }
    return null;
  }

  function getAttrVal(el, attrName) {
    if (!el) return '';
    return el.getAttribute('w:' + attrName) || el.getAttribute(attrName) || '';
  }

  function renderRun(rEl) {
    const rPr = firstChildByLocal(rEl, 'rPr');
    let styles = [];
    let bold = false, italic = false, underline = false, strike = false;

    if (rPr) {
      for (const prop of rPr.childNodes) {
        if (prop.nodeType !== 1) continue;
        const ln = prop.localName;
        if (ln === 'b' || ln === 'bCs') {
          const v = getAttrVal(prop, 'val');
          if (v !== '0' && v !== 'false') bold = true;
        } else if (ln === 'i' || ln === 'iCs') {
          const v = getAttrVal(prop, 'val');
          if (v !== '0' && v !== 'false') italic = true;
        } else if (ln === 'u') {
          const v = getAttrVal(prop, 'val');
          if (v && v !== 'none') underline = true;
        } else if (ln === 'strike' || ln === 'dstrike') {
          const v = getAttrVal(prop, 'val');
          if (v !== '0' && v !== 'false') strike = true;
        } else if (ln === 'color') {
          const v = getAttrVal(prop, 'val');
          if (v && v !== 'auto' && /^[0-9a-fA-F]{6}$/.test(v)) styles.push('color:#' + v);
        } else if (ln === 'highlight') {
          const v = getAttrVal(prop, 'val');
          if (v && v !== 'none') styles.push('background-color:' + escapeHtmlStr(v));
        } else if (ln === 'shd') {
          const fill = getAttrVal(prop, 'fill');
          if (fill && fill !== 'auto' && /^[0-9a-fA-F]{6}$/.test(fill)) {
            styles.push('background-color:#' + fill);
          }
        } else if (ln === 'sz' || ln === 'szCs') {
          const v = parseInt(getAttrVal(prop, 'val'), 10);
          if (v > 0) styles.push('font-size:' + Math.round(v / 2) + 'pt');
        } else if (ln === 'rFonts') {
          const f = prop.getAttribute('w:cs') || prop.getAttribute('w:ascii') || prop.getAttribute('w:hAnsi');
          if (f) styles.push("font-family:'" + escapeHtmlStr(f) + "',Cairo,sans-serif");
        }
      }
    }

    let inner = '';
    for (const ch of rEl.childNodes) {
      if (ch.nodeType !== 1) continue;
      if (ch.localName === 't') {
        inner += escapeHtmlStr(ch.textContent || '');
      } else if (ch.localName === 'tab') {
        inner += '&emsp;';
      } else if (ch.localName === 'br') {
        inner += '<br>';
      } else if (ch.localName === 'drawing' || ch.localName === 'pict') {
        const blips = ch.getElementsByTagNameNS('*', 'blip');
        for (const blip of blips) {
          const rId = blip.getAttribute('r:embed') || blip.getAttribute('embed') || '';
          const mediaPath = relMap[rId];
          if (mediaPath && entries[mediaPath]) {
            const originalUrl = `data:${guessImageMime(mediaPath)};base64,${uint8ToBase64(entries[mediaPath])}`;
            const imageUrl = compressedMedia[mediaPath] || originalUrl;
            inner += `<img src="${imageUrl}" style="max-width:100%;height:auto;border-radius:4px;display:block;margin:8px auto;">`;
          }
        }
      }
    }

    if (!inner) return '';
    if (bold) inner = '<strong>' + inner + '</strong>';
    if (italic) inner = '<em>' + inner + '</em>';
    if (underline) inner = '<u>' + inner + '</u>';
    if (strike) inner = '<s>' + inner + '</s>';
    if (styles.length) inner = `<span style="${styles.join(';')}">${inner}</span>`;
    return inner;
  }

  function renderParagraph(pEl) {
    const pPr = firstChildByLocal(pEl, 'pPr');
    let align = 'right';
    let isList = false;
    let tag = 'p';

    if (pPr) {
      const jc = firstChildByLocal(pPr, 'jc');
      if (jc) {
        const v = getAttrVal(jc, 'val');
        if (v === 'center') align = 'center';
        else if (v === 'left') align = 'left';
        else if (v === 'both' || v === 'distribute') align = 'justify';
      }
      if (firstChildByLocal(pPr, 'numPr')) isList = true;
      const pStyle = firstChildByLocal(pPr, 'pStyle');
      if (pStyle) {
        const sv = getAttrVal(pStyle, 'val');
        const hm = sv.match(/^Heading([1-6])$/i);
        if (hm) tag = 'h' + hm[1];
        else if (/^Quote$/i.test(sv)) tag = 'blockquote';
      }
    }

    let content = '';
    for (const ch of pEl.childNodes) {
      if (ch.nodeType !== 1) continue;
      if (ch.localName === 'r') {
        content += renderRun(ch);
      } else if (ch.localName === 'hyperlink') {
        for (const hr of ch.childNodes) {
          if (hr.nodeType === 1 && hr.localName === 'r') content += renderRun(hr);
        }
      }
    }

    if (!content.trim()) return '<p><br></p>';
    if (isList) content = '• ' + content;
    return `<${tag} style="text-align:${align};">${content}</${tag}>`;
  }

  function renderTable(tblEl) {
    const tblPr = firstChildByLocal(tblEl, 'tblPr');
    const tblGrid = firstChildByLocal(tblEl, 'tblGrid');
    const gridCols = [];
    let totalGridW = 0;
    if (tblGrid) {
      for (const gc of tblGrid.childNodes) {
        if (gc.nodeType === 1 && gc.localName === 'gridCol') {
          const w = parseInt(getAttrVal(gc, 'w'), 10) || 0;
          gridCols.push(w);
          totalGridW += w;
        }
      }
    }

    const tblStyles = ['border-collapse:collapse', 'max-width:100%'];
    let tblWidthPct = '100%';
    if (tblPr) {
      const tblW = firstChildByLocal(tblPr, 'tblW');
      if (tblW) {
        const wVal = parseInt(getAttrVal(tblW, 'w'), 10) || 0;
        const wType = getAttrVal(tblW, 'type');
        if (wType === 'pct' && wVal > 0) tblWidthPct = Math.min(100, Math.round(wVal / 50)) + '%';
        else if (wType === 'dxa' && wVal > 0) tblStyles.push('width:' + Math.round(wVal / 15) + 'px');
      }
      if (!tblStyles.some(s => s.startsWith('width:'))) tblStyles.push('width:' + tblWidthPct);
      const jc = firstChildByLocal(tblPr, 'jc');
      if (jc) {
        const jv = getAttrVal(jc, 'val');
        if (jv === 'center') tblStyles.push('margin:10px auto');
        else if (jv === 'left') tblStyles.push('margin:10px auto 10px 0');
        else tblStyles.push('margin:10px 0 10px auto');
      }
      const bidiVis = firstChildByLocal(tblPr, 'bidiVisual');
      if (bidiVis) tblStyles.push('direction:rtl');
    } else {
      tblStyles.push('width:100%');
    }

    const trEls = [];
    for (const ch of tblEl.childNodes) {
      if (ch.nodeType === 1 && ch.localName === 'tr') trEls.push(ch);
    }

    const gridRows = [];
    const openVMerge = {};
    trEls.forEach((trEl, rIdx) => {
      const rowCells = [];
      const trPr = firstChildByLocal(trEl, 'trPr');
      const isHeaderRow = trPr && !!firstChildByLocal(trPr, 'tblHeader');
      let colIdx = 0;

      for (const tc of trEl.childNodes) {
        if (tc.nodeType !== 1 || tc.localName !== 'tc') continue;
        const tcPr = firstChildByLocal(tc, 'tcPr');
        let colspan = 1;
        let vMerge = null;
        const tcStyles = [];

        if (tcPr) {
          const gs = firstChildByLocal(tcPr, 'gridSpan');
          if (gs) colspan = Math.max(1, parseInt(getAttrVal(gs, 'val'), 10) || 1);

          const vm = firstChildByLocal(tcPr, 'vMerge');
          if (vm) {
            const vVal = getAttrVal(vm, 'val');
            vMerge = vVal === 'restart' ? 'restart' : 'continue';
          }

          const tcW = firstChildByLocal(tcPr, 'tcW');
          if (tcW) {
            const wVal = parseInt(getAttrVal(tcW, 'w'), 10) || 0;
            const wType = getAttrVal(tcW, 'type');
            if (wType === 'pct' && wVal > 0) tcStyles.push('width:' + Math.round(wVal / 50) + '%');
            else if (wType === 'dxa' && wVal > 0 && totalGridW > 0) {
              tcStyles.push('width:' + Math.round((wVal / totalGridW) * 100) + '%');
            }
          } else if (totalGridW > 0 && gridCols[colIdx]) {
            let spanW = 0;
            for (let k = 0; k < colspan; k++) spanW += (gridCols[colIdx + k] || 0);
            if (spanW > 0) tcStyles.push('width:' + Math.round((spanW / totalGridW) * 100) + '%');
          }

          const shd = firstChildByLocal(tcPr, 'shd');
          if (shd) {
            const fill = getAttrVal(shd, 'fill');
            if (fill && fill !== 'auto' && /^[0-9a-fA-F]{6}$/.test(fill)) {
              tcStyles.push('background-color:#' + fill);
            }
          }

          const vAlign = firstChildByLocal(tcPr, 'vAlign');
          if (vAlign) {
            const va = getAttrVal(vAlign, 'val');
            if (va === 'center') tcStyles.push('vertical-align:middle');
            else if (va === 'bottom') tcStyles.push('vertical-align:bottom');
            else if (va === 'top') tcStyles.push('vertical-align:top');
          }

          const tcBorders = firstChildByLocal(tcPr, 'tcBorders');
          if (tcBorders) {
            ['top', 'right', 'bottom', 'left'].forEach(side => {
              const bEl = firstChildByLocal(tcBorders, side);
              if (bEl) {
                const bVal = getAttrVal(bEl, 'val');
                if (bVal === 'none' || bVal === 'nil') {
                  tcStyles.push(`border-${side}:none`);
                } else {
                  const bColor = getAttrVal(bEl, 'color');
                  const cHex = (bColor && bColor !== 'auto' && /^[0-9a-fA-F]{6}$/.test(bColor)) ? '#' + bColor : '#cbd5e1';
                  tcStyles.push(`border-${side}:1px solid ${cHex}`);
                }
              }
            });
          }
        }

        if (vMerge === 'continue' && openVMerge[colIdx]) {
          openVMerge[colIdx].rowspan += 1;
          colIdx += colspan;
          continue;
        }

        let cellContent = '';
        for (const child of tc.childNodes) {
          if (child.nodeType !== 1) continue;
          if (child.localName === 'p') cellContent += renderParagraph(child);
          else if (child.localName === 'tbl') cellContent += renderTable(child);
        }

        const cellObj = {
          tag: isHeaderRow ? 'th' : 'td',
          colspan,
          rowspan: 1,
          style: tcStyles.join(';'),
          html: cellContent || '&nbsp;'
        };
        rowCells.push(cellObj);

        if (vMerge === 'restart') {
          openVMerge[colIdx] = cellObj;
        } else {
          delete openVMerge[colIdx];
        }
        colIdx += colspan;
      }
      gridRows.push(rowCells);
    });

    let rowsHtml = '';
    for (const r of gridRows) {
      let cellsHtml = '';
      for (const c of r) {
        const attrs = [];
        if (c.colspan > 1) attrs.push(`colspan="${c.colspan}"`);
        if (c.rowspan > 1) attrs.push(`rowspan="${c.rowspan}"`);
        if (c.style) attrs.push(`style="${c.style}"`);
        cellsHtml += `<${c.tag}${attrs.length ? ' ' + attrs.join(' ') : ''}>${c.html}</${c.tag}>`;
      }
      rowsHtml += '<tr>' + cellsHtml + '</tr>';
    }
    return `<table style="${tblStyles.join(';')}">${rowsHtml}</table>`;
  }

  let out = '';
  for (const ch of body.childNodes) {
    if (ch.nodeType !== 1) continue;
    if (ch.localName === 'p') out += renderParagraph(ch);
    else if (ch.localName === 'tbl') out += renderTable(ch);
  }
  return sanitizeHtml(out || '<p><br></p>');
}

async function parseOdtToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const contentBytes = entries['content.xml'];
  if (!contentBytes) throw new Error('ملف ODT غير صالح');
  const xmlDoc = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(contentBytes), 'application/xml');
  const textBody = xmlDoc.getElementsByTagNameNS('*', 'text')[0] || xmlDoc.documentElement;
  const compressedMedia = {};
  for (const [mediaPath, bytes] of Object.entries(entries)) {
    if (!/^Pictures\//i.test(mediaPath) || !/\.(png|jpe?g|gif|webp|bmp)$/i.test(mediaPath)) continue;
    try {
      const originalUrl = `data:${guessImageMime(mediaPath)};base64,${uint8ToBase64(bytes)}`;
      compressedMedia[mediaPath] = await compressImageDataUrl(originalUrl);
    } catch (e) {
      console.warn('ODT image compression failed:', mediaPath, e);
    }
  }

  let out = '';
  function walkOdt(node) {
    let html = '';
    for (const ch of node.childNodes) {
      if (ch.nodeType === 3) {
        html += escapeHtmlStr(ch.nodeValue);
      } else if (ch.nodeType === 1) {
        const ln = ch.localName;
        if (ln === 'h') {
          const lvl = Math.min(6, Math.max(1, parseInt(ch.getAttribute('text:outline-level') || '2', 10)));
          html += `<h${lvl}>${walkOdt(ch)}</h${lvl}>`;
        } else if (ln === 'p') {
          const inner = walkOdt(ch);
          html += `<p>${inner || '<br>'}</p>`;
        } else if (ln === 'list') {
          html += `<ul>${walkOdt(ch)}</ul>`;
        } else if (ln === 'list-item') {
          html += `<li>${walkOdt(ch)}</li>`;
        } else if (ln === 'table') {
          html += `<table>${walkOdt(ch)}</table>`;
        } else if (ln === 'table-row') {
          html += `<tr>${walkOdt(ch)}</tr>`;
        } else if (ln === 'table-cell') {
          html += `<td>${walkOdt(ch) || '&nbsp;'}</td>`;
        } else if (ln === 'image') {
          const href = ch.getAttribute('xlink:href') || '';
          if (href && entries[href]) {
            const originalUrl = `data:${guessImageMime(href)};base64,${uint8ToBase64(entries[href])}`;
            const imageUrl = compressedMedia[href] || originalUrl;
            html += `<img src="${imageUrl}" style="max-width:100%;height:auto;display:block;margin:8px auto;">`;
          }
        } else if (ln === 'line-break') {
          html += '<br>';
        } else if (ln === 'tab') {
          html += '&emsp;';
        } else {
          html += walkOdt(ch);
        }
      }
    }
    return html;
  }
  out = walkOdt(textBody);
  return sanitizeHtml(out || '<p><br></p>');
}


function parseMarkdownToHtml(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let inCode = false;
  let codeBuf = [];
  let inList = false;

  function inlineMd(s) {
    let t = escapeHtmlStr(s);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return t;
  }

  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inCode) {
        inCode = true;
        codeBuf = [];
      } else {
        inCode = false;
        html += '<pre>' + escapeHtmlStr(codeBuf.join('\n')) + '</pre>';
      }
      continue;
    }
    if (inCode) {
      codeBuf.push(line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h${hm[1].length}>${inlineMd(hm[2])}</h${hm[1].length}>`;
      continue;
    }
    if (/^>\s?/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<blockquote>${inlineMd(line.replace(/^>\s?/, ''))}</blockquote>`;
      continue;
    }
    const lm = line.match(/^\s*[-*+]\s+(.*)$/) || line.match(/^\s*\d+\.\s+(.*)$/);
    if (lm) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(lm[1])}</li>`;
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^---+$/.test(line.trim())) {
      html += '<hr class="pdf-page-sep">';
    } else if (line.trim() === '') {
      html += '<p><br></p>';
    } else {
      html += `<p>${inlineMd(line)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  if (inCode) html += '<pre>' + escapeHtmlStr(codeBuf.join('\n')) + '</pre>';
  return html;
}

function parseCsvToHtml(text, delimiter) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (ch === '"') {
        inQuotes = false;
      } else {
        cell += ch;
      }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delimiter) { row.push(cell); cell = ''; }
      else if (ch === '\r' && text[i + 1] === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; }
      else if (ch === '\n' || ch === '\r') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return '<p><br></p>';

  let html = '<table>';
  rows.forEach((r, idx) => {
    const tag = idx === 0 ? 'th' : 'td';
    html += '<tr>' + r.map(c => `<${tag}>${escapeHtmlStr(c)}</${tag}>`).join('') + '</tr>';
  });
  html += '</table>';
  return html;
}


async function processOpenFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const type = (file.type || '').toLowerCase();

  if (type.startsWith('image/') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico'].includes(ext)) {
    showToast('⏳ جاري ضغط الصورة وفتحها...', '');
    try {
      const compressedDataUrl = await compressImageFile(file);
      await applyOpenedHtml(`<p style="text-align:center;"><img src="${compressedDataUrl}" style="max-width:100%;height:auto;border-radius:4px;display:block;margin:10px auto;"></p>`, file.name, false);
    } catch (err) {
      console.error('Image open error:', err);
      showToast('❌ فشلت قراءة أو ضغط الصورة', 'error');
    }
    return;
  }

  showToast('⏳ جاري فتح الملف...', '');

  try {
    const buffer = await file.arrayBuffer();

    if (ext === 'docx') {
      const htmlOut = await parseDocxToHtml(buffer);
      await applyOpenedHtml(htmlOut, file.name, false);
    } else if (ext === 'odt') {
      const htmlOut = await parseOdtToHtml(buffer);
      await applyOpenedHtml(htmlOut, file.name, false);
    } else if (ext === 'md' || ext === 'markdown') {
      const txt = decodeTextBuffer(buffer);
      await applyOpenedHtml(parseMarkdownToHtml(txt), file.name, false);
    } else if (ext === 'html' || ext === 'htm' || ext === 'xhtml') {
      const txt = decodeTextBuffer(buffer);
      const sanitized = sanitizeHtml(txt);
      await applyOpenedHtml(sanitized || escapeHtmlStr(txt), file.name, false);
    } else if (ext === 'csv' || ext === 'tsv') {
      const txt = decodeTextBuffer(buffer);
      const delim = ext === 'tsv' ? '\t' : (txt.split('\n')[0].includes(';') && !txt.split('\n')[0].includes(',') ? ';' : ',');
      await applyOpenedHtml(parseCsvToHtml(txt, delim), file.name, false);
    } else if (ext === 'json') {
      const txt = decodeTextBuffer(buffer);
      let formatted = txt;
      try { formatted = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) {}
      await applyOpenedHtml(`<pre>${escapeHtmlStr(formatted)}</pre>`, file.name, false);
    } else if (ext === 'xml' || ext === 'svg' || ext === 'yaml' || ext === 'yml' || ext === 'css' || ext === 'js') {
      const txt = decodeTextBuffer(buffer);
      await applyOpenedHtml(`<pre>${escapeHtmlStr(txt)}</pre>`, file.name, false);
    } else {
      const txt = decodeTextBuffer(buffer);
      const htmlOut = txt.replace(/\r\n/g, '\n').split('\n').map(l => l.trim() ? `<p>${escapeHtmlStr(l)}</p>` : '<p><br></p>').join('');
      await applyOpenedHtml(htmlOut, file.name, false);
    }
  } catch (err) {
    console.error('Open file error:', err);
    showToast('❌ تعذر فتح الملف: ' + (err.message || 'صيغة غير مدعومة'), 'error');
  }
}

// 1. مستند جديد
async function newDocument() {
  clearTimeout(historyTimer);
  pushUndoSnapshot();
  savedSelection = null;
  editor.innerHTML = '';
  isDirty = true; setSaveStatus(false);
  try {
    await idbDelete('miniword_content');
    await idbDelete('miniword_time');
    isDirty = false;
    setSaveStatus(true);
    try {
      localStorage.removeItem('miniword_content');
      localStorage.removeItem('miniword_time');
    } catch (e) {}
  } catch (e) {
    console.warn('IndexedDB delete error:', e);
    showToast('⚠️ تعذر مسح النسخة المحفوظة محلياً', 'error');
  }
  hideImageToolbar();
  hideTableToolbar();
  updatePageGuides();
  syncToolbarState();
  showToast('📄 تم فتح مستند جديد', 'success');
}
