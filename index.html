<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Word — محرر نصوص عربي</title>

<!-- خطوط جوجل العربية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Cairo:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<!-- مكتبة html2pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

<style>
/* ═══════════════════════════════════════════
   المتغيرات وإعادة الضبط العامة
   ═══════════════════════════════════════════ */
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --danger: #ef4444;
  --success: #22c55e;
  --bg: #e2e8f0;
  --toolbar-bg: #ffffff;
  --paper-bg: #ffffff;
  --border: #cbd5e1;
  --text: #1e293b;
  --text-light: #64748b;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg: 0 6px 24px rgba(0,0,0,.12);
  --radius: 6px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ═══════════════════════════════════════════
   1. الشريط العلوي — سطر واحد مضغوط تماماً
   ═══════════════════════════════════════════ */
.file-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 4px 8px;
  height: 40px;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
  overflow: hidden;
  white-space: nowrap;
}

.file-bar .app-title {
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.file-bar .app-title svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.file-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.file-actions button {
  background: rgba(255,255,255,.16);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 4px 7px;
  font-size: 11px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  height: 28px;
  transition: background .15s;
  flex-shrink: 0;
}

.file-actions button svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.file-actions button:hover,
.file-actions button:active {
  background: rgba(255,255,255,.28);
}

/* ═══════════════════════════════════════════
   2. شريط أدوات التنسيق — سطران ثابتان (بدون تمرير)
   ═══════════════════════════════════════════ */
.toolbar-wrap {
  position: sticky;
  top: 40px;
  z-index: 99;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2px;
  padding: 3px 5px;
  overflow: hidden;
}

.toolbar-row + .toolbar-row {
  border-top: 1px solid #f1f5f9;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.toolbar-row .sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 1px;
}

.toolbar-row button,
.toolbar-row select {
  background: #f1f5f9;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 3px 4px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}

.toolbar-row button {
  min-width: 27px;
  flex-shrink: 0;
}

.toolbar-row button:hover,
.toolbar-row button:active {
  background: #e2e8f0;
}

.toolbar-row button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.toolbar-row select {
  appearance: auto;
  -webkit-appearance: auto;
  font-size: 11px;
  padding: 2px 2px 2px 14px;
}

#fontFamily {
  max-width: 82px;
  min-width: 62px;
  flex: 1 1 auto;
}

#fontSize {
  max-width: 44px;
  min-width: 36px;
  flex: 0 1 auto;
}

.color-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  background: #f1f5f9;
  border-radius: var(--radius);
  width: 27px;
  height: 28px;
  flex-shrink: 0;
}

.color-btn:hover {
  background: #e2e8f0;
}

.color-btn input[type="color"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.mic-btn.recording {
  background: var(--danger) !important;
  color: #fff !important;
  animation: pulse-mic 1s infinite;
}

@keyframes pulse-mic {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50%      { box-shadow: 0 0 0 5px rgba(239,68,68,0); }
}

/* ═══════════════════════════════════════════
   3. ورقة الكتابة — مقاس A4 القياسي
   ═══════════════════════════════════════════ */
.editor-wrapper {
  display: flex;
  justify-content: center;
  padding: 18px 8px 50px;
}

.paper-stage {
  position: relative;
  width: 210mm;
  max-width: 100%;
}

.page-guides {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}

.page-badge {
  position: absolute;
  font-size: 10px;
  font-weight: 700;
  color: #475569;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  padding: 1px 8px;
  border-radius: 999px;
  opacity: 0.9;
}

.page-break-marker {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px dashed #64748b;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-break-pill {
  background: #e2e8f0;
  color: #1e293b;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid #94a3b8;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
  transform: translateY(-50%);
}

.paper {
  position: relative;
  z-index: 1;
  background: var(--paper-bg);
  width: 100%;
  min-height: 297mm;
  max-width: 100%;
  box-sizing: border-box;
  padding: 20mm;
  border-radius: 2px;
  box-shadow: var(--shadow-lg);
  outline: none;
  font-size: 15px;
  line-height: 1.85;
  direction: rtl;
  text-align: right;
  font-family: 'Cairo', sans-serif;
  caret-color: var(--primary);
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.paper:empty::before {
  content: "ابدأ الكتابة هنا...";
  color: #94a3b8;
  pointer-events: none;
}

.paper:focus {
  box-shadow: 0 0 0 3px rgba(37,99,235,.15), var(--shadow-lg);
}

.paper img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  cursor: pointer;
  transition: outline .15s;
}

.paper img:hover {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.paper img.img-selected {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة العائم
   ═══════════════════════════════════════════ */
.img-toolbar {
  position: fixed;
  z-index: 9000;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  display: none;
  gap: 3px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  max-width: 330px;
}

.img-toolbar.show {
  display: flex;
}

.img-toolbar button {
  background: #f1f5f9;
  color: var(--text);
  border: none;
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 11px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: all .12s;
}

.img-toolbar button:hover {
  background: #e2e8f0;
}

.img-toolbar button.danger {
  color: var(--danger);
}

.img-toolbar button.danger:hover {
  background: #fef2f2;
}

.img-toolbar .sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════
   نافذة التأكيد المخصصة (Modal)
   ═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.5);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
  backdrop-filter: blur(2px);
}

.modal-overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal-box {
  background: #fff;
  border-radius: 14px;
  padding: 24px 20px 18px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,.22);
  transform: scale(.92);
  transition: transform .2s;
}

.modal-overlay.show .modal-box {
  transform: scale(1);
}

.modal-box .modal-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.modal-box h3 {
  font-size: 17px;
  margin-bottom: 8px;
  font-weight: 700;
}

.modal-box p {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

.modal-box .modal-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.modal-box .btn {
  padding: 9px 20px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.modal-box .btn-confirm {
  background: var(--primary);
  color: #fff;
}

.modal-box .btn-confirm:hover {
  background: var(--primary-hover);
}

.modal-box .btn-danger {
  background: var(--danger);
  color: #fff;
}

.modal-box .btn-danger:hover {
  background: #dc2626;
}

.modal-box .btn-cancel {
  background: #f1f5f9;
  color: var(--text);
}

.modal-box .btn-cancel:hover {
  background: #e2e8f0;
}

/* ═══════════════════════════════════════════
   نافذة المعاينة — A4
   ═══════════════════════════════════════════ */
.preview-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.65);
  z-index: 10000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
}

.preview-overlay.show {
  opacity: 1;
  visibility: visible;
}

.preview-container {
  background: #fff;
  width: 210mm;
  max-width: 100%;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 16px 45px rgba(0,0,0,.3);
  margin: 10px auto 30px;
}

.preview-header {
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
}

.preview-header h3 {
  font-size: 14px;
}

.preview-header button {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.preview-header button:hover {
  background: rgba(255,255,255,.32);
}

.preview-body {
  padding: 20mm;
  direction: rtl;
  text-align: right;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  line-height: 1.85;
  min-height: 297mm;
  box-sizing: border-box;
}

.preview-body img {
  max-width: 100%;
  height: auto;
}

/* ═══════════════════════════════════════════
   رسالة التنبيه العائمة (Toast)
   ═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1e293b;
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 12px;
  font-family: inherit;
  z-index: 99999;
  opacity: 0;
  transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.success { background: #16a34a; }
.toast.error   { background: #dc2626; }

/* ═══════════════════════════════════════════
   التجاوب مع الهواتف الذكية (Mobile Responsive)
   ═══════════════════════════════════════════ */
@media (max-width: 520px) {
  .file-bar {
    padding: 3px 5px;
    height: 36px;
  }
  .file-bar .app-title {
    font-size: 11px;
    gap: 3px;
  }
  .file-bar .app-title svg {
    width: 14px;
    height: 14px;
  }
  .file-actions {
    gap: 2px;
  }
  .file-actions button {
    padding: 3px 5px;
    font-size: 10px;
    height: 25px;
    gap: 2px;
  }
  .file-actions button svg {
    width: 11px;
    height: 11px;
  }

  .toolbar-wrap {
    top: 36px;
  }
  .toolbar-row {
    padding: 2px 3px;
    gap: 1px;
  }
  .toolbar-row button {
    min-width: 25px;
    height: 26px;
    padding: 2px 2px;
    font-size: 11px;
  }
  .toolbar-row select {
    height: 26px;
    font-size: 10px;
  }
  #fontFamily {
    max-width: 68px;
    min-width: 54px;
  }
  #fontSize {
    max-width: 36px;
    min-width: 32px;
  }
  .color-btn {
    width: 25px;
    height: 26px;
  }
  .toolbar-row .sep {
    height: 18px;
  }

  .editor-wrapper {
    padding: 8px 3px 30px;
  }
  .paper {
    padding: 16mm 10mm;
    min-height: calc(100vw * 1.4142);
    border-radius: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    font-size: 14px;
  }

  .preview-body {
    padding: 14mm 8mm;
    min-height: auto;
  }
  .img-toolbar {
    max-width: 94vw;
  }
}

/* ═══════════════════════════════════════════
   إعدادات الطباعة والتصدير — A4 القياسي
   ═══════════════════════════════════════════ */
@media print {
  @page {
    size: A4 portrait;
    margin: 15mm;
  }

  html, body {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .file-bar, .toolbar-wrap, .toast, .modal-overlay, .preview-overlay, .img-toolbar, .page-guides {
    display: none !important;
  }

  .editor-wrapper {
    padding: 0 !important;
    margin: 0 !important;
    display: block !important;
  }

  .paper {
    box-shadow: none !important;
    width: 100% !important;
    max-width: 100% !important;
    min-height: auto !important;
    border-radius: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .paper img {
    outline: none !important;
  }
}

/* تلميحات الأدوات للكمبيوتر */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 5px);
  right: 50%;
  transform: translateX(50%);
  background: #1e293b;
  color: #fff;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
  z-index: 200;
}
[data-tooltip]:hover::after { opacity: 1; }
@media (max-width: 640px) { [data-tooltip]::after { display: none; } }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     1. الشريط العلوي — سطر واحد مضغوط
     ═══════════════════════════════════════ -->
<div class="file-bar">
  <span class="app-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    Mini Word
  </span>

  <div class="file-actions">
    <button onclick="confirmAction('هل تريد إنشاء مستند جديد؟\nسيتم مسح المحتوى الحالي.', newDocument, 'danger')" data-tooltip="مستند جديد">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      <span>جديد</span>
    </button>

    <button onclick="confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm')" data-tooltip="حفظ محلي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      <span>حفظ</span>
    </button>

    <button onclick="confirmAction('هل تريد تنزيل المستند بصيغة Word؟', exportWord, 'confirm')" data-tooltip="تصدير Word">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span>Word</span>
    </button>

    <button onclick="confirmAction('هل تريد تصدير المستند بصيغة PDF؟', exportPDF, 'confirm')" data-tooltip="تصدير PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="2" width="20" height="20" rx="2"/><text x="12" y="16" text-anchor="middle" font-size="10" fill="currentColor" stroke="none" font-weight="bold">P</text></svg>
      <span>PDF</span>
    </button>

    <button onclick="openPreview()" data-tooltip="معاينة الطباعة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>معاينة</span>
    </button>
  </div>
</div>

<!-- ═══════════════════════════════════════
     2. شريط أدوات التنسيق — سطران ثابتان
     ═══════════════════════════════════════ -->
<div class="toolbar-wrap" id="toolbarWrap">

  <!-- السطر الأول: الخط + الحجم + B I U S + الألوان -->
  <div class="toolbar-row">
    <div class="toolbar-group">
      <select id="fontFamily" onchange="applyFontFamily(this.value)" data-tooltip="نوع الخط">
        <option value="Cairo">Cairo</option>
        <option value="Tajawal">Tajawal</option>
        <option value="Amiri">Amiri</option>
        <option value="Arial">Arial</option>
        <option value="Tahoma">Tahoma</option>
      </select>

      <select id="fontSize" onchange="applyFontSize(this.value)" data-tooltip="حجم الخط">
        <option value="1">10</option>
        <option value="2">12</option>
        <option value="3" selected>14</option>
        <option value="4">18</option>
        <option value="5">24</option>
        <option value="6">32</option>
        <option value="7">48</option>
      </select>

      <button onclick="changeFontSizeStep(1)" data-tooltip="تكبير" style="font-weight:700;">A+</button>
      <button onclick="changeFontSizeStep(-1)" data-tooltip="تصغير" style="font-size:10px;">A−</button>

<script>
/* ═══════════════════════════════════════════
   المتغيرات العامة
   ═══════════════════════════════════════════ */
const editor = document.getElementById('editor');
let pendingAction = null;
let recognition = null;
let isRecording = false;
let selectedImage = null;
let savedSelection = null;

/* ═══════════════════════════════════════════
   تحميل المستند المحفوظ عند فتح الصفحة
   ═══════════════════════════════════════════ */
(function init() {
  try {
    const saved = localStorage.getItem('miniword_content');
    if (saved) {
      editor.innerHTML = saved;
    }
  } catch (e) {
    console.warn('localStorage unavailable:', e);
  }
  updatePageGuides();
})();

function getA4PageHeight() {
  const w = editor.clientWidth || 794;
  return Math.max(360, Math.round(w * (297 / 210)));
}

function updatePageGuides() {
  const pageHeight = getA4PageHeight();
  editor.style.minHeight = '0px';
  const contentHeight = editor.scrollHeight;
  const totalPages = Math.max(1, Math.ceil(contentHeight / pageHeight));
  editor.style.minHeight = (totalPages * pageHeight) + 'px';

  const guides = document.getElementById('pageGuides');
  if (!guides) return;
  let html = `<div class="page-badge" style="top:6px;left:10px;">صفحة 1 / ${totalPages} (A4)</div>`;
  for (let i = 1; i < totalPages; i++) {
    const y = i * pageHeight;
    html += `<div class="page-break-marker" style="top:${y}px;">
      <span class="page-break-pill">بداية صفحة ${i + 1} (A4)</span>
    </div>`;
  }
  guides.innerHTML = html;
}

editor.addEventListener('input', updatePageGuides);
window.addEventListener('resize', updatePageGuides);

/* ═══════════════════════════════════════════
   حماية منع إغلاق الصفحة بالخطأ
   ═══════════════════════════════════════════ */
window.addEventListener('beforeunload', function(e) {
  if (editor.innerHTML.trim() !== '') {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ═══════════════════════════════════════════
   نظام نوافذ التأكيد الصارم (Modal)
   ═══════════════════════════════════════════ */
function confirmAction(message, action, type) {
  const modal = document.getElementById('confirmModal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const msg = document.getElementById('modalMessage');
  const btn = document.getElementById('modalConfirmBtn');

  if (type === 'danger') {
    icon.textContent = '⚠️';
    title.textContent = 'تأكيد الإجراء';
    btn.className = 'btn btn-danger';
  } else {
    icon.textContent = '✅';
    title.textContent = 'تأكيد';
    btn.className = 'btn btn-confirm';
  }

  msg.textContent = message;
  pendingAction = action;
  modal.classList.add('show');
}

function modalConfirm() {
  const action = pendingAction;
  closeModal();
  if (typeof action === 'function') {
    action();
  }
}

function closeModal() {
  document.getElementById('confirmModal').classList.remove('show');
  pendingAction = null;
}

document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ═══════════════════════════════════════════
   رسائل Toast
   ═══════════════════════════════════════════ */
function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => toast.classList.remove('show'), 2800);
}

/* ═══════════════════════════════════════════
   حفظ واسترجاع موضع المؤشر
   ═══════════════════════════════════════════ */
function saveSelectionState() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    while (node) {
      if (node === editor) {
        savedSelection = range.cloneRange();
        return;
      }
      node = node.parentNode;
    }
  }
  savedSelection = null;
}

function restoreSelectionState() {
  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
}

/* ═══════════════════════════════════════════
   عمليات الملفات والتصدير
   ═══════════════════════════════════════════ */

// 1. مستند جديد
function newDocument() {
  editor.innerHTML = '';
  try {
    localStorage.removeItem('miniword_content');
    localStorage.removeItem('miniword_time');
  } catch (e) {
    console.warn('localStorage unavailable:', e);
  }
  hideImageToolbar();
  updatePageGuides();
  showToast('📄 تم فتح مستند جديد', 'success');
}

// 2. حفظ محلي
function saveDocument() {
  try {
    localStorage.setItem('miniword_content', editor.innerHTML);
    const now = new Date();
    const timeStr = now.toLocaleString('ar-EG', {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
    localStorage.setItem('miniword_time', timeStr);
    showToast('✅ تم الحفظ بنجاح في المتصفح', 'success');
  } catch (e) {
    console.error('Save error:', e);
    showToast('❌ تعذر الحفظ في المتصفح (المساحة ممتلئة أو التخزين محظور)', 'error');
  }
}

// مساعدات بناء ملف DOCX حقيقي (ZIP Store + OOXML) يفتح على أي جوال
function xmlEscape(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function rgbToHex(color) {
  if (!color) return null;
  if (color.startsWith('#')) {
    let h = color.slice(1);
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return /^[0-9a-fA-F]{6}$/.test(h) ? h.toUpperCase() : null;
  }
  const m = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i);
  if (!m) return null;
  return [m[1], m[2], m[3]].map(n => Number(n).toString(16).padStart(2, '0')).join('').toUpperCase();
}

function buildZipStore(entries) {
  const enc = new TextEncoder();
  const crcTable = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[i] = c >>> 0;
  }
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  const localParts = [];
  const centralParts = [];
  let offset = 0;

  entries.forEach(entry => {
    const nameBytes = enc.encode(entry.name);
    const data = entry.data instanceof Uint8Array ? entry.data : enc.encode(entry.data);
    const crc = crc32(data);
    const size = data.length;

    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034B50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    localParts.push(lh, data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014B50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);

    centralParts.push(ch);
    offset += lh.length + size;
  });

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054B50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], {
    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
}

// 3. تصدير Word حقيقي (.docx) بمقاس A4 واتجاه عربي يفتح على أي جوال
function exportWord() {
  const clone = editor.cloneNode(true);
  clone.querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.outline = 'none';
  });

  const mediaFiles = [];
  const fontSizeMap = { '1': 20, '2': 24, '3': 28, '4': 36, '5': 48, '6': 64, '7': 96 };

  function buildRunProps(st) {
    let rPr = '<w:rtl/>';
    if (st.bold) rPr += '<w:b/><w:bCs/>';
    if (st.italic) rPr += '<w:i/><w:iCs/>';
    if (st.underline) rPr += '<w:u w:val="single"/>';
    if (st.strike) rPr += '<w:strike/>';
    if (st.color) rPr += `<w:color w:val="${st.color}"/>`;
    const sz = st.size || 28;
    rPr += `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`;
    const font = st.font || 'Cairo';
    rPr += `<w:rFonts w:ascii="${xmlEscape(font)}" w:hAnsi="${xmlEscape(font)}" w:cs="${xmlEscape(font)}"/>`;
    return `<w:rPr>${rPr}</w:rPr>`;
  }

  function extractRuns(node, st, runs) {
    if (node.nodeType === Node.TEXT_NODE) {
      const txt = node.nodeValue;
      if (txt) {
        runs.push(`<w:r>${buildRunProps(st)}<w:t xml:space="preserve">${xmlEscape(txt)}</w:t></w:r>`);
      }
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;

    const tag = node.tagName.toUpperCase();
    if (tag === 'BR') {
      runs.push('<w:r><w:br/></w:r>');
      return;
    }
    if (tag === 'IMG') {
      const src = node.getAttribute('src') || '';
      const m = src.match(/^data:image\/(png|jpeg|jpg|gif|webp);base64,(.+)$/i);
      if (m) {
        const ext = m[1].toLowerCase() === 'jpg' ? 'jpeg' : m[1].toLowerCase();
        const bin = atob(m[2]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const idx = mediaFiles.length + 1;
        const rId = 'rIdImg' + idx;
        mediaFiles.push({ name: `word/media/image${idx}.${ext}`, ext, rId, data: bytes });
        const maxCx = 5400000; // ~15cm in EMU for A4
        const w = node.naturalWidth || 400;
        const h = node.naturalHeight || 300;
        const cx = maxCx;
        const cy = Math.round(maxCx * (h / Math.max(1, w)));
        runs.push(`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${idx}" name="Picture ${idx}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${idx}" name="Picture ${idx}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`);
      }
      return;
    }

    const next = Object.assign({}, st);
    if (tag === 'B' || tag === 'STRONG') next.bold = true;
    if (tag === 'I' || tag === 'EM') next.italic = true;
    if (tag === 'U') next.underline = true;
    if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') next.strike = true;
    if (tag === 'FONT') {
      if (node.getAttribute('face')) next.font = node.getAttribute('face');
      if (node.getAttribute('color')) next.color = rgbToHex(node.getAttribute('color')) || next.color;
      if (node.getAttribute('size') && fontSizeMap[node.getAttribute('size')]) next.size = fontSizeMap[node.getAttribute('size')];
    }
    const cs = node.style;
    if (cs) {
      if (cs.fontWeight === 'bold' || Number(cs.fontWeight) >= 600) next.bold = true;
      if (cs.fontStyle === 'italic') next.italic = true;
      if (cs.textDecoration && cs.textDecoration.includes('underline')) next.underline = true;
      if (cs.textDecoration && cs.textDecoration.includes('line-through')) next.strike = true;
      if (cs.color) next.color = rgbToHex(cs.color) || next.color;
      if (cs.fontFamily) next.font = cs.fontFamily.replace(/['"]/g, '').split(',')[0].trim();
    }

    for (const child of node.childNodes) {
      extractRuns(child, next, runs);
    }
  }

  function getAlign(el) {
    const a = (el.style && el.style.textAlign) || el.getAttribute && el.getAttribute('align') || '';
    if (a === 'center') return 'center';
    if (a === 'left') return 'left';
    if (a === 'justify') return 'both';
    return 'right';
  }

  const paragraphs = [];
  function pushParagraph(runs, align) {
    const jc = align || 'right';
    paragraphs.push(`<w:p><w:pPr><w:bidi/><w:jc w:val="${jc}"/></w:pPr>${runs.join('')}</w:p>`);
  }

  let inlineBuffer = [];
  function flushInline() {
    if (inlineBuffer.length) {
      pushParagraph(inlineBuffer, 'right');
      inlineBuffer = [];
    }
  }

  function walkBlocks(container) {
    for (const node of container.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (node.nodeValue.trim() || node.nodeValue.includes(' ')) {
          extractRuns(node, {}, inlineBuffer);
        }
        continue;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) continue;
      const tag = node.tagName.toUpperCase();
      if (tag === 'UL' || tag === 'OL') {
        flushInline();
        let idx = 1;
        for (const li of node.children) {
          if (li.tagName && li.tagName.toUpperCase() === 'LI') {
            const prefix = tag === 'OL' ? `${idx++}. ` : '• ';
            const runs = [`<w:r><w:rPr><w:rtl/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr><w:t xml:space="preserve">${xmlEscape(prefix)}</w:t></w:r>`];
            extractRuns(li, {}, runs);
            pushParagraph(runs, getAlign(li));
          }
        }
      } else if (tag === 'P' || tag === 'DIV' || /^H[1-6]$/.test(tag)) {
        flushInline();
        const runs = [];
        extractRuns(node, /^H[1-3]$/.test(tag) ? { bold: true, size: 34 } : {}, runs);
        pushParagraph(runs, getAlign(node));
      } else {
        extractRuns(node, {}, inlineBuffer);
      }
    }
    flushInline();
  }

  walkBlocks(clone);
  if (!paragraphs.length) paragraphs.push('<w:p><w:pPr><w:bidi/><w:jc w:val="right"/></w:pPr></w:p>');

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
  <w:body>
    ${paragraphs.join('')}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="708" w:footer="708" w:gutter="0"/>
      <w:bidi/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${mediaFiles.map(m => `<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name.split('/').pop()}"/>`).join('')}
</Relationships>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Default Extension="jpeg" ContentType="image/jpeg"/>
  <Default Extension="gif" ContentType="image/gif"/>
  <Default Extension="webp" ContentType="image/webp"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;

  const entries = [
    { name: '[Content_Types].xml', data: contentTypesXml },
    { name: '_rels/.rels', data: rootRelsXml },
    { name: 'word/_rels/document.xml.rels', data: docRelsXml },
    { name: 'word/document.xml', data: documentXml },
    ...mediaFiles.map(m => ({ name: m.name, data: m.data }))
  ];

  const blob = buildZipStore(entries);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'مستند_Mini_Word.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  showToast('📥 تم تنزيل ملف Word (.docx)', 'success');
}

// 4. تصدير PDF بمقاس A4
function exportPDF() {
  const host = document.createElement('div');
  host.style.position = 'fixed';
  host.style.left = '-99999px';
  host.style.top = '0';
  host.style.width = '180mm';
  host.style.background = '#ffffff';
  host.style.zIndex = '-1';

  const pdfStyle = document.createElement('style');
  pdfStyle.textContent = `
    .pdf-export-root, .pdf-export-root * {
      font-family: Tahoma, Arial, sans-serif !important;
      letter-spacing: 0 !important;
      word-spacing: normal !important;
      font-variant-ligatures: normal !important;
    }
    .pdf-export-root img {
      max-width: 100% !important;
      height: auto !important;
      page-break-inside: avoid;
      break-inside: avoid;
    }
  `;
  host.appendChild(pdfStyle);

  const content = editor.cloneNode(true);
  content.removeAttribute('id');
  content.removeAttribute('contenteditable');
  content.className = 'pdf-export-root';
  content.querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.outline = 'none';
  });
  content.style.direction = 'rtl';
  content.style.textAlign = 'right';
  content.style.fontFamily = 'Tahoma, Arial, sans-serif';
  content.style.fontSize = '14px';
  content.style.lineHeight = '1.85';
  content.style.padding = '0';
  content.style.width = '180mm';
  content.style.minHeight = 'auto';
  content.style.boxShadow = 'none';

  host.appendChild(content);
  document.body.appendChild(host);

  const opt = {
    margin:       [15, 15, 15, 15],
    filename:     'مستند_Mini_Word.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true, letterRendering: false, scrollX: 0, scrollY: 0 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak:    { mode: ['css', 'legacy'], avoid: ['img'] }
  };

  if (typeof html2pdf !== 'undefined') {
    showToast('⏳ جاري تصدير ملف PDF...', '');
    const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontsReady.then(() => html2pdf().set(opt).from(content).save()).then(() => {
      showToast('📥 تم تصدير ملف PDF بنجاح', 'success');
    }).catch(() => {
      printAsPDF();
    }).finally(() => {
      if (host.parentNode) host.parentNode.removeChild(host);
    });
  } else {
    if (host.parentNode) host.parentNode.removeChild(host);
    printAsPDF();
  }
}

function printAsPDF() {
  const printWin = window.open('', '_blank');
  if (!printWin) {
    window.print();
    return;
  }
  printWin.document.write(`<!DOCTYPE html>
    <html dir="rtl" lang="ar">
    <head>
      <meta charset="UTF-8">
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
      <style>
        @page { size: A4 portrait; margin: 15mm; }
        body { direction: rtl; font-family: 'Cairo', sans-serif; font-size: 14pt; line-height: 1.85; text-align: right; margin: 0; padding: 20px; }
        img  { max-width: 100%; height: auto; }
      </style>
    </head>
    <body>${editor.innerHTML}</body>
    </html>`);
  printWin.document.close();
  setTimeout(() => { printWin.print(); }, 600);
  showToast('🖨️ جاري فتح الطباعة / PDF', 'success');
}

/* ═══════════════════════════════════════════
   معاينة المستند — A4
   ═══════════════════════════════════════════ */
function openPreview() {
  const previewContent = editor.innerHTML || '<p style="color:#94a3b8;">المستند فارغ</p>';
  document.getElementById('previewBody').innerHTML = previewContent;
  document.getElementById('previewBody').querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.cursor = 'default';
    img.style.outline = 'none';
  });
  document.getElementById('previewOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closePreview() {
  document.getElementById('previewOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('previewOverlay').addEventListener('click', function(e) {
  if (e.target === this) closePreview();
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closePreview();
    closeModal();
    hideImageToolbar();
  }
});

/* ═══════════════════════════════════════════
   أدوات التنسيق
   ═══════════════════════════════════════════ */
function fmt(command, value) {
  document.execCommand(command, false, value || null);
  editor.focus();
}

function applyFontFamily(font) {
  document.execCommand('fontName', false, font);
  editor.focus();
}

function applyFontSize(size) {
  document.execCommand('fontSize', false, size);
  editor.focus();
}

function changeFontSizeStep(step) {
  const sel = document.getElementById('fontSize');
  let idx = sel.selectedIndex + step;
  if (idx < 0) idx = 0;
  if (idx >= sel.options.length) idx = sel.options.length - 1;
  sel.selectedIndex = idx;
  applyFontSize(sel.value);
}

function applyColor(command, color) {
  document.execCommand(command === 'hiliteColor' ? 'hiliteColor' : 'foreColor', false, color);
  editor.focus();
}

/* ═══════════════════════════════════════════
   إدراج الصور والتحكم بها
   ═══════════════════════════════════════════ */
function triggerImageUpload() {
  saveSelectionState();
  document.getElementById('imageInput').value = '';
  document.getElementById('imageInput').click();
}

function handleImageUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  if (!file.type.startsWith('image/')) {
    showToast('❌ يرجى اختيار ملف صورة صالح', 'error');
    return;
  }

  if (file.size > 10 * 1024 * 1024) {
    showToast('❌ حجم الصورة كبير جداً (الحد الأقصى 10 ميغابايت)', 'error');
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    restoreSelectionState();
    editor.focus();

    const img = document.createElement('img');
    img.src = e.target.result;
    img.style.maxWidth = '100%';
    img.style.height = 'auto';
    img.style.borderRadius = '4px';
    img.style.display = 'block';
    img.style.margin = '10px auto';

    const sel = window.getSelection();
    if (sel && sel.rangeCount > 0) {
      let node = sel.anchorNode, inside = false;
      let curr = node;
      while (curr) {
        if (curr === editor) { inside = true; break; }
        curr = curr.parentNode;
      }
      if (inside) {
        const range = sel.getRangeAt(0);
        range.deleteContents();
        const br = document.createElement('br');
        range.insertNode(br);
        range.insertNode(img);
        range.setStartAfter(br);
        range.setEndAfter(br);
        sel.removeAllRanges();
        sel.addRange(range);
        savedSelection = range.cloneRange();
        showToast('🖼️ تم إدراج الصورة بنجاح', 'success');
        return;
      }
    }

    editor.appendChild(img);
    editor.appendChild(document.createElement('br'));
    placeCaretAtEnd();
    showToast('🖼️ تم إدراج الصورة بنجاح', 'success');
  };

  reader.onerror = function() {
    showToast('❌ فشلت قراءة الصورة', 'error');
  };

  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة العائم
   ═══════════════════════════════════════════ */
function showImageToolbar(img) {
  selectedImage = img;
  editor.querySelectorAll('img.img-selected').forEach(i => i.classList.remove('img-selected'));
  img.classList.add('img-selected');

  const toolbar = document.getElementById('imgToolbar');
  const rect = img.getBoundingClientRect();
  let top = rect.top - 46;
  let left = rect.left + (rect.width / 2) - 165;

  if (top < 10) top = rect.bottom + 8;
  if (left < 6) left = 6;
  if (left + 330 > window.innerWidth) left = window.innerWidth - 336;

  toolbar.style.top = top + 'px';
  toolbar.style.left = left + 'px';
  toolbar.classList.add('show');
}

function hideImageToolbar() {
  document.getElementById('imgToolbar').classList.remove('show');
  if (selectedImage) {
    selectedImage.classList.remove('img-selected');
    selectedImage = null;
  }
}

function resizeSelectedImage(size) {
  if (!selectedImage) return;
  selectedImage.style.maxWidth = size;
  selectedImage.style.width = size;
  setTimeout(() => { if (selectedImage) showImageToolbar(selectedImage); }, 50);
}

function alignSelectedImage(align) {
  if (!selectedImage) return;
  if (align === 'center') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  } else if (align === 'right') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = 'auto';
    selectedImage.style.marginRight = '0';
    selectedImage.style.float = 'none';
  } else if (align === 'left') {
    selectedImage.style.display = 'block';
    selectedImage.style.marginLeft = '0';
    selectedImage.style.marginRight = 'auto';
    selectedImage.style.float = 'none';
  }
  setTimeout(() => { if (selectedImage) showImageToolbar(selectedImage); }, 50);
}

function deleteSelectedImage() {
  if (!selectedImage) return;
  selectedImage.remove();
  hideImageToolbar();
  showToast('🗑️ تم حذف الصورة', '');
}

editor.addEventListener('click', function(e) {
  if (e.target.tagName === 'IMG') {
    e.preventDefault();
    e.stopPropagation();
    showImageToolbar(e.target);
  } else {
    hideImageToolbar();
  }
});

document.addEventListener('click', function(e) {
  if (selectedImage && !e.target.closest('#imgToolbar') && !e.target.closest('#editor')) {
    hideImageToolbar();
  }
});

window.addEventListener('scroll', function() {
  if (selectedImage) showImageToolbar(selectedImage);
}, { passive: true });

window.addEventListener('resize', function() {
  if (selectedImage) showImageToolbar(selectedImage);
});

/* ═══════════════════════════════════════════
   الإملاء الصوتي (متوافق مع Chrome وسامسونج بدون getUserMedia)
   ═══════════════════════════════════════════ */
function toggleSpeech() {
  if (isRecording) {
    stopSpeech();
    return;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    confirmAction(
      'متصفحك لا يدعم ميزة الإملاء الصوتي.\n\nيرجى استخدام متصفح Google Chrome أو متصفح سامسونج.',
      function(){},
      'danger'
    );
    return;
  }

  saveSelectionState();

  try {
    recognition = new SpeechRecognition();
  } catch(e) {
    confirmAction('تعذر تهيئة التعرف على الصوت: ' + e.message, function(){}, 'danger');
    return;
  }

  recognition.lang = 'ar-SA';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    isRecording = true;
    const micBtn = document.getElementById('micBtn');
    if (micBtn) micBtn.classList.add('recording');
    const micLabel = document.getElementById('micLabel');
    if (micLabel) micLabel.textContent = 'استماع..';
    showToast('🎙️ بدأ الاستماع.. تحدّث الآن', 'success');
  };

  recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i] && event.results[i][0]) {
        transcript += event.results[i][0].transcript;
      }
    }
    if (transcript.trim()) {
      insertTextAtCursor(transcript.trim() + ' ');
    }
  };

  recognition.onerror = function(event) {
    console.warn('Speech Recognition error:', event.error);
    if (event.error === 'no-speech' || event.error === 'aborted') {
      return; // عدم مقاطعة المستخدم عند التوقف المؤقت
    }

    let reason = '';
    switch (event.error) {
      case 'not-allowed':
        reason = 'لم يتم منح إذن المايكروفون.\n\nيرجى الضغط على علامة القفل أو الإعدادات في شريط عنوان المتصفح والسماح بالمايكروفون.';
        break;
      case 'network':
        reason = 'خطأ في الاتصال بالإنترنت.\nالتعرف الصوتي يحتاج اتصالاً نشطاً بالشبكة.';
        break;
      case 'audio-capture':
        reason = 'تعذر التقاط الصوت من المايكروفون.\nتأكد من عدم استخدام المايكروفون بواسطة تطبيق آخر.';
        break;
      case 'service-not-allowed':
        reason = 'خدمة التعرف الصوتي غير مسموح بها في المتصفح حالياً.';
        break;
      case 'language-not-supported':
        reason = 'اللغة العربية غير مدعومة للتعرف الصوتي في هذا الجهاز.';
        break;
      default:
        reason = 'خطأ في التعرف على الصوت: ' + event.error;
    }

    stopSpeech();
    confirmAction(reason, function(){}, 'danger');
  };

  recognition.onend = function() {
    // إعادة التشغيل تلقائياً طالما أن المستخدم لم يضغط إيقاف
    if (isRecording) {
      setTimeout(function() {
        if (isRecording && recognition) {
          try {
            recognition.start();
          } catch(e) {
            console.warn('Restart speech error:', e);
          }
        }
      }, 200);
    }
  };

  try {
    recognition.start();
  } catch(err) {
    console.error('Recognition start error:', err);
    isRecording = false;
    confirmAction('تعذر بدء تشغيل المايكروفون:\n' + (err.message || err), function(){}, 'danger');
  }
}

function stopSpeech() {
  isRecording = false;
  if (recognition) {
    try {
      recognition.onend = null;
      recognition.onerror = null;
      recognition.stop();
    } catch(e) {}
    recognition = null;
  }
  const micBtn = document.getElementById('micBtn');
  if (micBtn) micBtn.classList.remove('recording');
  const micLabel = document.getElementById('micLabel');
  if (micLabel) micLabel.textContent = 'مايك';
  showToast('🔇 تم إيقاف المايكروفون', '');
}

function insertTextAtCursor(text) {
  editor.focus();
  if (savedSelection) restoreSelectionState();

  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    let node = sel.anchorNode, inside = false;
    let curr = node;
    while (curr) {
      if (curr === editor) { inside = true; break; }
      curr = curr.parentNode;
    }
    if (inside) {
      const range = sel.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.setEndAfter(textNode);
      sel.removeAllRanges();
      sel.addRange(range);
      savedSelection = range.cloneRange();
      return;
    }
  }

  const textNode = document.createTextNode(text);
  editor.appendChild(textNode);
  placeCaretAtEnd();
}

function placeCaretAtEnd() {
  editor.focus();
  const sel = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(editor);
  range.collapse(false);
  sel.removeAllRanges();
  sel.addRange(range);
  savedSelection = range.cloneRange();
}

/* ═══════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
    switch(e.key.toLowerCase()) {
      case 's':
        e.preventDefault();
        confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm');
        break;
      case 'b':
        e.preventDefault();
        fmt('bold');
        break;
      case 'i':
        e.preventDefault();
        fmt('italic');
        break;
      case 'u':
        e.preventDefault();
        fmt('underline');
        break;
    }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selectedImage) {
    e.preventDefault();
    deleteSelectedImage();
  }
});
