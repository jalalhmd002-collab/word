<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Word — محرر نصوص عربي</title>

<!-- خطوط جوجل العربية -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&amp;family=Cairo:wght@300;400;600;700&amp;family=Tajawal:wght@300;400;500;700&amp;display=swap" rel="stylesheet">

<!-- مكتبة html2pdf.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

<!-- مكتبة PDF.js لقراءة واستيراد ملفات PDF -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous"></script>

<style>
/* ═══════════════════════════════════════════
   المتغيرات وإعادة الضبط العامة
   ═══════════════════════════════════════════ */
:root {
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --danger: #ef4444;
  --success: #22c55e;
  --bg: #e2e8f0;
  --toolbar-bg: #ffffff;
  --paper-bg: #ffffff;
  --border: #cbd5e1;
  --text: #1e293b;
  --text-light: #64748b;
  --shadow: 0 1px 3px rgba(0,0,0,.08);
  --shadow-lg: 0 6px 24px rgba(0,0,0,.12);
  --radius: 6px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Cairo', 'Tajawal', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ═══════════════════════════════════════════
   1. الشريط العلوي — سطر واحد مضغوط تماماً
   ═══════════════════════════════════════════ */
.file-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  padding: 4px 8px;
  height: 40px;
  box-shadow: 0 2px 5px rgba(0,0,0,.15);
  overflow: hidden;
  white-space: nowrap;
}

.file-bar .app-title {
  font-weight: 700;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.file-bar .app-title svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.file-actions {
  display: flex;
  align-items: center;
  gap: 3px;
  flex-shrink: 0;
}

.file-actions button {
  background: rgba(255,255,255,.16);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 4px 7px;
  font-size: 11px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  height: 28px;
  transition: background .15s;
  flex-shrink: 0;
}

.file-actions button svg {
  width: 13px;
  height: 13px;
  flex-shrink: 0;
}

.file-actions button:hover,
.file-actions button:active {
  background: rgba(255,255,255,.28);
}

/* ═══════════════════════════════════════════
   2. شريط أدوات التنسيق — سطران ثابتان (بدون تمرير)
   ═══════════════════════════════════════════ */
.toolbar-wrap {
  position: sticky;
  top: 40px;
  z-index: 99;
  background: var(--toolbar-bg);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.toolbar-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2px;
  padding: 3px 5px;
  overflow: hidden;
}

.toolbar-row + .toolbar-row {
  border-top: 1px solid #f1f5f9;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

.toolbar-row .sep {
  width: 1px;
  height: 22px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 1px;
}

.toolbar-row button,
.toolbar-row select {
  background: #f1f5f9;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 3px 4px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .12s;
}

.toolbar-row button {
  min-width: 27px;
  flex-shrink: 0;
}

.toolbar-row button:hover,
.toolbar-row button:active {
  background: #e2e8f0;
}

.toolbar-row button.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}

.toolbar-row select {
  appearance: auto;
  -webkit-appearance: auto;
  font-size: 11px;
  padding: 2px 2px 2px 14px;
}

#fontFamily {
  max-width: 82px;
  min-width: 62px;
  flex: 1 1 auto;
}

#fontSize {
  max-width: 44px;
  min-width: 36px;
  flex: 0 1 auto;
}

.color-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
  background: #f1f5f9;
  border-radius: var(--radius);
  width: 27px;
  height: 28px;
  flex-shrink: 0;
}

.color-btn:hover {
  background: #e2e8f0;
}

.color-btn input[type="color"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.mic-btn.recording {
  background: var(--danger) !important;
  color: #fff !important;
  animation: pulse-mic 1s infinite;
}

@keyframes pulse-mic {
  0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); }
  50%      { box-shadow: 0 0 0 5px rgba(239,68,68,0); }
}

/* ═══════════════════════════════════════════
   3. ورقة الكتابة — مقاس A4 القياسي
   ═══════════════════════════════════════════ */
.editor-wrapper {
  display: flex;
  justify-content: center;
  padding: 18px 8px 50px;
}

.paper-stage {
  position: relative;
  width: 210mm;
  max-width: 100%;
}

.page-guides {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 2;
  overflow: hidden;
}

.page-badge {
  position: absolute;
  font-size: 10px;
  font-weight: 700;
  color: #475569;
  background: #f1f5f9;
  border: 1px solid #cbd5e1;
  padding: 1px 8px;
  border-radius: 999px;
  opacity: 0.9;
}

.page-break-marker {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 2px dashed #64748b;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page-break-pill {
  background: #e2e8f0;
  color: #1e293b;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  border: 1px solid #94a3b8;
  box-shadow: 0 1px 4px rgba(0,0,0,.12);
  transform: translateY(-50%);
}

.paper {
  position: relative;
  z-index: 1;
  background: var(--paper-bg);
  width: 100%;
  min-height: 297mm;
  max-width: 100%;
  box-sizing: border-box;
  padding: 20mm;
  border-radius: 2px;
  box-shadow: var(--shadow-lg);
  outline: none;
  font-size: 15px;
  line-height: 1.85;
  direction: rtl;
  text-align: justify;
  font-family: 'Cairo', sans-serif;
  caret-color: var(--primary);
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.paper:empty::before {
  content: "ابدأ الكتابة هنا...";
  color: #94a3b8;
  pointer-events: none;
}

.paper:focus {
  box-shadow: 0 0 0 3px rgba(37,99,235,.15), var(--shadow-lg);
}

.paper img {
  max-width: 100%;
  height: auto;
  border-radius: 4px;
  cursor: pointer;
  transition: outline .15s;
}

.paper img:hover {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

.paper img.img-selected {
  outline: 3px solid var(--primary);
  outline-offset: 3px;
}

.paper table {
  width: 100%;
  border-collapse: collapse;
  margin: 10px 0;
  font-size: 13px;
  direction: rtl;
}

.paper th, .paper td {
  border: 1px solid #cbd5e1;
  padding: 6px 8px;
  text-align: right;
  vertical-align: top;
}

.paper th {
  background: #f1f5f9;
  font-weight: 700;
}

.paper pre {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-word;
  direction: ltr;
  text-align: left;
  margin: 8px 0;
}

.paper blockquote {
  border-right: 3px solid var(--primary);
  padding: 4px 12px;
  margin: 8px 0;
  color: #475569;
  background: #f8fafc;
}

.pdf-page-sep {
  border: none;
  border-top: 1px dashed #cbd5e1;
  margin: 14px 0;
}

/* ═══════════════════════════════════════════
   شريط أدوات الصورة العائم
   ═══════════════════════════════════════════ */
.img-toolbar {
  position: fixed;
  z-index: 9000;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  display: none;
  gap: 3px;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  max-width: 330px;
}

.img-toolbar.show {
  display: flex;
}

.img-toolbar button {
  background: #f1f5f9;
  color: var(--text);
  border: none;
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 11px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: all .12s;
}

.img-toolbar button:hover {
  background: #e2e8f0;
}

.img-toolbar button.danger {
  color: var(--danger);
}

.img-toolbar button.danger:hover {
  background: #fef2f2;
}

.img-toolbar .sep {
  width: 1px;
  height: 20px;
  background: var(--border);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════════
   نافذة التأكيد المخصصة (Modal)
   ═══════════════════════════════════════════ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.5);
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
  backdrop-filter: blur(2px);
}

.modal-overlay.show {
  opacity: 1;
  visibility: visible;
}

.modal-box {
  background: #fff;
  border-radius: 14px;
  padding: 24px 20px 18px;
  max-width: 380px;
  width: 100%;
  text-align: center;
  box-shadow: 0 16px 40px rgba(0,0,0,.22);
  transform: scale(.92);
  transition: transform .2s;
}

.modal-overlay.show .modal-box {
  transform: scale(1);
}

.modal-box .modal-icon {
  font-size: 36px;
  margin-bottom: 8px;
}

.modal-box h3 {
  font-size: 17px;
  margin-bottom: 8px;
  font-weight: 700;
}

.modal-box p {
  font-size: 13px;
  color: var(--text-light);
  margin-bottom: 18px;
  line-height: 1.6;
  white-space: pre-line;
}

.modal-box .modal-actions {
  display: flex;
  gap: 8px;
  justify-content: center;
}

.modal-box .btn {
  padding: 9px 20px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.modal-box .btn-confirm {
  background: var(--primary);
  color: #fff;
}

.modal-box .btn-confirm:hover {
  background: var(--primary-hover);
}

.modal-box .btn-danger {
  background: var(--danger);
  color: #fff;
}

.modal-box .btn-danger:hover {
  background: #dc2626;
}

.modal-box .btn-cancel {
  background: #f1f5f9;
  color: var(--text);
}

.modal-box .btn-cancel:hover {
  background: #e2e8f0;
}

/* ═══════════════════════════════════════════
   نافذة المعاينة — A4
   ═══════════════════════════════════════════ */
.preview-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.65);
  z-index: 10000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 12px;
  overflow-y: auto;
  opacity: 0;
  visibility: hidden;
  transition: opacity .2s, visibility .2s;
}

.preview-overlay.show {
  opacity: 1;
  visibility: visible;
}

.preview-container {
  background: #fff;
  width: 210mm;
  max-width: 100%;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 16px 45px rgba(0,0,0,.3);
  margin: 10px auto 30px;
}

.preview-header {
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
}

.preview-header h3 {
  font-size: 14px;
}

.preview-header button {
  background: rgba(255,255,255,.2);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
}

.preview-header button:hover {
  background: rgba(255,255,255,.32);
}

.preview-body {
  padding: 20mm;
  direction: rtl;
  text-align: justify;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  line-height: 1.85;
  min-height: 297mm;
  box-sizing: border-box;
}

.preview-body img {
  max-width: 100%;
  height: auto;
}

/* ═══════════════════════════════════════════
   رسالة التنبيه العائمة (Toast)
   ═══════════════════════════════════════════ */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1e293b;
  color: #fff;
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 12px;
  font-family: inherit;
  z-index: 99999;
  opacity: 0;
  transition: all .3s cubic-bezier(0.16, 1, 0.3, 1);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.success { background: #16a34a; }
.toast.error   { background: #dc2626; }

/* ═══════════════════════════════════════════
   التجاوب مع الهواتف الذكية (Mobile Responsive)
   ═══════════════════════════════════════════ */
@media (max-width: 520px) {
  .file-bar {
    padding: 3px 5px;
    height: 36px;
  }
  .file-bar .app-title {
    font-size: 11px;
    gap: 3px;
  }
  .file-bar .app-title svg {
    width: 14px;
    height: 14px;
  }
  .file-actions {
    gap: 2px;
  }
  .file-actions button {
    padding: 3px 5px;
    font-size: 10px;
    height: 25px;
    gap: 2px;
  }
  .file-actions button svg {
    width: 11px;
    height: 11px;
  }

  .toolbar-wrap {
    top: 36px;
  }
  .toolbar-row {
    padding: 2px 3px;
    gap: 1px;
  }
  .toolbar-row button {
    min-width: 25px;
    height: 26px;
    padding: 2px 2px;
    font-size: 11px;
  }
  .toolbar-row select {
    height: 26px;
    font-size: 10px;
  }
  #fontFamily {
    max-width: 68px;
    min-width: 54px;
  }
  #fontSize {
    max-width: 36px;
    min-width: 32px;
  }
  .color-btn {
    width: 25px;
    height: 26px;
  }
  .toolbar-row .sep {
    height: 18px;
  }

  .editor-wrapper {
    padding: 8px 3px 30px;
  }
  .paper {
    padding: 16mm 10mm;
    min-height: calc(100vw * 1.4142);
    border-radius: 0;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    font-size: 14px;
  }

  .preview-body {
    padding: 14mm 8mm;
    min-height: auto;
  }
  .img-toolbar {
    max-width: 94vw;
  }
}

/* ═══════════════════════════════════════════
   إعدادات الطباعة والتصدير — A4 القياسي
   ═══════════════════════════════════════════ */
@media print {
  @page {
    size: A4 portrait;
    margin: 15mm;
  }

  html, body {
    background: #fff !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .file-bar, .toolbar-wrap, .toast, .modal-overlay, .preview-overlay, .img-toolbar, .page-guides {
    display: none !important;
  }

  .editor-wrapper {
    padding: 0 !important;
    margin: 0 !important;
    display: block !important;
  }

  .paper {
    box-shadow: none !important;
    width: 100% !important;
    max-width: 100% !important;
    min-height: auto !important;
    border-radius: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }

  .paper img {
    outline: none !important;
  }
}

/* تلميحات الأدوات للكمبيوتر */
[data-tooltip] { position: relative; }
[data-tooltip]::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: calc(100% + 5px);
  right: 50%;
  transform: translateX(50%);
  background: #1e293b;
  color: #fff;
  padding: 3px 8px;
  border-radius: 5px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity .15s;
  z-index: 200;
}
[data-tooltip]:hover::after { opacity: 1; }
@media (max-width: 640px) { [data-tooltip]::after { display: none; } }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     1. الشريط العلوي — سطر واحد مضغوط
     ═══════════════════════════════════════ -->
<div class="file-bar">
  <span class="app-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
    Mini Word
  </span>

  <div class="file-actions">
    <button onclick="confirmAction('هل تريد إنشاء مستند جديد؟\nسيتم مسح المحتوى الحالي.', newDocument, 'danger')" data-tooltip="مستند جديد">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
      <span>جديد</span>
    </button>

    <button onclick="triggerOpenFile()" data-tooltip="فتح ملف (PDF, Word, ODT, MD, TXT, صور...)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
      <span>فتح</span>
    </button>

    <button onclick="confirmAction('هل تريد حفظ المستند في ذاكرة المتصفح؟', saveDocument, 'confirm')" data-tooltip="حفظ محلي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
      <span>حفظ</span>
    </button>

    <button onclick="confirmAction('هل تريد تنزيل المستند بصيغة Word؟', exportWord, 'confirm')" data-tooltip="تصدير Word">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      <span>Word</span>

<script>
/* ═══════════════════════════════════════════
   المتغيرات العامة
   ═══════════════════════════════════════════ */
const editor = document.getElementById('editor');
let pendingAction = null;
let recognition = null;
let isRecording = false;
let selectedImage = null;
let savedSelection = null;

/* ═══════════════════════════════════════════
   تحميل المستند المحفوظ عند فتح الصفحة
   ═══════════════════════════════════════════ */
(function init() {
  try {
    const saved = localStorage.getItem('miniword_content');
    if (saved) {
      editor.innerHTML = saved;
    }
  } catch (e) {
    console.warn('localStorage unavailable:', e);
  }
  updatePageGuides();
})();

function getA4PageHeight() {
  const w = editor.clientWidth || 794;
  return Math.max(360, Math.round(w * (297 / 210)));
}

function updatePageGuides() {
  const pageHeight = getA4PageHeight();
  editor.style.minHeight = '0px';
  const contentHeight = editor.scrollHeight;
  const totalPages = Math.max(1, Math.ceil(contentHeight / pageHeight));
  editor.style.minHeight = (totalPages * pageHeight) + 'px';

  const guides = document.getElementById('pageGuides');
  if (!guides) return;
  let html = `<div class="page-badge" style="top:6px;left:10px;">صفحة 1 / ${totalPages} (A4)</div>`;
  for (let i = 1; i < totalPages; i++) {
    const y = i * pageHeight;
    html += `<div class="page-break-marker" style="top:${y}px;">
      <span class="page-break-pill">بداية صفحة ${i + 1} (A4)</span>
    </div>`;
  }
  guides.innerHTML = html;
}

editor.addEventListener('input', updatePageGuides);
window.addEventListener('resize', updatePageGuides);

/* ═══════════════════════════════════════════
   حماية منع إغلاق الصفحة بالخطأ
   ═══════════════════════════════════════════ */
window.addEventListener('beforeunload', function(e) {
  if (editor.innerHTML.trim() !== '') {
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ═══════════════════════════════════════════
   نظام نوافذ التأكيد الصارم (Modal)
   ═══════════════════════════════════════════ */
function confirmAction(message, action, type) {
  const modal = document.getElementById('confirmModal');
  const icon = document.getElementById('modalIcon');
  const title = document.getElementById('modalTitle');
  const msg = document.getElementById('modalMessage');
  const btn = document.getElementById('modalConfirmBtn');

  if (type === 'danger') {
    icon.textContent = '⚠️';
    title.textContent = 'تأكيد الإجراء';
    btn.className = 'btn btn-danger';
  } else {
    icon.textContent = '✅';
    title.textContent = 'تأكيد';
    btn.className = 'btn btn-confirm';
  }

  msg.textContent = message;
  pendingAction = action;
  modal.classList.add('show');
}

function modalConfirm() {
  const action = pendingAction;
  closeModal();
  if (typeof action === 'function') {
    action();
  }
}

function closeModal() {
  document.getElementById('confirmModal').classList.remove('show');
  pendingAction = null;
}

document.getElementById('confirmModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

/* ═══════════════════════════════════════════
   رسائل Toast
   ═══════════════════════════════════════════ */
function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = 'toast ' + type;
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => toast.classList.remove('show'), 2800);
}

/* ═══════════════════════════════════════════
   حفظ واسترجاع موضع المؤشر
   ═══════════════════════════════════════════ */
function saveSelectionState() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const range = sel.getRangeAt(0);
    let node = range.startContainer;
    while (node) {
      if (node === editor) {
        savedSelection = range.cloneRange();
        return;
      }
      node = node.parentNode;
    }
  }
  savedSelection = null;
}

function restoreSelectionState() {
  if (savedSelection) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
  }
}

/* ═══════════════════════════════════════════
   عمليات الملفات والتصدير
   ═══════════════════════════════════════════ */

// 0. فتح ملف بجميع الصيغ (الحديثة والتقليدية و PDF)
let pendingPdfFile = null;

function triggerOpenFile() {
  const input = document.getElementById('openFileInput');
  input.value = '';
  input.click();
}

function handleOpenFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const hasContent = editor.innerText.trim() !== '' || editor.querySelector('img, table');
  if (hasContent) {
    confirmAction(
      'هل تريد فتح الملف "' + file.name + '"؟\nسيتم استبدال المحتوى الحالي.',
      function() { processOpenFile(file); },
      'confirm'
    );
  } else {
    processOpenFile(file);
  }
}

function escapeHtmlStr(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function decodeTextBuffer(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
    return new TextDecoder('utf-16le').decode(bytes.subarray(2));
  }
  if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
    return new TextDecoder('utf-16be').decode(bytes.subarray(2));
  }
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return new TextDecoder('utf-8').decode(bytes.subarray(3));
  }
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) {
    try {
      return new TextDecoder('windows-1256').decode(bytes);
    } catch (e2) {
      return new TextDecoder('utf-8').decode(bytes);
    }
  }
}

function applyOpenedHtml(htmlContent, fileName) {
  editor.innerHTML = htmlContent || '<p><br></p>';
  hideImageToolbar();
  updatePageGuides();
  try {
    localStorage.setItem('miniword_content', editor.innerHTML);
  } catch (e) {}
  showToast('📂 تم فتح الملف: ' + fileName, 'success');
}

async function inflateRawBytes(compressed) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('المتصفح لا يدعم فك ضغط الملفات الحديثة (DecompressionStream)');
  }
  const ds = new DecompressionStream('deflate-raw');
  const writer = ds.writable.getWriter();
  writer.write(compressed);
  writer.close();
  const ab = await new Response(ds.readable).arrayBuffer();
  return new Uint8Array(ab);
}

async function readZipEntries(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  const dec = new TextDecoder('utf-8');

  let eocdOffset = -1;
  const minOff = Math.max(0, bytes.length - 65557);
  for (let i = bytes.length - 22; i >= minOff; i--) {
    if (view.getUint32(i, true) === 0x06054B50) {
      eocdOffset = i;
      break;
    }
  }
  if (eocdOffset === -1) throw new Error('ملف ZIP غير صالح');

  const cdCount = view.getUint16(eocdOffset + 10, true);
  const cdOffset = view.getUint32(eocdOffset + 16, true);

  const entries = {};
  let ptr = cdOffset;
  for (let i = 0; i < cdCount && ptr + 46 <= bytes.length; i++) {
    if (view.getUint32(ptr, true) !== 0x02014B50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;

    if (name.endsWith('/') || localOffset + 30 > bytes.length) continue;
    if (view.getUint32(localOffset, true) !== 0x04034B50) continue;
    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const rawSlice = bytes.subarray(dataStart, dataStart + compSize);

    let outBytes;
    if (method === 0) {
      outBytes = rawSlice;
    } else if (method === 8) {
      outBytes = await inflateRawBytes(rawSlice);
    } else {
      continue;
    }
    entries[name] = outBytes;
  }
  return entries;
}

function uint8ToBase64(bytes) {
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

function guessImageMime(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (ext === 'png') return 'image/png';
  if (ext === 'gif') return 'image/gif';
  if (ext === 'webp') return 'image/webp';
  if (ext === 'svg') return 'image/svg+xml';
  if (ext === 'bmp') return 'image/bmp';
  return 'image/jpeg';
}

async function parseDocxToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const docBytes = entries['word/document.xml'];
  if (!docBytes) throw new Error('لم يتم العثور على word/document.xml');

  const dec = new TextDecoder('utf-8');
  const parser = new DOMParser();

  const relMap = {};
  if (entries['word/_rels/document.xml.rels']) {
    const relDoc = parser.parseFromString(dec.decode(entries['word/_rels/document.xml.rels']), 'application/xml');
    const rels = relDoc.getElementsByTagName('Relationship');
    for (const r of rels) {
      const id = r.getAttribute('Id');
      const target = r.getAttribute('Target') || '';
      if (id && target) {
        const cleanTarget = target.startsWith('/') ? target.slice(1) : 'word/' + target.replace(/^\.\//, '');
        relMap[id] = cleanTarget;
      }
    }
  }

  const xmlDoc = parser.parseFromString(dec.decode(docBytes), 'application/xml');
  const body = xmlDoc.getElementsByTagNameNS('*', 'body')[0] || xmlDoc.documentElement;

  function firstChildByLocal(parent, localName) {
    for (const ch of parent.childNodes) {
      if (ch.nodeType === 1 && ch.localName === localName) return ch;
    }
    return null;
  }

  function getAttrVal(el, attrName) {
    if (!el) return '';
    return el.getAttribute('w:' + attrName) || el.getAttribute(attrName) || '';
  }

  function renderRun(rEl) {
    const rPr = firstChildByLocal(rEl, 'rPr');
    let styles = [];
    let bold = false, italic = false, underline = false, strike = false;

    if (rPr) {
      for (const prop of rPr.childNodes) {
        if (prop.nodeType !== 1) continue;
        const ln = prop.localName;
        if (ln === 'b' || ln === 'bCs') {
          const v = getAttrVal(prop, 'val');
          if (v !== '0' && v !== 'false') bold = true;
        } else if (ln === 'i' || ln === 'iCs') {
          const v = getAttrVal(prop, 'val');
          if (v !== '0' && v !== 'false') italic = true;
        } else if (ln === 'u') {
          const v = getAttrVal(prop, 'val');
          if (v && v !== 'none') underline = true;
        } else if (ln === 'strike' || ln === 'dstrike') {
          const v = getAttrVal(prop, 'val');
          if (v !== '0' && v !== 'false') strike = true;
        } else if (ln === 'color') {
          const v = getAttrVal(prop, 'val');
          if (v && v !== 'auto' && /^[0-9a-fA-F]{6}$/.test(v)) styles.push('color:#' + v);
        } else if (ln === 'highlight') {
          const v = getAttrVal(prop, 'val');
          if (v && v !== 'none') styles.push('background-color:' + escapeHtmlStr(v));
        } else if (ln === 'sz' || ln === 'szCs') {
          const v = parseInt(getAttrVal(prop, 'val'), 10);
          if (v > 0) styles.push('font-size:' + Math.round(v / 2) + 'pt');
        } else if (ln === 'rFonts') {
          const f = prop.getAttribute('w:cs') || prop.getAttribute('w:ascii') || prop.getAttribute('w:hAnsi');
          if (f) styles.push("font-family:'" + escapeHtmlStr(f) + "',Cairo,sans-serif");
        }
      }
    }

    let inner = '';
    for (const ch of rEl.childNodes) {
      if (ch.nodeType !== 1) continue;
      if (ch.localName === 't') {
        inner += escapeHtmlStr(ch.textContent || '');
      } else if (ch.localName === 'tab') {
        inner += '&emsp;';
      } else if (ch.localName === 'br') {
        inner += '<br>';
      } else if (ch.localName === 'drawing' || ch.localName === 'pict') {
        const blips = ch.getElementsByTagNameNS('*', 'blip');
        for (const blip of blips) {
          const rId = blip.getAttribute('r:embed') || blip.getAttribute('embed') || '';
          const mediaPath = relMap[rId];
          if (mediaPath && entries[mediaPath]) {
            const mime = guessImageMime(mediaPath);
            const b64 = uint8ToBase64(entries[mediaPath]);
            inner += `<img src="data:${mime};base64,${b64}" style="max-width:100%;height:auto;border-radius:4px;display:block;margin:8px auto;">`;
          }
        }
      }
    }

    if (!inner) return '';
    if (bold) inner = '<strong>' + inner + '</strong>';
    if (italic) inner = '<em>' + inner + '</em>';
    if (underline) inner = '<u>' + inner + '</u>';
    if (strike) inner = '<s>' + inner + '</s>';
    if (styles.length) inner = `<span style="${styles.join(';')}">${inner}</span>`;
    return inner;
  }

  function renderParagraph(pEl) {
    const pPr = firstChildByLocal(pEl, 'pPr');
    let align = 'right';
    let isList = false;
    let tag = 'p';

    if (pPr) {
      const jc = firstChildByLocal(pPr, 'jc');
      if (jc) {
        const v = getAttrVal(jc, 'val');
        if (v === 'center') align = 'center';
        else if (v === 'left') align = 'left';
        else if (v === 'both' || v === 'distribute') align = 'justify';
      }
      if (firstChildByLocal(pPr, 'numPr')) isList = true;
      const pStyle = firstChildByLocal(pPr, 'pStyle');
      if (pStyle) {
        const sv = getAttrVal(pStyle, 'val');
        const hm = sv.match(/^Heading([1-6])$/i);
        if (hm) tag = 'h' + hm[1];
      }
    }

    let content = '';
    for (const ch of pEl.childNodes) {
      if (ch.nodeType !== 1) continue;
      if (ch.localName === 'r') {
        content += renderRun(ch);
      } else if (ch.localName === 'hyperlink') {
        for (const hr of ch.childNodes) {
          if (hr.nodeType === 1 && hr.localName === 'r') content += renderRun(hr);
        }
      }
    }

    if (!content.trim()) return '<p><br></p>';
    if (isList) content = '• ' + content;
    return `<${tag} style="text-align:${align};">${content}</${tag}>`;
  }

  function renderTable(tblEl) {
    const tblPr = firstChildByLocal(tblEl, 'tblPr');
    const tblGrid = firstChildByLocal(tblEl, 'tblGrid');
    const gridCols = [];
    let totalGridW = 0;
    if (tblGrid) {
      for (const gc of tblGrid.childNodes) {
        if (gc.nodeType === 1 && gc.localName === 'gridCol') {
          const w = parseInt(getAttrVal(gc, 'w'), 10) || 0;
          gridCols.push(w);
          totalGridW += w;
        }
      }
    }

    const tblStyles = ['border-collapse:collapse', 'max-width:100%'];
    let tblWidthPct = '100%';
    if (tblPr) {
      const tblW = firstChildByLocal(tblPr, 'tblW');
      if (tblW) {
        const wVal = parseInt(getAttrVal(tblW, 'w'), 10) || 0;
        const wType = getAttrVal(tblW, 'type');
        if (wType === 'pct' && wVal > 0) tblWidthPct = Math.min(100, Math.round(wVal / 50)) + '%';
        else if (wType === 'dxa' && wVal > 0) tblStyles.push('width:' + Math.round(wVal / 15) + 'px');
      }
      if (!tblStyles.some(s => s.startsWith('width:'))) tblStyles.push('width:' + tblWidthPct);
      const jc = firstChildByLocal(tblPr, 'jc');
      if (jc) {
        const jv = getAttrVal(jc, 'val');
        if (jv === 'center') tblStyles.push('margin:10px auto');
        else if (jv === 'left') tblStyles.push('margin:10px auto 10px 0');
        else tblStyles.push('margin:10px 0 10px auto');
      }
      const bidiVis = firstChildByLocal(tblPr, 'bidiVisual');
      if (bidiVis) tblStyles.push('direction:rtl');
    } else {
      tblStyles.push('width:100%');
    }

    const trEls = [];
    for (const ch of tblEl.childNodes) {
      if (ch.nodeType === 1 && ch.localName === 'tr') trEls.push(ch);
    }

    // Track vertical merge (rowspan)
    const gridRows = [];
    const openVMerge = {};
    trEls.forEach((trEl, rIdx) => {
      const rowCells = [];
      const trPr = firstChildByLocal(trEl, 'trPr');
      const isHeaderRow = trPr && !!firstChildByLocal(trPr, 'tblHeader');
      let colIdx = 0;

      for (const tc of trEl.childNodes) {
        if (tc.nodeType !== 1 || tc.localName !== 'tc') continue;
        const tcPr = firstChildByLocal(tc, 'tcPr');
        let colspan = 1;
        let vMerge = null;
        const tcStyles = [];

        if (tcPr) {
          const gs = firstChildByLocal(tcPr, 'gridSpan');
          if (gs) colspan = Math.max(1, parseInt(getAttrVal(gs, 'val'), 10) || 1);

          const vm = firstChildByLocal(tcPr, 'vMerge');
          if (vm) {
            const vVal = getAttrVal(vm, 'val');
            vMerge = vVal === 'restart' ? 'restart' : 'continue';
          }

          const tcW = firstChildByLocal(tcPr, 'tcW');
          if (tcW) {
            const wVal = parseInt(getAttrVal(tcW, 'w'), 10) || 0;
            const wType = getAttrVal(tcW, 'type');
            if (wType === 'pct' && wVal > 0) tcStyles.push('width:' + Math.round(wVal / 50) + '%');
            else if (wType === 'dxa' && wVal > 0 && totalGridW > 0) {
              tcStyles.push('width:' + Math.round((wVal / totalGridW) * 100) + '%');
            }
          } else if (totalGridW > 0 && gridCols[colIdx]) {
            let spanW = 0;
            for (let k = 0; k < colspan; k++) spanW += (gridCols[colIdx + k] || 0);
            if (spanW > 0) tcStyles.push('width:' + Math.round((spanW / totalGridW) * 100) + '%');
          }

          const shd = firstChildByLocal(tcPr, 'shd');
          if (shd) {
            const fill = getAttrVal(shd, 'fill');
            if (fill && fill !== 'auto' && /^[0-9a-fA-F]{6}$/.test(fill)) {
              tcStyles.push('background-color:#' + fill);
            }
          }

          const vAlign = firstChildByLocal(tcPr, 'vAlign');
          if (vAlign) {
            const va = getAttrVal(vAlign, 'val');
            if (va === 'center') tcStyles.push('vertical-align:middle');
            else if (va === 'bottom') tcStyles.push('vertical-align:bottom');
            else if (va === 'top') tcStyles.push('vertical-align:top');
          }

          const tcBorders = firstChildByLocal(tcPr, 'tcBorders');
          if (tcBorders) {
            ['top', 'right', 'bottom', 'left'].forEach(side => {
              const bEl = firstChildByLocal(tcBorders, side);
              if (bEl) {
                const bVal = getAttrVal(bEl, 'val');
                if (bVal === 'none' || bVal === 'nil') {
                  tcStyles.push(`border-${side}:none`);
                } else {
                  const bColor = getAttrVal(bEl, 'color');
                  const cHex = (bColor && bColor !== 'auto' && /^[0-9a-fA-F]{6}$/.test(bColor)) ? '#' + bColor : '#cbd5e1';
                  tcStyles.push(`border-${side}:1px solid ${cHex}`);
                }
              }
            });
          }
        }

        if (vMerge === 'continue' && openVMerge[colIdx]) {
          openVMerge[colIdx].rowspan += 1;
          colIdx += colspan;
          continue;
        }

        let cellContent = '';
        for (const child of tc.childNodes) {
          if (child.nodeType !== 1) continue;
          if (child.localName === 'p') cellContent += renderParagraph(child);
          else if (child.localName === 'tbl') cellContent += renderTable(child);
        }

        const cellObj = {
          tag: isHeaderRow ? 'th' : 'td',
          colspan,
          rowspan: 1,
          style: tcStyles.join(';'),
          html: cellContent || '&nbsp;'
        };
        rowCells.push(cellObj);

        if (vMerge === 'restart') {
          openVMerge[colIdx] = cellObj;
        } else {
          delete openVMerge[colIdx];
        }
        colIdx += colspan;
      }
      gridRows.push(rowCells);
    });

    let rowsHtml = '';
    for (const r of gridRows) {
      let cellsHtml = '';
      for (const c of r) {
        const attrs = [];
        if (c.colspan > 1) attrs.push(`colspan="${c.colspan}"`);
        if (c.rowspan > 1) attrs.push(`rowspan="${c.rowspan}"`);
        if (c.style) attrs.push(`style="${c.style}"`);
        cellsHtml += `<${c.tag}${attrs.length ? ' ' + attrs.join(' ') : ''}>${c.html}</${c.tag}>`;
      }
      rowsHtml += '<tr>' + cellsHtml + '</tr>';
    }
    return `<table style="${tblStyles.join(';')}">${rowsHtml}</table>`;
  }

  let out = '';
  for (const ch of body.childNodes) {
    if (ch.nodeType !== 1) continue;
    if (ch.localName === 'p') out += renderParagraph(ch);
    else if (ch.localName === 'tbl') out += renderTable(ch);
  }
  return out || '<p><br></p>';
}

async function parseOdtToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const contentBytes = entries['content.xml'];
  if (!contentBytes) throw new Error('ملف ODT غير صالح');
  const xmlDoc = new DOMParser().parseFromString(new TextDecoder('utf-8').decode(contentBytes), 'application/xml');
  const textBody = xmlDoc.getElementsByTagNameNS('*', 'text')[0] || xmlDoc.documentElement;

  let out = '';
  function walkOdt(node) {
    let html = '';
    for (const ch of node.childNodes) {
      if (ch.nodeType === 3) {
        html += escapeHtmlStr(ch.nodeValue);
      } else if (ch.nodeType === 1) {
        const ln = ch.localName;
        if (ln === 'h') {
          const lvl = Math.min(6, Math.max(1, parseInt(ch.getAttribute('text:outline-level') || '2', 10)));
          html += `<h${lvl}>${walkOdt(ch)}</h${lvl}>`;
        } else if (ln === 'p') {
          const inner = walkOdt(ch);
          html += `<p>${inner || '<br>'}</p>`;
        } else if (ln === 'list') {
          html += `<ul>${walkOdt(ch)}</ul>`;
        } else if (ln === 'list-item') {
          html += `<li>${walkOdt(ch)}</li>`;
        } else if (ln === 'table') {
          html += `<table>${walkOdt(ch)}</table>`;
        } else if (ln === 'table-row') {
          html += `<tr>${walkOdt(ch)}</tr>`;
        } else if (ln === 'table-cell') {
          html += `<td>${walkOdt(ch) || '&nbsp;'}</td>`;
        } else if (ln === 'image') {
          const href = ch.getAttribute('xlink:href') || '';
          if (href && entries[href]) {
            const mime = guessImageMime(href);
            html += `<img src="data:${mime};base64,${uint8ToBase64(entries[href])}" style="max-width:100%;height:auto;display:block;margin:8px auto;">`;
          }
        } else if (ln === 'line-break') {
          html += '<br>';
        } else if (ln === 'tab') {
          html += '&emsp;';
        } else {
          html += walkOdt(ch);
        }
      }
    }
    return html;
  }
  out = walkOdt(textBody);
  return out || '<p><br></p>';
}

async function parseXlsxToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const dec = new TextDecoder('utf-8');
  const parser = new DOMParser();

  const shared = [];
  if (entries['xl/sharedStrings.xml']) {
    const ssDoc = parser.parseFromString(dec.decode(entries['xl/sharedStrings.xml']), 'application/xml');
    const sis = ssDoc.getElementsByTagNameNS('*', 'si');
    for (const si of sis) {
      shared.push(si.textContent || '');
    }
  }

  const sheetNames = Object.keys(entries)
    .filter(k => /^xl\/worksheets\/sheet\d+\.xml$/i.test(k))
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));

  if (!sheetNames.length) throw new Error('لم يتم العثور على أوراق عمل');

  let out = '';
  sheetNames.forEach((sName, idx) => {
    const sDoc = parser.parseFromString(dec.decode(entries[sName]), 'application/xml');
    const rows = sDoc.getElementsByTagNameNS('*', 'row');
    if (sheetNames.length > 1) out += `<h3>ورقة ${idx + 1}</h3>`;
    let tbl = '<table>';
    for (const row of rows) {
      let tr = '<tr>';
      const cells = row.getElementsByTagNameNS('*', 'c');
      for (const c of cells) {
        const t = c.getAttribute('t');
        const vEl = c.getElementsByTagNameNS('*', 'v')[0];
        const isEl = c.getElementsByTagNameNS('*', 'is')[0];
        let val = '';
        if (t === 's' && vEl) {
          val = shared[parseInt(vEl.textContent, 10)] || '';
        } else if (isEl) {
          val = isEl.textContent || '';
        } else if (vEl) {
          val = vEl.textContent || '';
        }
        tr += `<td>${escapeHtmlStr(val)}</td>`;
      }
      tr += '</tr>';
      tbl += tr;
    }
    tbl += '</table>';
    out += tbl;
  });
  return out;
}

async function parsePptxToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const dec = new TextDecoder('utf-8');
  const parser = new DOMParser();
  const slides = Object.keys(entries)
    .filter(k => /^ppt\/slides\/slide\d+\.xml$/i.test(k))
    .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  if (!slides.length) throw new Error('لم يتم العثور على شرائح');

  let out = '';
  slides.forEach((sPath, idx) => {
    const doc = parser.parseFromString(dec.decode(entries[sPath]), 'application/xml');
    out += `<h3>شريحة ${idx + 1}</h3>`;
    const ps = doc.getElementsByTagNameNS('*', 'p');
    for (const p of ps) {
      const txt = (p.textContent || '').trim();
      if (txt) out += `<p>${escapeHtmlStr(txt)}</p>`;
    }
    out += '<hr class="pdf-page-sep">';
  });
  return out;
}

async function parseEpubToHtml(buffer) {
  const entries = await readZipEntries(buffer);
  const dec = new TextDecoder('utf-8');
  const parser = new DOMParser();
  const htmlFiles = Object.keys(entries)
    .filter(k => /\.(xhtml|html|htm)$/i.test(k) && !/nav\./i.test(k))
    .sort();
  if (!htmlFiles.length) throw new Error('لم يتم العثور على صفحات قابلة للقراءة');

  let out = '';
  for (const hf of htmlFiles) {
    const doc = parser.parseFromString(dec.decode(entries[hf]), 'text/html');
    doc.querySelectorAll('script, style, link').forEach(el => el.remove());
    if (doc.body && doc.body.innerHTML.trim()) {
      out += doc.body.innerHTML + '<hr class="pdf-page-sep">';
    }
  }
  return out || '<p><br></p>';
}

function parseRtfToHtml(rtfText) {
  const win1256 = new TextDecoder('windows-1256');
  let out = '';
  let i = 0;
  let skipGroup = false;
  const skipStack = [];

  while (i < rtfText.length) {
    const ch = rtfText[i];
    if (ch === '{') {
      skipStack.push(skipGroup);
      const ahead = rtfText.slice(i + 1, i + 20);
      if (/^\\(fonttbl|colortbl|stylesheet|info|pict|object|\*\\)/.test(ahead)) {
        skipGroup = true;
      }
      i++;
    } else if (ch === '}') {
      skipGroup = skipStack.pop() || false;
      i++;
    } else if (skipGroup) {
      i++;
    } else if (ch === '\\') {
      i++;
      if (i >= rtfText.length) break;
      const next = rtfText[i];
      if (next === "'" && i + 2 < rtfText.length) {
        const hexBytes = [];
        while (i < rtfText.length && rtfText[i] === "'" && i + 2 < rtfText.length) {
          hexBytes.push(parseInt(rtfText.slice(i + 1, i + 3), 16));
          i += 3;
          if (rtfText[i] === '\\' && rtfText[i + 1] === "'") {
            i++;
          } else {
            break;
          }
        }
        out += escapeHtmlStr(win1256.decode(new Uint8Array(hexBytes)));
      } else if (next === '\\' || next === '{' || next === '}') {
        out += escapeHtmlStr(next);
        i++;
      } else if (next === '\r' || next === '\n') {
        i++;
      } else {
        const m = rtfText.slice(i).match(/^([a-zA-Z]+)(-?\d+)? ?/);
        if (m) {
          const word = m[1];
          const param = m[2];
          i += m[0].length;
          if (word === 'par' || word === 'line') out += '<br>';
          else if (word === 'tab') out += '&emsp;';
          else if (word === 'u' && param !== undefined) {
            let code = parseInt(param, 10);
            if (code < 0) code += 65536;
            out += escapeHtmlStr(String.fromCharCode(code));
            if (rtfText[i] === '?') i++;
          }
        } else {
          i++;
        }
      }
    } else if (ch === '\r' || ch === '\n') {
      i++;
    } else {
      out += escapeHtmlStr(ch);
      i++;
    }
  }
  return '<p>' + out.replace(/(<br>)+/g, '</p><p>') + '</p>';
}

function parseMarkdownToHtml(md) {
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  let html = '';
  let inCode = false;
  let codeBuf = [];
  let inList = false;

  function inlineMd(s) {
    let t = escapeHtmlStr(s);
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/~~([^~]+)~~/g, '<s>$1</s>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    return t;
  }

  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inList) { html += '</ul>'; inList = false; }
      if (!inCode) {
        inCode = true;
        codeBuf = [];
      } else {
        inCode = false;
        html += '<pre>' + escapeHtmlStr(codeBuf.join('\n')) + '</pre>';
      }
      continue;
    }
    if (inCode) {
      codeBuf.push(line);
      continue;
    }
    const hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h${hm[1].length}>${inlineMd(hm[2])}</h${hm[1].length}>`;
      continue;
    }
    if (/^>\s?/.test(line)) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<blockquote>${inlineMd(line.replace(/^>\s?/, ''))}</blockquote>`;
      continue;
    }
    const lm = line.match(/^\s*[-*+]\s+(.*)$/) || line.match(/^\s*\d+\.\s+(.*)$/);
    if (lm) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(lm[1])}</li>`;
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^---+$/.test(line.trim())) {
      html += '<hr class="pdf-page-sep">';
    } else if (line.trim() === '') {
      html += '<p><br></p>';
    } else {
      html += `<p>${inlineMd(line)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  if (inCode) html += '<pre>' + escapeHtmlStr(codeBuf.join('\n')) + '</pre>';
  return html;
}

function parseCsvToHtml(text, delimiter) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (ch === '"') {
        inQuotes = false;
      } else {
        cell += ch;
      }
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === delimiter) { row.push(cell); cell = ''; }
      else if (ch === '\r' && text[i + 1] === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; i++; }
      else if (ch === '\n' || ch === '\r') { row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  if (!rows.length) return '<p><br></p>';

  let html = '<table>';
  rows.forEach((r, idx) => {
    const tag = idx === 0 ? 'th' : 'td';
    html += '<tr>' + r.map(c => `<${tag}>${escapeHtmlStr(c)}</${tag}>`).join('') + '</tr>';
  });
  html += '</table>';
  return html;
}

function parseLegacyDocToHtml(buffer) {
  const textAttempt = decodeTextBuffer(buffer).trim();
  if (/^<!doctype|^<html|^<xml|^MIME-Version:/i.test(textAttempt)) {
    const doc = new DOMParser().parseFromString(textAttempt, 'text/html');
    doc.querySelectorAll('script, style, link').forEach(el => el.remove());
    return doc.body ? doc.body.innerHTML : textAttempt;
  }
  const bytes = new Uint8Array(buffer);
  let extracted = '';
  let run = '';
  for (let i = 0; i + 1 < bytes.length; i += 2) {
    const code = bytes[i] | (bytes[i + 1] << 8);
    if ((code >= 0x0600 && code <= 0x06FF) || (code >= 0x0020 && code <= 0x007E) || code === 0x000A || code === 0x000D) {
      run += code === 0x000D ? '\n' : String.fromCharCode(code);
    } else {
      if (run.trim().length >= 4) extracted += run + '\n';
      run = '';
    }
  }
  if (run.trim().length >= 4) extracted += run;
  if (!extracted.trim()) {
    extracted = textAttempt.replace(/[^\u0600-\u06FF\u0020-\u007E\n]/g, ' ');
  }
  return extracted.split(/\n+/).filter(l => l.trim()).map(l => `<p>${escapeHtmlStr(l)}</p>`).join('') || '<p><br></p>';
}

function closePdfModeModal() {
  document.getElementById('pdfModeModal').classList.remove('show');
  pendingPdfFile = null;
}

async function choosePdfOpenMode(mode) {
  const file = pendingPdfFile;
  closePdfModeModal();
  if (!file) return;

  if (typeof pdfjsLib === 'undefined') {
    showToast('❌ مكتبة PDF غير متوفرة حالياً (تحقق من الاتصال بالإنترنت)', 'error');
    return;
  }

  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  showToast('⏳ جاري فتح ملف PDF...', '');

  try {
    const buffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer, isEvalSupported: false }).promise;
    let outHtml = '';

    if (mode === 'images') {
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({ scale: 1.8 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext('2d');
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
        outHtml += `<p style="text-align:center;"><img src="${dataUrl}" style="max-width:100%;height:auto;border-radius:4px;display:block;margin:8px auto;"></p>`;
      }
    } else {
      for (let p = 1; p <= pdf.numPages; p++) {
        const page = await pdf.getPage(p);
        const textContent = await page.getTextContent();
        const linesMap = new Map();
        for (const item of textContent.items) {
          if (!item.str) continue;
          const y = Math.round(item.transform[5] / 4) * 4;
          if (!linesMap.has(y)) linesMap.set(y, []);
          linesMap.get(y).push(item);
        }
        const sortedYs = Array.from(linesMap.keys()).sort((a, b) => b - a);
        for (const y of sortedYs) {
          const lineItems = linesMap.get(y).sort((a, b) => a.transform[4] - b.transform[4]);
          const lineText = lineItems.map(it => it.str).join(' ').replace(/\s+/g, ' ').trim();
          if (lineText) outHtml += `<p>${escapeHtmlStr(lineText)}</p>`;
        }
        if (p < pdf.numPages) outHtml += '<hr class="pdf-page-sep">';
      }
    }

    applyOpenedHtml(outHtml, file.name);
  } catch (err) {
    console.error('PDF open error:', err);
    showToast('❌ تعذر فتح ملف PDF: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

async function processOpenFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const type = (file.type || '').toLowerCase();

  if (ext === 'pdf' || type === 'application/pdf') {
    pendingPdfFile = file;
    document.getElementById('pdfModeFileName').textContent = 'الملف: ' + file.name + '\nاختر طريقة فتح ملف PDF:';
    document.getElementById('pdfModeModal').classList.add('show');
    return;
  }

  if (type.startsWith('image/') || ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'ico'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = function(e) {
      applyOpenedHtml(`<p style="text-align:center;"><img src="${e.target.result}" style="max-width:100%;height:auto;border-radius:4px;display:block;margin:10px auto;"></p>`, file.name);
    };
    reader.readAsDataURL(file);
    return;
  }

  showToast('⏳ جاري فتح الملف...', '');

  try {
    const buffer = await file.arrayBuffer();

    if (ext === 'docx') {
      const htmlOut = await parseDocxToHtml(buffer);
      applyOpenedHtml(htmlOut, file.name);
    } else if (ext === 'odt') {
      const htmlOut = await parseOdtToHtml(buffer);
      applyOpenedHtml(htmlOut, file.name);
    } else if (ext === 'xlsx') {
      const htmlOut = await parseXlsxToHtml(buffer);
      applyOpenedHtml(htmlOut, file.name);
    } else if (ext === 'pptx') {
      const htmlOut = await parsePptxToHtml(buffer);
      applyOpenedHtml(htmlOut, file.name);
    } else if (ext === 'epub') {
      const htmlOut = await parseEpubToHtml(buffer);
      applyOpenedHtml(htmlOut, file.name);
    } else if (ext === 'doc') {
      const htmlOut = parseLegacyDocToHtml(buffer);
      applyOpenedHtml(htmlOut, file.name);
    } else if (ext === 'rtf') {
      const txt = decodeTextBuffer(buffer);
      applyOpenedHtml(parseRtfToHtml(txt), file.name);
    } else if (ext === 'md' || ext === 'markdown') {
      const txt = decodeTextBuffer(buffer);
      applyOpenedHtml(parseMarkdownToHtml(txt), file.name);
    } else if (ext === 'html' || ext === 'htm' || ext === 'xhtml') {
      const txt = decodeTextBuffer(buffer);
      const doc = new DOMParser().parseFromString(txt, 'text/html');
      doc.querySelectorAll('script, iframe, object').forEach(el => el.remove());
      applyOpenedHtml(doc.body ? doc.body.innerHTML : escapeHtmlStr(txt), file.name);
    } else if (ext === 'csv' || ext === 'tsv') {
      const txt = decodeTextBuffer(buffer);
      const delim = ext === 'tsv' ? '\t' : (txt.split('\n')[0].includes(';') && !txt.split('\n')[0].includes(',') ? ';' : ',');
      applyOpenedHtml(parseCsvToHtml(txt, delim), file.name);
    } else if (ext === 'json') {
      const txt = decodeTextBuffer(buffer);
      let formatted = txt;
      try { formatted = JSON.stringify(JSON.parse(txt), null, 2); } catch (e) {}
      applyOpenedHtml(`<pre>${escapeHtmlStr(formatted)}</pre>`, file.name);
    } else if (ext === 'xml' || ext === 'svg' || ext === 'yaml' || ext === 'yml' || ext === 'css' || ext === 'js') {
      const txt = decodeTextBuffer(buffer);
      applyOpenedHtml(`<pre>${escapeHtmlStr(txt)}</pre>`, file.name);
    } else {
      const txt = decodeTextBuffer(buffer);
      const htmlOut = txt.replace(/\r\n/g, '\n').split('\n').map(l => l.trim() ? `<p>${escapeHtmlStr(l)}</p>` : '<p><br></p>').join('');
      applyOpenedHtml(htmlOut, file.name);
    }
  } catch (err) {
    console.error('Open file error:', err);
    showToast('❌ تعذر فتح الملف: ' + (err.message || 'صيغة غير مدعومة'), 'error');
  }
}

// مساعدات بناء ملف DOCX حقيقي (ZIP Store + OOXML) يفتح على أي جوال
function xmlEscape(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;');
}

function rgbToHex(color) {
  if (!color) return null;
  if (color.startsWith('#')) {
    let h = color.slice(1);
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    return /^[0-9a-fA-F]{6}$/.test(h) ? h.toUpperCase() : null;
  }
  const m = color.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/i);
  if (!m) return null;
  return [m[1], m[2], m[3]].map(n => Number(n).toString(16).padStart(2, '0')).join('').toUpperCase();
}

function buildZipStore(entries) {
  const enc = new TextEncoder();
  const crcTable = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[i] = c >>> 0;
  }
  function crc32(bytes) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) c = crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  const localParts = [];
  const centralParts = [];
  let offset = 0;

  entries.forEach(entry => {
    const nameBytes = enc.encode(entry.name);
    const data = entry.data instanceof Uint8Array ? entry.data : enc.encode(entry.data);
    const crc = crc32(data);
    const size = data.length;

    const lh = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034B50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, size, true);
    lv.setUint32(22, size, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);

    localParts.push(lh, data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014B50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, size, true);
    cv.setUint32(24, size, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);

    centralParts.push(ch);
    offset += lh.length + size;
  });

  const centralSize = centralParts.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054B50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...localParts, ...centralParts, eocd], {
    type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  });
}

// 3. تصدير Word حقيقي (.docx) بمقاس A4 واتجاه عربي يفتح على أي جوال
function exportWord() {
  const clone = editor.cloneNode(true);
  clone.querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.outline = 'none';
  });

  const mediaFiles = [];
  const fontSizeMap = { '1': 20, '2': 24, '3': 28, '4': 36, '5': 48, '6': 64, '7': 96 };

  function buildRunProps(st) {
    let rPr = st.ltr ? '' : '<w:rtl/>';
    if (st.bold) rPr += '<w:b/><w:bCs/>';
    if (st.italic) rPr += '<w:i/><w:iCs/>';
    if (st.underline) rPr += '<w:u w:val="single"/>';
    if (st.strike) rPr += '<w:strike/>';
    if (st.color) rPr += `<w:color w:val="${st.color}"/>`;
    const sz = st.size || 28;
    rPr += `<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/>`;
    const font = st.font || 'Cairo';
    rPr += `<w:rFonts w:ascii="${xmlEscape(font)}" w:hAnsi="${xmlEscape(font)}" w:cs="${xmlEscape(font)}"/>`;
    rPr += '<w:lang w:val="en-US" w:bidi="ar-SA"/>';
    return `<w:rPr>${rPr}</w:rPr>`;
  }

  function extractRuns(node, st, runs) {
    if (node.nodeType === Node.TEXT_NODE) {
      const txt = node.nodeValue;
      if (txt) {
        runs.push(`<w:r>${buildRunProps(st)}<w:t xml:space="preserve">${xmlEscape(txt)}</w:t></w:r>`);
      }
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;

    const tag = node.tagName.toUpperCase();
    if (tag === 'BR') {
      runs.push('<w:r><w:br/></w:r>');
      return;
    }
    if (tag === 'IMG') {
      const src = node.getAttribute('src') || '';
      const m = src.match(/^data:image\/(png|jpeg|jpg|gif|webp);base64,(.+)$/i);
      if (m) {
        const ext = m[1].toLowerCase() === 'jpg' ? 'jpeg' : m[1].toLowerCase();
        const bin = atob(m[2]);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const idx = mediaFiles.length + 1;
        const rId = 'rIdImg' + idx;
        mediaFiles.push({ name: `word/media/image${idx}.${ext}`, ext, rId, data: bytes });
        const maxCx = 5400000;
        const w = node.naturalWidth || 400;
        const h = node.naturalHeight || 300;
        const cx = maxCx;
        const cy = Math.round(maxCx * (h / Math.max(1, w)));
        runs.push(`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${idx}" name="Picture ${idx}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${idx}" name="Picture ${idx}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`);
      }
      return;
    }

    const next = Object.assign({}, st);
    if (tag === 'B' || tag === 'STRONG' || tag === 'TH') next.bold = true;
    if (tag === 'I' || tag === 'EM') next.italic = true;
    if (tag === 'U') next.underline = true;
    if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') next.strike = true;
    if (node.getAttribute && node.getAttribute('dir') === 'ltr') next.ltr = true;
    if (node.getAttribute && node.getAttribute('dir') === 'rtl') next.ltr = false;
    if (tag === 'FONT') {
      if (node.getAttribute('face')) next.font = node.getAttribute('face');
      if (node.getAttribute('color')) next.color = rgbToHex(node.getAttribute('color')) || next.color;
      if (node.getAttribute('size') && fontSizeMap[node.getAttribute('size')]) next.size = fontSizeMap[node.getAttribute('size')];
    }
    const cs = node.style;
    if (cs) {
      if (cs.direction === 'ltr') next.ltr = true;
      if (cs.direction === 'rtl') next.ltr = false;
      if (cs.fontWeight === 'bold' || Number(cs.fontWeight) >= 600) next.bold = true;
      if (cs.fontStyle === 'italic') next.italic = true;
      if (cs.textDecoration && cs.textDecoration.includes('underline')) next.underline = true;
      if (cs.textDecoration && cs.textDecoration.includes('line-through')) next.strike = true;
      if (cs.color) next.color = rgbToHex(cs.color) || next.color;
      if (cs.fontFamily) next.font = cs.fontFamily.replace(/['"]/g, '').split(',')[0].trim();
    }

    for (const child of node.childNodes) {
      extractRuns(child, next, runs);
    }
  }

  function getDir(el) {
    let curr = el;
    while (curr && curr.nodeType === 1) {
      const d = (curr.style && curr.style.direction) || (curr.getAttribute && curr.getAttribute('dir'));
      if (d === 'ltr' || d === 'rtl') return d;
      curr = curr.parentNode;
    }
    return 'rtl';
  }

  function getAlign(el, defaultAlign) {
    let curr = el;
    while (curr && curr.nodeType === 1) {
      const a = (curr.style && curr.style.textAlign) || (curr.getAttribute && curr.getAttribute('align')) || '';
      if (a === 'center') return 'center';
      if (a === 'justify') return 'both';
      curr = curr.parentNode;
    }
    return defaultAlign || 'both';
  }

  function makeParagraphXml(runs, align, dir) {
    const jc = align || 'both';
    const bidiTag = dir === 'ltr' ? '' : '<w:bidi w:val="1"/>';
    return `<w:p><w:pPr>${bidiTag}<w:jc w:val="${jc}"/></w:pPr>${runs.join('')}</w:p>`;
  }

  const bodyBlocks = [];
  function pushParagraph(runs, align, dir) {
    bodyBlocks.push(makeParagraphXml(runs, align, dir || 'rtl'));
  }

  function buildTableXml(tblEl) {
    const tblDir = getDir(tblEl);
    const bidiVisual = tblDir === 'ltr' ? '' : '<w:bidiVisual/>';
    const rows = Array.from(tblEl.querySelectorAll(':scope > tr, :scope > thead > tr, :scope > tbody > tr, :scope > tfoot > tr'));
    if (!rows.length) return '';

    const occupied = {};
    let trXml = '';

    rows.forEach((tr, rIdx) => {
      let tcXml = '';
      let cIdx = 0;

      function emitMergedPlaceholders() {
        while (occupied[rIdx + '_' + cIdx]) {
          const spanInfo = occupied[rIdx + '_' + cIdx];
          const gs = spanInfo.colspan > 1 ? `<w:gridSpan w:val="${spanInfo.colspan}"/>` : '';
          const shd = spanInfo.fill ? `<w:shd w:val="clear" w:color="auto" w:fill="${spanInfo.fill}"/>` : '';
          tcXml += `<w:tc><w:tcPr>${gs}<w:vMerge/>${shd}</w:tcPr><w:p><w:pPr><w:bidi w:val="1"/><w:jc w:val="both"/></w:pPr></w:p></w:tc>`;
          cIdx += spanInfo.colspan;
        }
      }

      emitMergedPlaceholders();

      for (const cell of tr.children) {
        const cTag = cell.tagName ? cell.tagName.toUpperCase() : '';
        if (cTag !== 'TD' && cTag !== 'TH') continue;

        emitMergedPlaceholders();

        const colspan = Math.max(1, parseInt(cell.getAttribute('colspan') || '1', 10));
        const rowspan = Math.max(1, parseInt(cell.getAttribute('rowspan') || '1', 10));
        const cs = cell.style || {};
        let fill = rgbToHex(cs.backgroundColor);
        if (!fill && cTag === 'TH') fill = 'F1F5F9';

        if (rowspan > 1) {
          for (let rr = 1; rr < rowspan; rr++) {
            occupied[(rIdx + rr) + '_' + cIdx] = { colspan, fill };
          }
        }

        let tcPr = '';
        if (cs.width && cs.width.endsWith('%')) {
          const pct = Math.round(parseFloat(cs.width) * 50);
          if (pct > 0) tcPr += `<w:tcW w:w="${pct}" w:type="pct"/>`;
        } else {
          tcPr += '<w:tcW w:w="0" w:type="auto"/>';
        }
        if (colspan > 1) tcPr += `<w:gridSpan w:val="${colspan}"/>`;
        if (rowspan > 1) tcPr += '<w:vMerge w:val="restart"/>';
        if (fill) tcPr += `<w:shd w:val="clear" w:color="auto" w:fill="${fill}"/>`;
        if (cs.verticalAlign === 'middle') tcPr += '<w:vAlign w:val="center"/>';
        else if (cs.verticalAlign === 'bottom') tcPr += '<w:vAlign w:val="bottom"/>';
        else tcPr += '<w:vAlign w:val="top"/>';

        const cellBlocks = [];
        const baseStyle = cTag === 'TH' ? { bold: true } : {};
        const cellDir = getDir(cell);
        const cellAlign = getAlign(cell, 'both');

        let cellInline = [];
        function flushCellInline() {
          if (cellInline.length) {
            cellBlocks.push(makeParagraphXml(cellInline, cellAlign, cellDir));
            cellInline = [];
          }
        }

        for (const ch of cell.childNodes) {
          if (ch.nodeType === Node.TEXT_NODE) {
            if (ch.nodeValue.trim() || ch.nodeValue.includes(' ')) {
              extractRuns(ch, baseStyle, cellInline);
            }
          } else if (ch.nodeType === Node.ELEMENT_NODE) {
            const chTag = ch.tagName.toUpperCase();
            if (chTag === 'P' || chTag === 'DIV' || /^H[1-6]$/.test(chTag)) {
              flushCellInline();
              const runs = [];
              extractRuns(ch, baseStyle, runs);
              cellBlocks.push(makeParagraphXml(runs, getAlign(ch, cellAlign), getDir(ch)));
            } else if (chTag === 'TABLE') {
              flushCellInline();
              cellBlocks.push(buildTableXml(ch));
            } else {
              extractRuns(ch, baseStyle, cellInline);
            }
          }
        }
        flushCellInline();
        if (!cellBlocks.length) {
          cellBlocks.push(makeParagraphXml([], cellAlign, cellDir));
        }

        tcXml += `<w:tc><w:tcPr>${tcPr}</w:tcPr>${cellBlocks.join('')}</w:tc>`;
        cIdx += colspan;
      }

      emitMergedPlaceholders();
      trXml += `<w:tr>${tcXml}</w:tr>`;
    });

    return `<w:tbl>
      <w:tblPr>
        ${bidiVisual}
        <w:tblW w:w="5000" w:type="pct"/>
        <w:tblBorders>
          <w:top w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:left w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:bottom w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:right w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:insideH w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
          <w:insideV w:val="single" w:sz="4" w:space="0" w:color="CBD5E1"/>
        </w:tblBorders>
        <w:tblCellMar>
          <w:top w:w="80" w:type="dxa"/>
          <w:left w:w="100" w:type="dxa"/>
          <w:bottom w:w="80" w:type="dxa"/>
          <w:right w:w="100" w:type="dxa"/>
        </w:tblCellMar>
      </w:tblPr>
      ${trXml}
    </w:tbl>`;
  }

  let inlineBuffer = [];
  function flushInline(dir, align) {
    if (inlineBuffer.length) {
      pushParagraph(inlineBuffer, align || 'both', dir || 'rtl');
      inlineBuffer = [];
    }
  }

  function hasBlockChild(el) {
    for (const ch of el.childNodes) {
      if (ch.nodeType === 1) {
        const t = ch.tagName.toUpperCase();
        if (['P', 'DIV', 'TABLE', 'UL', 'OL', 'BLOCKQUOTE', 'PRE', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6'].includes(t)) {
          return true;
        }
      }
    }
    return false;
  }

  function walkBlocks(container) {
    for (const node of container.childNodes) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (node.nodeValue.trim() || node.nodeValue.includes(' ')) {
          extractRuns(node, {}, inlineBuffer);
        }
        continue;
      }
      if (node.nodeType !== Node.ELEMENT_NODE) continue;
      const tag = node.tagName.toUpperCase();

      if (tag === 'TABLE') {
        flushInline();
        const tblXml = buildTableXml(node);
        if (tblXml) bodyBlocks.push(tblXml);
      } else if (tag === 'UL' || tag === 'OL') {
        flushInline();
        let idx = 1;
        for (const li of node.children) {
          if (li.tagName && li.tagName.toUpperCase() === 'LI') {
            const prefix = tag === 'OL' ? `${idx++}. ` : '• ';
            const runs = [`<w:r><w:rPr><w:rtl/><w:sz w:val="28"/><w:szCs w:val="28"/></w:rPr><w:t xml:space="preserve">${xmlEscape(prefix)}</w:t></w:r>`];
            extractRuns(li, {}, runs);
            pushParagraph(runs, getAlign(li), getDir(li));
          }
        }
      } else if (tag === 'DIV' && hasBlockChild(node)) {
        flushInline();
        walkBlocks(node);
      } else if (tag === 'P' || tag === 'DIV' || tag === 'BLOCKQUOTE' || tag === 'PRE' || /^H[1-6]$/.test(tag)) {
        flushInline();
        const runs = [];
        const base = /^H[1-3]$/.test(tag) ? { bold: true, size: 34 } : (tag === 'PRE' ? { ltr: true, font: 'Courier New', size: 22 } : {});
        extractRuns(node, base, runs);
        pushParagraph(runs, getAlign(node), getDir(node));
      } else {
        extractRuns(node, {}, inlineBuffer);
      }
    }
    flushInline();
  }

  walkBlocks(clone);
  if (!bodyBlocks.length) bodyBlocks.push('<w:p><w:pPr><w:bidi w:val="1"/><w:jc w:val="both"/></w:pPr></w:p>');

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
            xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
            xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">
  <w:body>
    ${bodyBlocks.join('')}
    <w:sectPr>
      <w:pgSz w:w="11906" w:h="16838"/>
      <w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="708" w:footer="708" w:gutter="0"/>
      <w:bidi/>
    </w:sectPr>
  </w:body>
</w:document>`;

  const stylesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
  <w:docDefaults>
    <w:rPrDefault>
      <w:rPr>
        <w:rFonts w:ascii="Cairo" w:hAnsi="Cairo" w:cs="Cairo"/>
        <w:rtl/>
        <w:sz w:val="28"/>
        <w:szCs w:val="28"/>
        <w:lang w:val="en-US" w:bidi="ar-SA"/>
      </w:rPr>
    </w:rPrDefault>
    <w:pPrDefault>
      <w:pPr>
        <w:bidi w:val="1"/>
        <w:jc w:val="both"/>
      </w:pPr>
    </w:pPrDefault>
  </w:docDefaults>
  <w:style w:type="paragraph" w:default="1" w:styleId="Normal">
    <w:name w:val="Normal"/>
    <w:pPr>
      <w:bidi w:val="1"/>
      <w:jc w:val="both"/>
    </w:pPr>
    <w:rPr>
      <w:rtl/>
    </w:rPr>
  </w:style>
</w:styles>`;

  const docRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  ${mediaFiles.map(m => `<Relationship Id="${m.rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${m.name.split('/').pop()}"/>`).join('')}
</Relationships>`;

  const rootRelsXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Default Extension="png" ContentType="image/png"/>
  <Default Extension="jpeg" ContentType="image/jpeg"/>
  <Default Extension="gif" ContentType="image/gif"/>
  <Default Extension="webp" ContentType="image/webp"/>
  <Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
  <Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const entries = [
    { name: '[Content_Types].xml', data: contentTypesXml },
    { name: '_rels/.rels', data: rootRelsXml },
    { name: 'word/_rels/document.xml.rels', data: docRelsXml },
    { name: 'word/styles.xml', data: stylesXml },
    { name: 'word/document.xml', data: documentXml },
    ...mediaFiles.map(m => ({ name: m.name, data: m.data }))
  ];

  const blob = buildZipStore(entries);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'مستند_Mini_Word.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  showToast('📥 تم تنزيل ملف Word (.docx)', 'success');
}

// 4. تصدير PDF بمقاس A4
function exportPDF() {
  const host = document.createElement('div');
  host.style.position = 'fixed';
  host.style.left = '-99999px';
  host.style.top = '0';
  host.style.width = '180mm';
  host.style.background = '#ffffff';
  host.style.zIndex = '-1';

  const pdfStyle = document.createElement('style');
  pdfStyle.textContent = `
    .pdf-export-root, .pdf-export-root * {
      font-family: Tahoma, Arial, sans-serif !important;
      letter-spacing: 0 !important;
      word-spacing: normal !important;
      font-variant-ligatures: normal !important;
    }
    .pdf-export-root img {
      max-width: 100% !important;
      height: auto !important;
      page-break-inside: avoid;
      break-inside: avoid;
    }
  `;
  host.appendChild(pdfStyle);

  const content = editor.cloneNode(true);
  content.removeAttribute('id');
  content.removeAttribute('contenteditable');
  content.className = 'pdf-export-root';
  content.querySelectorAll('img').forEach(img => {
    img.classList.remove('img-selected');
    img.style.outline = 'none';
  });
  content.style.direction = 'rtl';
  content.style.textAlign = 'justify';
  content.style.fontFamily = 'Tahoma, Arial, sans-serif';
  content.style.fontSize = '14px';
  content.style.lineHeight = '1.85';
  content.style.padding = '0';
  content.style.width = '180mm';
  content.style.minHeight = 'auto';
  content.style.boxShadow = 'none';

  host.appendChild(content);
  document.body.appendChild(host);

  const opt = {
    margin:       [15, 15, 15, 15],
    filename:     'مستند_Mini_Word.pdf',
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2, useCORS: true, letterRendering: false, scrollX: 0, scrollY: 0 },
    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak:    { mode: ['css', 'legacy'], avoid: ['img'] }
  };

  if (typeof html2pdf !== 'undefined') {
    showToast('⏳ جاري تصدير ملف PDF...', '');
    const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    fontsReady.then(() => html2pdf().set(opt).from(content).save()).then(() => {
      showToast('📥 تم تصدير ملف PDF بنجاح', 'success');
    }).catch(() => {
      printAsPDF();
    }).finally(() => {
      if (host.parentNode) host.parentNode.removeChild(host);
    });
  } else {
    if (host.parentNode) host.parentNode.removeChild(host);
    printAsPDF();
  }
}

function printAsPDF() {
  const printWin = window.open('', '_blank');
  if (!printWin) {
    window.print();
    return;
  }
  printWin.document.write(`<!DOCTYPE html>
    <html dir="rtl" lang="ar">
    <head>
      <meta charset="UTF-8">
      <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
      <style>
        @page { size: A4 portrait; margin: 15mm; }
        body { direction: rtl; font-family: 'Cairo', sans-serif; font-size: 14pt; line-height: 1.85; text-align: justify; margin: 0; padding: 20px; }
        img  { max-width: 100%; height: auto; }
      </style>
    </head>
    <body>${editor.innerHTML}</body>
    </html>`);
  printWin.document.close();
  setTimeout(() => { printWin.print(); }, 600);
  showToast('🖨️ جاري فتح الطباعة / PDF', 'success');
}
